# The experiment carries its own toolchain: standards-lab is not a
# development repository and pins nothing.
[tools]
go = "1.27"
golangci-lint = "2.13.2"

[env]
# The compose stack's defaults. The Azurite account and key are the emulator's published
# development credentials, not secrets.
BLOBFS_DSN = "postgres://app:app@127.0.0.1:5434/app?sslmode=disable"
BLOBFS_STORAGE_ENDPOINT = "http://127.0.0.1:10000/devstoreaccount1"
BLOBFS_STORAGE_ACCOUNT = "devstoreaccount1"
BLOBFS_STORAGE_KEY = "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
BLOBFS_STORAGE_CONTAINER = "blobfs"

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run the hermetic tests"
run = "go test -race ./..."

[tasks.integration]
description = "Run the integration tier against the compose stack (BLOBFS_DSN, BLOBFS_STORAGE_*)"
run = "go test -race -tags integration -count=1 ./..."

[tasks.evidence]
description = "Run the read-model cost measurement (proof V1) against the compose stack and write its transcript to evidence/v1-read-model.txt"
run = '''
set -e
mkdir -p evidence
BLOBFS_EVIDENCE=1 go test -tags integration -count=1 -timeout 30m -run '^TestReadModelCost$' -v ./domain/volume | tee evidence/v1-read-model.txt
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint and the SQL conventions lint"
run = "golangci-lint run ./... && go tool sqlint"

[tasks.split-check]
description = "Fail if a package imports what its layer may not (the import boundaries of the library layers and the elemental application layout)"
run = '''
{% raw %}
set -e
fail=0

module='github.com/standards-lab/org/experiments/blobfs'
sqlate='github.com/standards-lab/sqlate'
storage='github.com/standards-lab/go-storage'
cobra='github.com/spf13/cobra'

# report <rule> <offenders>: print the rule's failure and the offenders, and mark the run failed.
report() {
  echo "split-check: $1:"; echo "$2"; fail=1
}

# module_deps <package>: the package's transitive non-test dependencies inside this module,
# the package itself excluded. Empty for a package the current stage has not created yet.
module_deps() {
  [ -d "$1" ] || return 0
  go list -deps "./$1" 2>/dev/null | grep "^$module/" | grep -v "^$module/$1\$" || true
}

# deps <package> <extended-regex>: fail when a transitive non-test dependency of the package
# matches the pattern. go list -deps lists the package itself, which is never a violation of
# its own rule.
deps() {
  [ -d "$1" ] || return 0
  bad=$(go list -deps "./$1" 2>/dev/null | grep -v "^$module/$1\$" | grep -E "$2" || true)
  [ -z "$bad" ] || report "$1 depends on what its layer may not" "$bad"
}

# imports_only <package> <extended-regex>: fail when a direct import of the package inside this
# module does not match the pattern. Direct, because the entry point's transitive closure is
# the whole application by design.
imports_only() {
  [ -d "$1" ] || return 0
  bad=$(go list -f '{{join .Imports "\n"}}' "./$1" 2>/dev/null | grep "^$module/" | grep -v -E "$2" || true)
  [ -z "$bad" ] || report "$1 imports a package of this module other than $2" "$bad"
}

# names <extended-regex for the import path> <extended-regex for the files allowed to name it>
# <description>: fail when a non-test Go file outside the allowed set names the import path.
# A grep, so it also catches an import the build would not resolve yet.
names() {
  bad=$(grep -rl --include='*.go' -E "\"$1" . | grep -v '_test.go$' | sed 's#^\./##' | grep -v -E "$2" || true)
  [ -z "$bad" ] || report "$3" "$bad"
}

# packages <dir>...: the module's package directories under the given directories, relative to
# the module root, one per line; a directory that does not exist yet is skipped.
packages() {
  for d in "$@"; do
    [ -d "$d" ] || continue
    go list -f '{{.Dir}}' "./$d/..." 2>/dev/null | sed "s#^$PWD/##"
  done
}

# app_packages: every root-level application package: the module's packages outside cmd/,
# internal/, and lib/. The integration package is excluded by its build tag.
app_packages() {
  go list -f '{{.Dir}}' ./... 2>/dev/null | sed "s#^$PWD/##" | grep -v -E '^(cmd|internal|lib)(/|$)' || true
}

# --- The library layers under lib/.

# The root package is Go only: no sqlate, no go-storage.
deps lib/blobfs "^($sqlate|$storage)"
# The persistence package takes sqlate but never go-storage, and never the native variant.
deps lib/blobfs/data "^($storage|$module/lib/blobfs/data/pgnative)"
# The native variant takes the persistence package and sqlate only.
deps lib/blobfs/data/pgnative "^($storage|$module/lib/migrator)"
# The migrator shim takes sqlate and the standard library only.
deps lib/migrator "^($storage|$module)"
# The two migration sources take sqlate/migrate only: neither go-storage nor any other package of
# this experiment.
deps lib/blobfs/migrations "^($storage|$module/(lib/blobfs\$|lib/blobfs/data|lib/migrator))"
deps migrations "^($storage|$module/(cmd|internal|lib))"

# No driver outside the native variant, within lib/. The composition root's infrastructure.go
# is the application's one legitimate importer of the driver and the Postgres dialect.
if [ -d lib ]; then
  named=$(grep -rl jackc lib/ --include='*.go' | grep -v -E '_test.go|^lib/blobfs/data/pgnative/' || true)
  [ -z "$named" ] || report "lib/ names the driver outside pgnative" "$named"
fi

# --- The elemental application layout.

# 1. cmd/blobfs imports no package of this module except internal/app.
imports_only cmd/blobfs "^$module/internal/app\$"

# 2. No root-level application package depends on internal/*.
for pkg in $(app_packages); do
  deps "$pkg" "^$module/internal/"
done

# 3. No package under lib/ depends on a package of this module outside lib/.
for pkg in $(packages lib); do
  bad=$(module_deps "$pkg" | grep -v "^$module/lib/" || true)
  [ -z "$bad" ] || report "$pkg depends on a package outside lib/" "$bad"
done

# 4. output depends on no domain, admin, or library package.
deps output "^$module/(domain|admin|lib)/"

# 5. The domain packages and the admin packages do not depend on each other.
for pkg in $(packages domain); do
  deps "$pkg" "^$module/admin/"
done
for pkg in $(packages admin); do
  deps "$pkg" "^$module/domain/"
done

# 6. Only domain/files/storage.go names go-storage, among the application packages. The
# library's packages are covered by their own rules above. The file arrives with the write
# path; the rule names it ahead of that.
bad=$(grep -rl --include='*.go' -E "\"$storage" . | grep -v '_test.go$' | sed 's#^\./##' | grep -v -E '^(lib/|domain/files/storage\.go$)' || true)
[ -z "$bad" ] || report "an application file other than domain/files/storage.go names go-storage" "$bad"

# 7. Only a domain or admin package's database.go names sqlate/query, among the application
# packages. sqlate/migrate is a different package and is not covered.
bad=$(grep -rl --include='*.go' -E "\"$sqlate/query" . | grep -v '_test.go$' | sed 's#^\./##' | grep -v -E '^(lib/|(domain|admin)/[^/]+/database\.go$)' || true)
[ -z "$bad" ] || report "an application file other than a database.go names sqlate/query" "$bad"

# 8. cobra is named only under internal/app/, cmd/, output/, and by a domain or admin package's
# commands.go. Nothing under lib/ names it.
names "$cobra" '^(internal/app/|cmd/|output/|(domain|admin)/[^/]+/commands\.go$)' "a file outside the command layers names cobra"

# 9. Among the application packages, only domain/files/blobfs.go and domain/files/database.go
# name lib/blobfs/data: the translation file composes the library's operations, and the SQL
# client registers the library's pattern namespace in the catalog it builds and lowers the
# consumer's listing to the library's, which is the one place the query library is named.
names "$module/lib/blobfs/data\"" '^(lib/|domain/files/(blobfs|database)\.go$)' "an application file other than domain/files/blobfs.go or database.go names lib/blobfs/data"

[ "$fail" -eq 0 ] && echo "split-check: ok"
exit "$fail"
{% endraw %}
'''

# services
[tasks.up]
description = "Start the local postgres and azurite and wait for health"
run = "docker compose up -d --wait"

[tasks.down]
description = "Stop the local services (keep data)"
run = "docker compose down"

[tasks.reset]
description = "Stop the local services and drop their data"
run = "docker compose down -v"

[tasks.cli]
description = "Run the blobfs command-line file system (arguments follow --)"
run = "go run ./cmd/blobfs"
