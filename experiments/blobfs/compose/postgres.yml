services:
  postgres:
    image: postgres:18-alpine
    container_name: blobfs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # 5434 by default so the stack coexists with sql-dsl and go-web-service on 5433 and 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - blobfs-postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  blobfs-postgres:
