name = "docproc, the processing library and its system tools"
summary = '''
docproc, from spike-ai-pipeline-processing and spike-ai-pipeline's docproc command: an enabling
library, adjacent to the standard, beside sqlate. Its library module requires `golang.org/x/text`
only, drops the client, and depends on no model concept; inference is docinfer's. Its stores are
interfaces with filesystem and memory implementations in the library module, and providers as
nested modules: `docproc/storage` (the content store over go-storage) and `docproc/postgres` (the
index in PostgreSQL over sqlate). The nested `cmd/docproc` requires go-cli-sdk, go-core, and
golang.org/x/sys, and the run directory's `rundir` and `rundir/schema` are public packages of the
library's module, which docinfer's `cmd/docinfer` reads. The system tools docproc runs live beside
it under `tools/<format>`, each on its own toolchain and tagged `tools/<format>/v<version>`, the
subtree kept out of the Go module zip, so a contract change lands with its decoder in one pull
request (plan, 2026-11-12): docproc-ooxml from spike-ai-pipeline-office, docproc-mail from
spike-ai-pipeline-mail, and docproc-onenote from spike-ai-pipeline-onenote. Each tool has one
JSON (JSON Lines) contract with Markdown inside it as the text layer, no separate Markdown mode,
proven by committed golden outputs; batch IDs, per-item digests, provenance, warnings, and typed
metadata stay in docproc, docinfer, and Cerebro. Staged beside wave B's spikes, absorbing
v1.ai.tools (plan, 2026-11-12). docproc joins `exclusive` after wave C.
'''
repos = ["docproc", "architecture"]
root = "docproc"
remote = "https://github.com/standards-lab/docproc.git"
path = "~/architecture/docproc"
order = [
  "layers",
  "design",
  "architecture",
  "ooxml",
  "mail",
  "onenote",
  "library",
  "providers",
  "docproc",
  "reports",
  "acceptance",
  "hardening",
  "mail-hardening",
  "final",
]
context = [
  "standards-lab/context/ai-strategy.md",
  "standards-lab/context/system-tools.md",
  "standards-lab/context/data-intelligence.md",
]

[tasks.layers]
name = "The layers of Cerebro's stack"
summary = '''
Writes docproc's `context/layers.md`: each boundary of Cerebro's stack as signatures or schemas,
traced to a capstone task or spike evidence: the tool contracts (records, the Markdown text layer,
metadata, media); docproc's API (inspection and routing, inference interfaces free of go-ai,
batches as made, index and cache interfaces, event shapes, per-job cancellation); go-ai's surface
as Cerebro uses it; and Cerebro's Queries, Commands, result batches, manifest, and events. Settles
whether the tool contracts stay schema "1", grown by addition, or move to "2"; measures each
tool's duplicated text over ~/docs and cuts structured text with no consumer; and lists what
changes per tool and per package from the spikes. The client, processing, and capstone design
tasks build from it; the gateway stays transparent to go-ai.
'''

[tasks.design]
name = "Design review of docproc and its tools"
summary = '''
Opens with a Fable 5.2 evaluation of each promoted artifact (spike-ai-pipeline-processing, the
spike root's docproc, and the office, mail, and OneNote CLIs) for issues and simplifications,
against the full architecture standards, `layers.md`, and Cerebro's requirements; then reviews
them against the workspace and writes the review into docproc's notes. Settles each tool's
contract additions field by field, each traced to a capstone design task and marked as the
tool's, docproc's, or Cerebro's, and each tool's first tag and release targets. The root's
STANDARDS.md applies cli-applications.md to docproc and domain-files.md to docproc's command
packages only. docinfer's packages are v1.ai.inference's design review.
'''

[tasks.architecture]
name = "A library and its system tools in the architecture"
summary = '''
Writes the go-elemental system-tools page from `system-tools.md`, and the placement rule in
`dependencies.md`, `repository-topology.md`, and `tool-beside-library.md`: a repository's place
follows its base module; nested command and provider modules don't move it (as blobfs's example
module doesn't), nor do the system tools nested in the library that runs them, in another
language (docproc's `tools/`); a cross-repository task orders its own exceptions in its brief.
The adjacent-library rule and where a package's events live are already on the pages.
'''
repos = ["architecture"]

[tasks.ooxml]
name = "docproc-ooxml"
summary = '''
docproc-ooxml from spike-ai-pipeline-office: the Open XML CLI on Microsoft's Open XML SDK, published
as NativeAOT binaries, turning docx, xlsx, and pptx into its JSON contract with Markdown inside it,
in one run. Moves to .NET 11 first (plan, 2026-11-12), parsing its arguments by hand so the Open
XML SDK is its only package (design, 2026-11-13). Adds optional document `properties` (core,
app, custom), streams xlsx in two passes, writes embedded packages and OLE payloads as stored into
its media as `ole`, the chart workbook excluded, and adds hyperlinks and a warning for each kind
it doesn't read; it promises byte-identical output for the same input, tested. Takes the envelope
additions: `schema <n>` on `--version`, the warning escape, and error reasons free of paths. It
refuses an `EncryptedPackage` with a reason beginning `encrypted`, distinct from a legacy OLE
file's. Builds docproc's CI with its always-running `ci` gate and ruleset, the root workflow
releasing `tools/*/v*` tags, the root check's `TOOLS` wiring, and the envelope's shared cases
table under `tools/` (design, 2026-11-13). Its README states the limit processing records:
pictures are listed with no layout, so a covered, off-slide, or cropped-away picture is still a
media block.
'''

[tasks.mail]
name = "docproc-mail"
summary = '''
docproc-mail from spike-ai-pipeline-mail: the Rust CLI, published as static musl binaries, that
reads .pst stores, .msg and .eml messages, and mbox files into JSON Lines of its contract. Adds
`smtp_address` for Exchange (EX) addresses, from 0x39FE for recipients and 0x5D01 for senders, so
a sender has one identity across .pst and .eml. Writes the shared Rust envelope crate under
`tools/`, and takes the envelope additions: `schema <n>` on `--version`, the warning escape, error
reasons free of paths, and the message line's optional `media` (design, 2026-11-13). Its fixture
generator holds MimeKit at 4.x on .NET 11, its fixture truth unchanged. CI checks gate the merge,
as office's and onenote's did; the spike merged without waiting on checks.
'''

[tasks.onenote]
name = "docproc-onenote"
summary = '''
docproc-onenote from spike-ai-pipeline-onenote: the Rust CLI, published as static musl binaries,
that reads OneNote sections, .onepkg exports, and notebook directories through onenote_parser
into JSON Lines of its contract. Adds the file-only option, under which it refuses a table of
contents, an encryption signal, and each drawing's ink alt text. Pins onenote_parser exactly,
with workarounds it owns and no upstream asks; typed-path moves only with onenote_parser. Adopts
the shared Rust envelope crate, with overflow checks in release, third-party notices, and MPL-2.0
allowed by name, and takes the envelope additions: `schema <n>` on `--version`, the warning
escape, and error reasons free of paths (design, 2026-11-13).
'''

[tasks.library]
name = "The processing library"
summary = '''
docproc's library module from spike-ai-pipeline-processing, without the client (`layers.md`,
"docproc's packages"): inspection and routing, the tool runners and readers, the stages, and
dispatch with its content store and index, each store an interface with filesystem and memory
implementations. It holds no
inference orchestration, which is docinfer's (v1.ai.inference). The Go CI job and the Go module
releases join docproc's CI, which ooxml builds. `internal/cli` loses office's `Labels` and holds
the one refusal-reason mapping: a reason beginning `encrypted` maps to encrypted, and onenote's
table-of-contents refusal to the outcome `read elsewhere`, not a failure. Failures are recorded
by the classification table, and a tool's death by signal is recorded failed, naming the signal.
`stages.Build` takes `Options`; `tool`'s `Spec.MemoryLimit` bounds every run's memory; and the
bomb rule sums across entries (design, 2026-11-13). A signed PDF's form read fails, since
processing's own form reader, not qpdf, refuses a signature field's reference value (as in
~/docs' cfr-2024-title32-vol1.pdf), and so fails the whole document part after its pages render:
the index never records it and every docproc rerun renders its 915 pages again. A field's value
never fails the form. The audio stage's windows each run an ffmpeg that decodes the source from
its start, so a 4.4 h audiobook took 1,614 s in docproc's ~/docs run while every other input
finished in 332 s; the stage windows from one decode with the silence tracker alone (docproc
finding; design, 2026-11-13).
'''

[tasks.providers]
name = "The providers"
summary = '''
The providers as nested modules of docproc: `docproc/storage`, `dispatch.Content` in object
storage over go-storage's `Client` (go-storage's `ErrTooLarge` mapped to `dispatch.ErrTooLarge`,
a content's age from `Stat`'s `ModifiedAt`, keys in the content layout under the host's prefix,
no sweeper: the host's lifecycle rule), its live tier over go-storage/s3 against a compose
SeaweedFS; and `docproc/postgres`, `dispatch.Index` in PostgreSQL over sqlate and
sqlate/postgres taking a `*sqlate.DB` on pgx (an entry's row with its claim and its Entry as
jsonb, its log items' rows in multi-row inserts, each claim, renewal, flush, and record one
conditional statement on the entry's token on the database's clock, Wait by LISTEN/NOTIFY, a
budgeted Retention, and its migrations, which the host applies), each passing `dispatchtest`'s
suites. The scratch-database helper moves to `sqlate/postgres/pgtest`, and go-messaging's
`postgres` suite and blobfs's `postgres` suite move onto it first, go-messaging's own `pgtest`
removed. A root go.work, compose PostgreSQL and SeaweedFS, and a CI integration job on push to
main. Tags `sqlate/postgres/v0.8.0`, `go-messaging/postgres/v0.4.0`, `storage/v0.1.0`, and
`postgres/v0.1.0` after requiring docproc v0.1.0; sqlate, go-messaging, and blobfs leave the
goal's repos at its SHIP (layers, 2026-11-12; design, 2026-11-13; plan, 2026-11-16, 2026-11-17).
'''
repos = ["docproc", "sqlate", "go-messaging", "blobfs"]

[tasks.docproc]
name = "docproc"
summary = '''
`cmd/docproc`, from the spike root's docproc: runs the library's whole suite over an input set into
a versioned run directory, schema "2", with no inference, its record flushed per line. `rundir` is
one handle, from `Open` or `Create`, with `rundir.json` at the run's root; main.go sits at the
nested module's root, and a committed `go.work` spans the base module and `cmd/docproc` between
tags. docproc's README names `stages` as the shipped wiring and `cmd/docproc` its first caller.
Tags docproc v0.2.0 when `rundir` lands (design, 2026-11-13).
'''

[tasks.reports]
name = "Holistic reports"
summary = '''
Makes `cmd/docproc`'s report holistic: an index page plus one page per input content, keyed by
its SHA-256, not per input, holding the source link, the file and record metadata, and the whole
part tree with every output inline, with no 1,000-character cut. Tags `cmd/docproc/v0.1.0`,
re-tagging the base module first only if `rundir` changed (design, 2026-11-13). docinfer's report
moves to v1.ai.inference.
'''

[tasks.acceptance]
name = "Acceptance of docproc and its tools"
summary = '''
Reruns each tool's bench from its spike against its release, and `cmd/docproc` over ~/docs
(corpus.docs), and fixes what it finds, never redesigning. Measures each tool's peak memory over
~/docs, dispatches the inspection evaluation's bombs through `cmd/docproc`'s starting bounds, and
measures the word error rate on ~/docs' audio before the tag (design, 2026-11-13). Settles
whether audio that fits in one request goes unsplit (`ai-strategy.md`, evidence 5). docinfer's
reruns move to v1.ai.inference.
'''

[tasks.hardening]
name = "Library hardening"
summary = '''
Fixes what acceptance found in the library, each a defect or a gap in a test, never a redesign
(acceptance, brief review, 2026-11-19; docproc's context/acceptance.md). `tool`'s environment sets
`TMPDIR` to the run's scratch for every tool, so a gs ended early leaves no `gs_` or
`gpdf-collection-` file beside the input. A portfolio's pages on the per-page path write one PNG
per page and read only that page's text, not every embedded document's. An XPS package named
`.docx` (LargeData.one's "testing - large.docx") is sniffed as no processor rather than failing as
docproc-ooxml's "not a docx, xlsx, or pptx package". soffice's exit 77, a full disk, is recorded
as the run's failure, not the content's, so the part is retried once the disk has room.
`sevenzip.Reader.Extract` returns the failing writer's error, not 7zz's broken pipe.
`GOARCH=386 go vet` passes (audio/floor.go's `SampleRate * int(FrameLength)` overflows int as a
constant). A mail fixture spreading distinct attachments over enough messages lets
`TestEmailStageReleases` assert the email stage's release property instead of logging its peak.
ooxml's fixtures README describes slide-objects' slide 3 truly, or generate.py places its pictures
apart.
'''

[tasks.mail-hardening]
name = "docproc-mail hardening"
summary = '''
docproc-mail's follow-ups from acceptance (acceptance, brief review, 2026-11-19). Profiles the
schema "2" reads that slowed v0.1.2 (plaso's store 3.34 s against the spike's 1.61 s, scale.mboxrd
8.52 s against 6.73 s, likely the Markdown built for every message) and measures a replacement
allocator against musl's. The RTF text reader breaks at `\cell` and `\row`, not only at `\par`,
`\line`, and `\tab`. An `IPM.Note.SMIME` .msg or .pst message gets the S/MIME warning a MIME part
gets. A fixture message and its golden pin the output differences tools/mail's CHANGELOG v0.1.2
lists: htmd 0.6's math form, a link's text with edge whitespace or a line ending, a whole title,
an `<img>` without a `src`, and a text beginning `+`, `1)`, or an autolink-like `<`.
'''

[tasks.final]
name = "Final acceptance and sync"
summary = '''
Reruns `cmd/docproc` over ~/docs, the mail bench, and the shared-gs identity check against the
hardened releases, and records them in docproc's context/acceptance.md; no word error rate or bomb
reruns (acceptance, brief review, 2026-11-19). In architecture's
`standards/go-elemental/README.md`, adds a go-ai row to the infrastructure table, naming no
version, and docproc to the adjacent-library list, which then reads "Three libraries" (plan,
2026-11-20, folding go-ai-row from v1.ai.client's sync). Then syncs the goal.
'''
