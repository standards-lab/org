name = "AI"
summary = '''
The capability builds in four layers, each on the one below: hosting (`ai-hosting`, through
v1.ai.hosting), the Go model client (go-ai), message, document, and stream
processing (docproc, through v1.ai.processing, with the system tools it runs nested in it), and
the harness (v1.harness.local-models), lowest priority. go-web-service's AI layer demonstrates
them. docproc's `layers` task settles the signatures of every layer of Cerebro's stack first. Each
sub-goal opens with a `design` review of its spike code, led by a Fable 5.2 evaluation of each
promoted artifact, against the full standards and the
workspace, written into its note, and closes with an `acceptance` task that reruns the real
workloads and fixes what it finds, never redesigning. spike-ai-pipeline's design is go-ai's
reference, and the team adopts go-ai once it is a mature, standard set of packages. herald is
prior art, not a workload to rerun. tau's retirement waits on experiment.harness's intake.
'''
