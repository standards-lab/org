name = "Scanned-document fidelity at scale"
summary = '''
spike-ai-pipeline's documents finding judged Gemma 4 26B-A4B's vision transcription on only 7
scanned pages: the model invented seal text, never read page 7's NOFORN, and scored a scanned CER
of about 0.11 to 0.13. Does that transcription hold on olmOCR-bench (allenai/olmOCR-bench: 1,403
PDFs, 7,010 checkable assertions, ODC-BY as reported), and does a dedicated OCR model (olmOCR's
own, on vLLM) or Tesseract beat it on GB10? It also measures the vision models themselves on
spike-ai-pipeline-processing's committed scanned fixtures (document/testdata/scanned.pdf, ground
truth beside it): a larger image-token budget than gemma-4-26B-A4B's default, a dense vision
model, and a lighter quantization than Q4_0, since Gemma 4 26B-A4B Q4_0 never read scanned page
7's faded NOFORN, even on a 122-token 300-dpi tile, which points to the model, not resolution
(processing's docs/findings/documents.md). Decides whether processing's document stage needs an
OCR tier, and the vision tier's model. Runs on gb10-2 after capstone.data-intelligence; set up by
`plan experiment.ocr.spike-scanned-documents`. Third-party and crawled documents are processed
only in sandboxed converters.
'''
repos = ["spike-scanned-documents"]
root = "spike-scanned-documents"
remote = "https://github.com/JaimeStill/spike-scanned-documents.git"
path = "~/experiments/spike-scanned-documents"
