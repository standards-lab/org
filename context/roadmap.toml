# Roadmap — the workspace's path to its target end state, holding only what remains.
# Maintained by the marathon-roadmap extension; the format is the plugin's
# references/manifest.md.

# The v1 execution sequence, settled 2026-09-07: the workspace context brought into
# alignment first, then the harness, then the integration standards in dependency order
# (the auth strategy before any layer that builds to it), and the domains once the layers
# they enhance exist. A goal cited late reads as what remains of it.
next = [
  "v1.observability.tasks.library",
  "v1.observability.tasks.stack",
  "v1.observability.tasks.instrumentation",
  "v1.middleware",
  "v1.storage",
  "v1.auth",
  "v1.admin-listener",
  "v1.messaging",
  "v1.data",
  "v1.ai",
  "v1.client",
  "v1.deployment",
  "v1.repository-docs",
]

# ── v1 ─────────────────────────────────────────────────────────────────────────────────────

[goals.v1]
name = "The reference architecture at v1.0"
summary = '''
go-web-service reaches v1.0.0 as a holistic enterprise reference: every capability layer a
production web service reasonably encounters, complete in the running composition, each layer
built holistically — proving the architecture end to end and feeding the SDK,
infrastructure-library, and template features that emerge from it.
'''
criteria = [
  "Every capability goal beneath this one is closed: code, tests, and the layer's documentation in its repository (README, package documentation, and the docs/ guide of v1.repository-docs) complete; the standard tier used throughout with native use contained and entered in the port list; the capability's provider-swap class declared; and the promotion evaluation recorded — what moved outward into the SDKs, the libraries, and the template, and what stayed the service's own.",
  "A layer goal closes once its extracted record has produced the library, the template element, and the repository documentation, wherever the layer was proven (ruled 2026-09-07, standards-lab/context/concepts/marathon-extraction.md). v1.0 keeps the running composition: a layer proven outside go-web-service is adopted by the service in a sweep task of its own before this goal closes.",
  "The import-boundary lint is in place, and the service's README names each capability the service consumes, its class, and the port list.",
  "The service is versionless until 1.0: minor releases cut as layers complete in whatever order they land, v1.0.0 when this goal's tree is empty; -dev.N prerelease tags serve only the cross-module-resolution case the release-and-ci principle states, never routine between-session practice. Each release is a coherent snapshot with its pins; a library change and the service change that proves it release together; a member release prompts the coordinator sweep.",
]
context = ["standards-lab/context/design/service-organization.md"]

[goals.v1.observability]
name = "Observability"
summary = '''
The go-observability infrastructure library: a base module over the stable OpenTelemetry API
and SDK, and an `otlp` sub-module pinning the exporters and the gRPC/protobuf weight they
carry — the shape and the standard-versus-native split are settled in the linked strategy
record. Logs stay on stdout as structured JSON with trace and span ids stamped in, ingested by
the collector's filelog receiver; the OTLP logs pipeline waits for that signal's SDK to reach a
stable release. The LGTM stack (Loki, Grafana, Tempo, Mimir) is reached entirely through the
OpenTelemetry standard — OTLP to the collector, standard exporters onward — with no native
deviation projected and never a Go dependency of its own. Sequenced before the layers that
follow so each instruments as it lands.
'''
context = ["standards-lab/context/design/observability-strategy.md"]

[goals.v1.observability.tasks.library]
name = "The go-observability library"
repos = ["go-observability"]
summary = '''
The infrastructure library itself: the base module over the OpenTelemetry API and SDK, and the
`otlp` sub-module pinning the exporters and the gRPC and protobuf weight they carry. The base
module builds the configuration block on go-core's Merge and Finalize contract, the resource,
the tracer and meter providers as one lifecycle service at stage 0 with no readiness check, the
W3C trace-context propagator, the HTTP server middleware over otelhttp as a plain
func(http.Handler) http.Handler, the slog handler that appends trace_id and span_id from the
span context, and the request-id source function the web SDK's middleware takes. Repository
creation, the README's dependency-line statement admitting the v0 otelhttp exception, and the
first release.
'''
context = ["standards-lab/context/design/observability-strategy.md"]

[goals.v1.observability.tasks.stack]
name = "The collector and the development stack"
repos = ["go-web-service"]
summary = '''
The OpenTelemetry collector and the LGTM stack in the compose project, as a compose profile so
the integration tier's docker compose up --wait does not gate on Grafana. The collector's
receivers, processors, and exporters; the filelog receiver that parses the service's JSON log
records and promotes trace_id onto the record; Grafana provisioning for the Loki, Tempo, and
Mimir datasources with the derived field and the trace-to-logs and trace-to-metrics links; and
the first dashboard. Every file here configures a chosen tool rather than declaring a deviation
from OpenTelemetry, so none of it lands on stack.md's port list.
'''
context = [
  "standards-lab/context/design/observability-strategy.md",
  "go-web-service/context/design/stack.md",
]

[goals.v1.observability.tasks.instrumentation]
name = "The service instrumented"
repos = ["go-web-service", "go-web-sdk-template"]
summary = '''
The reference service wired to the library and proving it end to end: the observability
configuration block, the composition root's telemetry layer file with the lifecycle stages
shifted so telemetry starts before the database, the middleware chain with the tracing
middleware outermost and the request-id source supplied there, the correlating log handler over
go-core's, and the resource attributes — which needs a service name and version the service does
not carry today. The integration tier asserts a trace id reaches both the log record and the
problem document. The template takes the same composition-root reshape while staying
provider-free.
'''
context = [
  "standards-lab/context/design/observability-strategy.md",
  "go-web-sdk/context/concepts/middleware-sourcing.md",
]

[goals.v1.middleware]
name = "The sourced middleware set"
summary = '''
CORS, real client IP, compression, and rate limiting, split out of v1.web.tasks.middleware
(2026-09-14) so their adoption gets its own planning session rather than riding the hand-rolled
work. The convention is settled — each is imported as a declared dependency, not copied into
the tree (dependency-sourcing.md) — but the concrete adoption for each is not: versions, real-IP's trusted-proxy configuration, and each library's own entry in
go-web-sdk's dependency-line statement. CORS's one recorded trigger is goals.v1.client; the
other three have none recorded, so this goal's own planning session decides what, if anything,
starts before then.
'''
context = [
  "go-web-sdk/context/concepts/middleware-sourcing.md",
  "standards-lab/context/design/dependency-sourcing.md",
]

[goals.v1.storage]
name = "Object storage"
summary = '''
The go-storage infrastructure library. No formal standard exists, so the organization
establishes the standard tier as the minimal operation set common to the Azure Blob and S3
APIs; the declared stack picks one provider (azurite locally); the service demonstrates it in
a documented layer.
'''

[goals.v1.auth]
name = "Auth and authorization"
summary = '''
The go-auth infrastructure library with Keycloak as the declared provider (standard tier:
OAuth 2.0, OIDC, JWT); the subject anchor, the relationship-derived authorization model, and
the composition-root seams every domain builds against are settled in the linked strategy
record. The admin listener (v1.admin-listener) is a consumer of the authentication this goal
settles. What remains is the build: go-auth itself, the schema it introduces, and the
composition-root reshape in go-web-service.
'''
context = [
  "standards-lab/context/design/auth-strategy.md",
  "go-web-service/context/concepts/identity-linking.md",
  "go-web-service/context/concepts/organization-lineage.md",
]

[goals.v1.admin-listener]
name = "The management listener"
summary = '''
The admin mount on its own listener, unreachable from the public API's network path,
authenticated through the auth layer, with audit logging on anything that mutates and a
confirmation token gating the destructive down, force, and state verbs; config rendering
over a go-core redaction contract; go-web-sdk's config env segment made per-block; the
composition-root reshape in go-web-service and the same reshape in go-web-sdk-template.
Posture decisions on record: whether the serving role ever holds DDL, and whether off by
default is mandated by the standard. The 2026-09-07 exploration and the touch points by
repository are the linked concept.
'''
context = [
  "standards-lab/context/concepts/admin-listener.md",
  "standards-lab/context/design/dsl-driven-services.md",
  "standards-lab/context/design/auth-strategy.md",
  "go-web-sdk/context/concepts/error-handling.md",
]

