  "compression",
  "response-caching",
  "elemental-runtime-layers",
  "graduation",
  "staged-query-aggregation",
  "slab-json-partial-color",
  "s3-put-memory",
  "transfermanager-log",
  "web-service-port-settings",
]

# ── cli ────────────────────────────────────────────────────────────────────────────────────

[goals.cli]
name = "The CLI application type"
repos = ["go-core", "go-web-sdk", "go-observability", "go-database"]
summary = '''
The Elemental Architecture's second application type, beside the web service. CLIs build on
the standard library's `flag`, not cobra. `go-cli-sdk` (root, one module, package `cli`,
standard library and go-core only) is spike-cli-architecture's `cli` package:
- the dispatcher: flags after positionals, root flags at any depth, a root PreRun, NoArgs
  and ExactArgs, Require and Exclusive, Changed, StringsVar, generated help
- Use with WithGraph, so a command builds only the graph nodes it declares
- Invocation.Get, Validate, Footer, and Streams
- a Run that exits with go-core's ExitUsage on a usage error and on requested help
It builds no `help` or `completion` command, no shorthand flags, and no counterpart to
cobra's Long. `go-cli-sdk-template` (module rooted at `template/`) scaffolds the spike's
`internal/app`:
- one exported `Nodes` value, with configuration as graph nodes
- each layer file fills its part of the graph and mounts its own commands
- no `config.go`, `commands.go`, or initializer
- fixtures in an internal `apptest` package
- `main` passes `cli.Streams` and the arguments
Builds on the go-core release its first task, role-interfaces, cuts. cli's first `plan` creates both public repositories. At
sync they join `order`, the references catalog, and the exclusive group, and the
architecture pages drafted in the root's `context/` move into `architecture`. clutch,
courier, and spike-blobfs stay on cobra; slab aligns in the `slab` goal.
'''
context = ["standards-lab/context/cli-applications.md"]

[goals.cli.tasks.role-interfaces]
name = "Role interfaces across the stack"
repos = ["go-core", "go-web-sdk", "go-observability", "go-database"]
summary = '''
Decides the role-interface findings in `cli-applications.md` ("Role interfaces")
before go-cli-sdk adds the CLI's own: (a) go-core infers a /readyz check from any
`Ready() bool`; (b) `web.Doctor`'s home; (c) `lifecycle.Subsystem`, never asserted at
runtime; (d) the consumer-side `Ready()` in `Source[T]` and admin/storage's `Store`. A
change (d) rules for go-web-service lands as a pending edit on v1.messaging's
service-reactors task. The Gate stays with v1.messaging's core-reactor. Also fixes
go-observability's `Telemetry.Shutdown` after a failed Start (nil providers under go-core
v0.6.0) and go-database's `lc.Add(lifecycle.Service{...})` doc examples. Its plan
settles the tags it releases; go-cli-sdk builds on its go-core release.
'''
context = ["standards-lab/context/cli-applications.md"]

[goals.cli.tasks.sdk]
name = "go-cli-sdk"
summary = '''
go-cli-sdk from spike-cli-architecture's `cli` package, at the graph and lifecycle of
the go-core release role-interfaces cuts, with depguard holding it to the standard library and go-core. Releases v0.1.0.
'''
context = ["standards-lab/context/cli-applications.md"]

[goals.cli.tasks.template]
name = "go-cli-sdk-template"
summary = '''
The CLI template on go-cli-sdk v0.1.0, with the composition root in cli's summary, a
`version` command, one example domain over a stand-in node, the `scenario` package with its
help footers, apptest, and an integration suite on processtest's one-shot runner. Drafts the
CLI architecture pages in the root's `context/`. Repoints the architecture's three remaining
spike-cli-architecture links (tests-and-docs.md's apptest fixtures, domain-files.md's files
domain, baseline-standards.md's schema commands) to go-cli-sdk-template once it holds those
examples. Releases template/v0.1.0.
'''
context = ["standards-lab/context/cli-applications.md"]

# ── slab ───────────────────────────────────────────────────────────────────────────────────

[goals.slab]
name = "slab on go-cli-sdk"
root = "go-web-service"
repos = ["go-web-service"]
summary = '''
go-web-service's `tools/slab` moves off cobra onto go-cli-sdk at its released tag. It takes
the template's composition root: commands declare their graph nodes with Use, and
configuration is nodes. Its usage errors and requested help exit with go-core's ExitUsage.
It also adopts the scenario convention (`cli-applications.md`, "Conventions"): its `demo`
and `scenario` packages consolidate into `scenario`, `slab demo <name>` becomes `slab
scenario <name>`, and the help footers of the `scenario` parent and the root replace `slab
list`. go-web-service is already on go-core's graph. Stages once `cli` syncs
and the exclusive slot is free.
'''
context = ["standards-lab/context/cli-applications.md"]

# ── v1 ─────────────────────────────────────────────────────────────────────────────────────

[goals.v1]
name = "The reference architecture at v1.0"
summary = '''
go-web-service reaches v1.0.0 as a holistic enterprise reference: every capability layer a
production web service reasonably encounters, complete in the running composition, each layer
built holistically — proving the architecture end to end and feeding the SDK,
infrastructure-library, and template features that emerge from it.
'''
criteria = [
  "Every capability goal beneath this one is closed: code, tests, and the layer's documentation in its repository (README, package documentation, and the docs/ guide of v1.repository-docs) complete; the standard tier used throughout with native use contained and entered in the port list; the capability's provider-swap class declared; and the promotion evaluation recorded — what moved outward into the SDKs, the libraries, and the template, and what stayed the service's own.",
  "A layer goal closes once its extracted record has produced the library, the template element, and the repository documentation, wherever the layer was proven (ruled 2026-09-07, claude-plugins/context/marathon-extraction.md). v1.0 keeps the running composition: a layer proven outside go-web-service is adopted by the service in a sweep task of its own before this goal closes.",
  "Import boundaries are a reviewed discipline — dependencies point bottom-up, no provider enters a base, and each module stays light — held in planning and review, and the service's README names each capability the service consumes, its class, and the port list.",
  "The service is versionless until 1.0: minor releases cut as layers complete in whatever order they land, v1.0.0 when this goal's tree is empty; -dev.N prerelease tags serve only the cross-module-resolution case the release-and-ci principle states, never routine between-session practice. Each release is a coherent snapshot with its pins; a library change and the service change that proves it release together; a member release prompts the coordinator sweep.",
]
context = ["standards-lab/context/service-organization.md"]

[goals.v1.observability]
name = "Observability"
summary = '''
The go-observability infrastructure library: a base module over the stable OpenTelemetry API
and SDK, and an `otlp` sub-module pinning the exporters and the gRPC/protobuf weight they
carry — the shape and the standard-versus-native split are settled in the linked strategy
record. Logs stay on stdout as structured JSON with trace and span ids stamped in, ingested by
the collector's filelog receiver; the OTLP logs pipeline waits for that signal's SDK to reach a
stable release. The LGTM stack (Loki, Grafana, Tempo, Mimir) is reached entirely through the
OpenTelemetry standard — OTLP to the collector, standard exporters onward — with no native
deviation projected and never a Go dependency of its own. Sequenced before the layers that
follow so each instruments as it lands.
'''
context = ["go-observability/README.md"]

[goals.v1.middleware]
name = "The sourced middleware set"
summary = '''
CORS, real client IP, and compression remain; rate limiting has landed
(`go-web-sdk/middleware/rate-limit`). rate-limit's main carries untagged go-core v0.6.0, httprate
v0.16.1, and the go-web-sdk v0.14.0 requirement; its next release dates them and can move to
go-web-sdk v0.15.0. The convention is settled — each is imported as a declared
dependency, in its own capability sub-module when it carries a third-party dependency — but the
concrete adoption for the remaining three is not: versions, real-IP's trusted-proxy
configuration, and each library's own entry in go-web-sdk's dependency-line statement. CORS's one recorded trigger is goals.v1.client; real client IP and
compression have none recorded and wait for one — neither has a live consumer yet: real-IP's
only other use, keying rate limiting, is covered by `RemoteAddr`; compression has no
large-response case until more of the data layer lands.
'''
context = [
  "go-web-sdk/context/middleware-sourcing.md",
  "architecture/standards/go-elemental/principles/dependencies.md",
]

[goals.v1.auth]
name = "Auth and authorization"
