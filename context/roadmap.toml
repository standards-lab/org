summary = '''
How are models placed across the three workstations' memory pools to make the best use of memory,
and what context and how many concurrent sessions does each placed model hold? Runs on gb10-1,
gb10-2 and the Framework (`ai-hosting.md`, "Hosts and access"), with GuideLLM 0.8.1's multi-turn
datasets in agreed, capped runs. Compares set A on one GB10 against the roles split across both
GB10s: one serving the agent model alone (about 49 GiB of KV after weights and headroom, roughly
10 concurrent 128K sessions by the architect's estimate of 2026-10-30), the other vision, audio and
embedding, with requests directed to a host by capability; the Framework's role (overflow or
capability host) follows from that comparison. Serving on demand uses llama.cpp's native router
(autoload, LRU `--models-max`, `--models-memory-margin`, `--sleep-idle-seconds`); llama-swap
fronts only a vLLM server. Measures the agent alone on vLLM, in a container: on gb10-1,
gpt-oss-120b on vLLM v0.32.0 gave 34.0 tok/s at 1 stream against llama.cpp's 50.0, and 168.2
against 129.0 at 16 (spike-hosting-upgrades, gb10-1 report 2026-10-31), and a llama.cpp maintainer
notes it "mostly optimizes upto 8 parallel sequences at the moment" (#31711). Measures
gpt-oss-120b across both GB10s over QSFP with vLLM and Ray, weighing both GB10s pooled for the
agent with the Framework serving the capability models. Routing stays on paper, handed to
spike-model-gateway as requirements. Lists spike-model-engines in repos to change its `host/`
presets by pull request. Decides the layout v1.ai.hosting specifies. Its evidence and path are in
the spike's `context/README.md`.
