path in for anyone exploring it themselves.
'''
context = ["go-web-service/tools/slab/README.md"]

# ── blobfs ─────────────────────────────────────────────────────────────────────────────────

[goals.blobfs]
name = "The virtual-directory metadata library"
summary = '''
A standalone library, adjacent to the standard the way sqlate is, owning a SQL-backed
virtual-directory and file metadata layer over any object store, for any Go project on an engine
it ships DDL for (Postgres at v1). Surfaced by v1.storage's demonstration layer needing more than
one attachment; not a v1 layer itself, the same standing sqlate and slab have. One module in
three layers a consumer adopts by what it accepts: a Go-only root package, a persistence package
over sqlate, and an engine package owning its DDL as a whole migration set and its native
variant, selected by import. go-storage's own keys stay opaque and unaware of blobfs; a consuming
domain composes ownership over blobfs_file through its own join table.
'''
context = ["standards-lab/context/blobfs.md"]

[goals.blobfs.tasks.build]
name = "Promotion to its own repository"
repos = ["blobfs"]
summary = '''
What the experiment proved out lands as blobfs's own repository and first release against sqlate
v0.2.0, with the final module path checked against repository-topology.md and a references entry
that carries no standard key. blobfs.sources closed 2026-09-22 and released sqlate v0.2.0, so the
engine package's migration set is the type sqlate v0.2.0 exports.
standards-lab/context/blobfs-api.md is this task's own SETTLE's starting point, not a finished design: it
proposes a Directories and Files operation set over one compiled store, with several names (the
persistence package's own, the two write and delete steps' verbs, whether a listing is scoped by
directory only) still open. The command-line tool that proved the concept is not promoted.
Recording the adjacent-repository position for the architecture layer waits on this task.
Unblocks blobfs.admin and v1.storage.tasks.service.
'''
proof = "blobfs's first release passes its conformance suite on the standard tier and the Postgres engine, and go-storage's azureblob provider composes with it through the proposed key-validation adapter with no change to either library."
context = [
  "standards-lab/context/blobfs.md",
  "standards-lab/context/blobfs-api.md",
]

[goals.blobfs.tasks.admin]
name = "The admin service over several migration sets"
repos = ["go-database"]
summary = '''
go-database's admin service takes a migrator running several sets: Reset reverts across all sets,
Status reports each source's head and pending migrations, Start logs the pending migrations by
set, and Force <set> <version> is the operator's repair for a dirty set, named explicitly rather
than a flag on Reset because a flag would have to guess whether the failed migration's own
objects still exist. A minor release, and the last piece the service needs before it can run
blobfs's migration set.
'''
proof = "Reset, Status, and Force cover every set in a migrator built with several, dirty-set recovery through Force is proven, and the existing single-set behavior is unchanged."
context = ["standards-lab/context/migration-sets.md"]

