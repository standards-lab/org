# Roadmap: the workspace's path to its target end state, holding only what remains. The format is
# marathon's references/manifest.md, and each active goal's record is context/goals/<goal>.md in
# its root repository.
#
# The workspace's exclusive group (.claude/marathon.toml) lets one active goal at a time touch the
# reference-architecture code repositories. quality holds that slot. cli waits on
# experiment.cli-architecture, and slab on cli. Once factory and quality sync,
# experiment.messaging's intake runs and v1.messaging stages next, the first work on the 0.16
# conventions. The infrastructure libraries come before the data layer, and the data layer before
# auth by design: the architect wants to see how the domain layer scales before auth constrains
# it. Middleware is last: CORS waits for v1.client.

active = [
  "factory",
  "quality",
  "experiment.ai",
]

planned = [
  "cli",
  "slab",
  "v1.messaging",
  "v1.ai",
  "v1.data",
  "v1.auth",
  "v1.admin-listener",
  "v1.client",
  "v1.deployment",
  "v1.repository-docs",
  "v1.middleware",
]

backlog = [
  "v1.observability",
  "v1.harness",
  "sweeper",
  "sqlate-past-last-total",
  "organization-image-active",
  "second-providers",
  "dotnet-mirror",
  "external-client",
  "docs-site",
  "entrypoint-composition-split",
  "sql-meta-language",
  "real-client-ip",
  "compression",
  "response-caching",
  "elemental-runtime-layers",
  "graduation",
  "staged-query-aggregation",
]

# ── factory ────────────────────────────────────────────────────────────────────────────────

[goals.factory]
name = "The workflow as a software factory"
root = "claude-plugins"
repos = ["claude-plugins"]
summary = '''
marathon reshaped so the architect engages at two points per task, the plan and the brief, while
an agent pipeline makes the work good in between: implementer, checks, standards and spec
review, editor. Goals and tasks become the whole vocabulary of parallel work, with the wave,
lane, and fold retired. marathon 0.16.0 expresses it; currency and evals remain.
'''
context = ["claude-plugins/context/harness-testing.md"]

[goals.factory.tasks.pipeline]
name = "The pipeline, profiles, commands, and briefs"
repos = ["claude-plugins"]
summary = '''
marathon's next minor release: the plan, build, brief, and ship pipeline with no checkpoints;
the planner, implementer, standards-reviewer, spec-reviewer, and editor profiles, none pinning a
model; the architect-facing formats; `close` absorbed into `start` and `review` into the new
`retro`; the new `status`.
'''

[goals.factory.tasks.goals]
name = "Goals as the unit of parallel work"
repos = ["claude-plugins"]
summary = '''
The goal and task primitive, the active, planned, and backlog states, the repository lock in
place of worktrees, goal records in each goal's root, and sync in place of the fold.
marathon-roadmap folds into marathon core, and the open lane records migrate.
'''

[goals.factory.tasks.experiments]
name = "Spikes as sub-goals, and the intake command"
summary = '''
marathon 0.16.1. A spike runs over many sessions, so it is a sub-goal of its experiment, not a
task: experiment.<topic>.<spike> carries the spike's `remote` and `path`, with the spike's
repository as `root` and `repos`, and its path as tasks. `marathon experiment` runs once to create
the experiment with its planned spikes; `plan experiment.<topic>.<spike>` sets each spike up, and
`start` runs it to the end. Spikes run in parallel, since each locks only its own repository. A
spike's sync lands its answer and evidence for the intake and stages the next planned spike. A new
`marathon intake <goal>` takes in a finished experiment: it consolidates every spike's answer,
decides with the architect what the served goal builds, writes those tasks, and syncs the
experiment, archiving the spike repositories. The roadmap's experiment.ai and
experiment.messaging move to the new shape, and spike-harness-driver's 0.15 closeout becomes the
first spike's record. A workspace goal's last task still syncs at SHIP; its session brief gains a Sync section listing
the pending edits and the goal proposed to stage next, so accepting the brief authorizes the sync.
`intake` stays for experiments only. Every session, including `plan`, `experiment`, `intake`, and a
sync, starts
on a branch and lands through a pull request; only small administrative context updates go
straight to the default branch.
'''

[goals.factory.tasks.currency]
name = "Currency as a PLAN-time pass"
repos = ["claude-plugins"]
summary = '''
marathon 0.17.0. marathon core gains `[project] currency`, a repository's read-only command that
exits non-zero and lists, one per line, each direct dependency, toolchain, and pin trailing its
latest (reference: go-core's `mise run currency`, scripts/currency.sh). PLAN runs it before round
1: the planner reads the release notes of what trails, round 1 asks adapt-and-adopt questions,
and the upgrade becomes the brief's first slice. Currency is a development-time session step,
never a CI gate; it covers direct dependencies and the toolchain, leaving indirect ones to the
ecosystem's resolver. It is core and language-agnostic, not an extension. A CHANGELOG migration
recipe names the key per repository. Carries quality.checks' currency decisions, whose record
sync deletes.
'''

[goals.factory.tasks.evals]
name = "Plugin evals as the harness's checks"
repos = ["claude-plugins"]
summary = '''
An `evals/` suite per plugin, fed by observed failures through `retro`, with deterministic
graders preferred, and `claude plugin eval --threshold 1.0` a required step of the release
script. Seeds the cases for the new contract. Absorbs the former harness-testing task.
'''
context = ["claude-plugins/context/harness-testing.md"]

# ── quality ────────────────────────────────────────────────────────────────────────────────

[goals.quality]
name = "Checks and standards across the workspace"
root = "architecture"
repos = [
  "go-core",
  "sqlate",
  "go-database",
  "go-web-sdk",
  "go-observability",
  "go-storage",
  "blobfs",
  "go-web-sdk-template",
  "go-web-service",
  "architecture",
]
summary = '''
The first two layers of quality made trustworthy before human review: every repository's
deterministic check, the standards the reviewer applies, and an architecture repository that
guides without prescribing. Takes the member-repository slot. Its tasks run checks, then
architecture-diet, then standards, so each `STANDARDS.md` points into a layer already trimmed.
It also brings each repository to marathon 0.16's conventions as it passes through.
'''
context = ["architecture/context/standards-audit.md"]

[goals.quality.tasks.checks]
name = "One honest check per repository"
summary = '''
Each repository exposes one deterministic `mise run check` composed of the Go ecosystem's
established tooling, and a development-time `mise run currency` and `upgrade` over every pin.
Layer boundaries are held by discipline in planning and review, not by gates. Each repository's
`marathon.toml` names its check and gains the `merge` command, and its `.gitignore` swaps
`.claude/report.md` for `.claude/briefs/`.
'''

[goals.quality.tasks.honest-tests]
name = "Tests that can fail"
repos = [
  "go-core",
  "sqlate",
  "go-database",
  "go-web-sdk",
  "go-observability",
  "go-storage",
  "blobfs",
  "go-web-sdk-template",
  "go-web-service",
]
summary = '''
A full evaluation of every repository's tests: a standards-reviewer runs over each whole suite,
not a diff, and removes or rewrites the tests that lie (tautological, structure-sensitive, or
unable to fail), including the white-box files checks renamed to `*_internal_test.go`.
go-web-service is evaluated in three scopes: the service, its integration tests, and tools/slab.
'''

[goals.quality.tasks.standards]
name = "Standards for the reviewer"
summary = '''
A short `STANDARDS.md` per repository holding judgement calls only, with pointers to the
architecture pages that apply; only the standards-reviewer reads it. Each `CLAUDE.md` is reduced
to navigation pointers. Each code repository's marathon.toml names `[project] currency` per
factory.currency's migration recipe.
'''

[goals.quality.tasks.architecture-diet]
name = "A reviewer-facing architecture repository"
repos = ["architecture"]
summary = '''
A principle stays only if code expresses it or a check enforces it. Contradicted principles are
fixed, speculation is cut, `harness/` moves to claude-plugins or goes, and the promotion
candidates the v1-storage audit recorded land or are dropped. The command-line SDK tier in
`repository-topology.md` stays: cli's sdk-decision creates go-cli-sdk. `harness/` and `CLAUDE.md` still
describe marathon 0.15's mechanics, and `context/promote-on-fit.md` predates the rule that a page
arrives only from validated code. The repository's own `marathon.toml` and `.gitignore` move to
0.16 here.
'''
context = ["architecture/context/standards-audit.md"]

# ── cli ────────────────────────────────────────────────────────────────────────────────────

[goals.cli]
name = "The CLI application type"
summary = '''
The Elemental Architecture's second application type, beside the web service. sdk-decision is
settled: cobra goes and CLIs build on the standard library's `flag`. `go-cli-sdk` (root, one
module, package `cli`, stdlib and go-core only) holds only the command dispatcher: flags after
positionals, root flags at any depth, a root pre-run hook, NoArgs and ExactArgs, required and
mutually exclusive flag groups, a set-flag query, a repeatable string flag, generated help, and a
Run that maps usage errors to go-core's ExitUsage. No shorthand flags, completion, App type, or
scenario runner. `go-cli-sdk-template` (module rooted at `template/`) scaffolds the layout. The
composition root starts only the infrastructure every run needs; each command declares the
dependencies it requires, and one central initializer brings up only those. Waits on
`experiment.cli-architecture`, which proves that shape; its intake writes this goal's tasks and
the two public repositories are created then. At sync the repositories join `order`, the
references catalog, and the exclusive group, and the architecture pages drafted in the root's
`context/` move into `architecture`. CLIs in ~/experiments (clutch, courier, spike-blobfs) stay
on cobra; slab aligns in the `slab` goal.
'''
context = ["standards-lab/context/cli-applications.md"]

# ── slab ───────────────────────────────────────────────────────────────────────────────────

[goals.slab]
name = "slab on go-cli-sdk"
root = "go-web-service"
repos = ["go-web-service"]
summary = '''
go-web-service's `tools/slab` moves off cobra onto go-cli-sdk at its released tag and the
per-command dependency composition the template settles, and its usage errors exit with
go-core's ExitUsage instead of 1. Stages once `cli` syncs and the exclusive slot is free.
'''
context = ["standards-lab/context/cli-applications.md"]

# ── v1 ─────────────────────────────────────────────────────────────────────────────────────

[goals.v1]
name = "The reference architecture at v1.0"
summary = '''
go-web-service reaches v1.0.0 as a holistic enterprise reference: every capability layer a
production web service reasonably encounters, complete in the running composition, each layer
built holistically — proving the architecture end to end and feeding the SDK,
infrastructure-library, and template features that emerge from it.
'''
criteria = [
  "Every capability goal beneath this one is closed: code, tests, and the layer's documentation in its repository (README, package documentation, and the docs/ guide of v1.repository-docs) complete; the standard tier used throughout with native use contained and entered in the port list; the capability's provider-swap class declared; and the promotion evaluation recorded — what moved outward into the SDKs, the libraries, and the template, and what stayed the service's own.",
  "A layer goal closes once its extracted record has produced the library, the template element, and the repository documentation, wherever the layer was proven (ruled 2026-09-07, claude-plugins/context/marathon-extraction.md). v1.0 keeps the running composition: a layer proven outside go-web-service is adopted by the service in a sweep task of its own before this goal closes.",
  "Import boundaries are a reviewed discipline — dependencies point bottom-up, no provider enters a base, and each module stays light — held in planning and review, and the service's README names each capability the service consumes, its class, and the port list.",
  "The service is versionless until 1.0: minor releases cut as layers complete in whatever order they land, v1.0.0 when this goal's tree is empty; -dev.N prerelease tags serve only the cross-module-resolution case the release-and-ci principle states, never routine between-session practice. Each release is a coherent snapshot with its pins; a library change and the service change that proves it release together; a member release prompts the coordinator sweep.",
]
context = ["standards-lab/context/service-organization.md"]

[goals.v1.observability]
name = "Observability"
summary = '''
The go-observability infrastructure library: a base module over the stable OpenTelemetry API
and SDK, and an `otlp` sub-module pinning the exporters and the gRPC/protobuf weight they
carry — the shape and the standard-versus-native split are settled in the linked strategy
record. Logs stay on stdout as structured JSON with trace and span ids stamped in, ingested by
the collector's filelog receiver; the OTLP logs pipeline waits for that signal's SDK to reach a
stable release. The LGTM stack (Loki, Grafana, Tempo, Mimir) is reached entirely through the
OpenTelemetry standard — OTLP to the collector, standard exporters onward — with no native
deviation projected and never a Go dependency of its own. Sequenced before the layers that
follow so each instruments as it lands.
'''
context = ["go-observability/README.md"]

[goals.v1.middleware]
name = "The sourced middleware set"
summary = '''
CORS, real client IP, and compression remain; rate limiting has landed
(`go-web-sdk/middleware/rate-limit`). The convention is settled — each is imported as a declared
dependency, in its own capability sub-module when it carries a third-party dependency
(dependency-sourcing.md) — but the concrete adoption for the remaining three is not: versions,
real-IP's trusted-proxy configuration, and each library's own entry in go-web-sdk's
dependency-line statement. CORS's one recorded trigger is goals.v1.client; real client IP and
compression have none recorded and wait for one — neither has a live consumer yet: real-IP's
only other use, keying rate limiting, is covered by `RemoteAddr`; compression has no
large-response case until more of the data layer lands.
'''
context = [
  "go-web-sdk/context/middleware-sourcing.md",
  "architecture/context/dependency-sourcing.md",
]

[goals.v1.auth]
name = "Auth and authorization"
summary = '''
The go-auth infrastructure library with Keycloak as the declared provider (standard tier:
OAuth 2.0, OIDC, JWT); the subject anchor, the relationship-derived authorization model, and
the composition-root seams every domain builds against are settled in the linked strategy
record. The admin listener (v1.admin-listener) is a consumer of the authentication this goal
settles. What remains is the build: go-auth itself, the schema it introduces as a migration
source of its own, and the composition-root reshape in go-web-service. The storage domain's auth
sweep proves the composed authorized listing that the blobfs experiment cannot: the consumer's
join table driving a blobfs listing under the scope predicate.
'''
context = [
  "standards-lab/context/auth-strategy.md",
]

[goals.v1.admin-listener]
name = "The management listener"
summary = '''
The admin mount on its own listener, unreachable from the public API's network path,
authenticated through the auth layer, with audit logging on anything that mutates and a
confirmation token gating the destructive down, force, and state verbs; config rendering
over a go-core redaction contract; the
composition-root reshape in go-web-service and the same reshape in go-web-sdk-template.
Posture decisions on record: whether the serving role ever holds DDL, and whether off by
default is mandated by the standard. It waits on auth and observability, because each choice it
would make (the token's mechanism, the listener's authentication, the audit record) is one those
layers make.
'''
context = [
  "architecture/standards/go-elemental/principles/dsl-driven-services.md",
  "standards-lab/context/auth-strategy.md",
  "go-web-sdk/context/error-handling.md",
]

[goals.v1.messaging]
