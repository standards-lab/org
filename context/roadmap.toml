# Roadmap: the workspace's path to its target end state, holding only what remains. The format is
# marathon's references/manifest.md, and each active goal's record is context/goals/<goal>.md in
# its root repository.
#
# The workspace's exclusive group (.claude/marathon.toml) lets one active goal at a time touch
# the reference-architecture code repositories; graph-ergonomics holds it now. Outside the group,
# experiment.hosting's spike-model-hosting, spike-model-engines, and spike-hosting-upgrades have
# answered (ai-hosting.md, "Answers · experiment.hosting"), and spike-model-layout is active, with
# gb10-2 in experiment.hosting's host set since spike-ai-pipeline's docinfer task shipped.
# experiment.html's spike-html-design, spike-html-conventions, spike-html-packages,
# spike-html-apps, and spike-html-hosting have answered (html-artifacts.md, "Answers ·
# experiment.html"), and spike-html-go-wasm is active. experiment.graph's intake has settled
# graph-ergonomics' API (graph-ergonomics.md, "The settled API"); graph-ergonomics' release is
# next.
# The infrastructure libraries come before the data layer, and the data layer before auth by
# design: the architect wants to see how the domain layer scales before auth constrains it.
# Middleware is last; CORS's trigger, a client served cross-origin, fired in spike-html-apps.
#
# The path to the capstone, capstone.data-intelligence (plan, 2026-11-09): (a) finish the
# pre-capstone experiments; (b) take them in and build out the libraries and infrastructure the
# capstone needs, each library promoted into ~/architecture opened by a design review (against
# the full architecture standards and the workspace) and closed by an acceptance task that reruns
# the real workloads; (c) design the capstone's protocols and practices, its first tasks; (d)
# build the capstone; (e) continue the roadmap. The waves, each running its goals side by side:
# - A: spike-model-layout, spike-html-hosting (answered: html-artifacts.md, "Answers ·
#   experiment.html"), spike-ai-pipeline's `answer` (done), graph-ergonomics (go-core's graph
#   and lifecycle, reviewed while the exclusive group is free, before go-ai and the client SDK
#   build on them), and spike-graph, which proved its candidate API (done); then experiment.ai's
#   intake (done) and experiment.graph's (done), and graph-ergonomics' release and per-tier
#   migrations, ahead of wave C.
# - B: spike-model-gateway beside spike-html-go-wasm; then experiment.hosting's and
#   experiment.html's intakes.
# - C: v1.ai's sub-goals beside v1.client, which holds the exclusive group. v1.ai.tools stages
#   first, since it holds the architecture lock ahead of v1.ai.hosting (ai-hosting);
#   v1.ai.client (go-ai) and v1.ai.processing (unravel) follow it. go-ai, unravel, and the tool
#   repositories stay outside the group until C ends; then go-ai and unravel join it. Then
#   v1.data.extensions, the Postgres-extension strategy.
#   status-reports and training.foundation start here; status-reports' first backfill report
#   covers ~/architecture as it stands at the capstone's start.
# - D: capstone.data-intelligence, the sole active goal apart from status-reports and training;
#   it holds the libraries it may change, so a capstone task can fix a library and use the fix.
#   status-reports' second backfill report orients readers to the capstone.
# - E: experiment.ocr, experiment.admin, and experiment.harness, then v1.data, v1.auth,
#   v1.admin-listener, v1.deployment, v1.repository-docs, and v1.middleware; training units that
#   lock libraries run where the exclusive group is free.

