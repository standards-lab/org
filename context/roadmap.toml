template/v0.6.0 ships it; cmd/db and golang-migrate deleted; sqlint.toml, the compose
stack, and the mise tasks; the entity conventions (validation methods, the tag
conventions) documented in the domain architecture; the per-domain boilerplate extracted
before domains multiply (the linked findings note); the domain architecture and
composition root notes rewritten; the release with go-database v0.4.0.
'''
context = ["go-web-service/context/concepts/data-layer.md", "go-web-service/context/concepts/retrospective-findings.md", "standards-lab/experiments/sql-dsl/REVIEW.md"]

[goals.v1.data.sql.integration.tasks.listener]
name = "The management listener"
repos = ["go-web-service", "go-web-sdk", "go-web-sdk-template"]
summary = '''
The admin mount on its own listener, disabled unless configured, auth gating the mutating
half (administration may stage behind goals.v1.auth), config rendering waiting on a go-core
redaction contract (go-database's Config.Password has no redaction: no String, no
slog.LogValuer); go-web-sdk's config env segment made per-block. Posture decisions on
record: whether the serving role ever holds DDL, and whether off-by-default is mandated by
the standard (the strategy's open questions, §10).
'''
context = ["standards-lab/context/design/dsl-driven-services.md"]

