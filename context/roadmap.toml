# For go-ai: a /models listing would be a helpful diagnostic function of the client library;
# spike-ai-pipeline's docinfer reads /models itself on net/http, since client v0.4.0 has none
# (docinfer r5 q5).

# Notes on experiment.ai.spike-ai-pipeline, for experiment.ai's intake (the layer repositories'
# fixes are re-reviewed when go-ai and the tools are promoted).
#
# Backlog:
# - ODF, WordPerfect, .xlsb, and ODG still report "no processor yet", and legacy OLE2 macros go
#   unflagged; the architect judged them unlikely on the deployment's share drives (formats r1).
#   Text encoding detection (uchardet named 10 of 11 sample encodings) is revisited if the
#   windows-1252 fallback misreads many files (formats r3).
# - rtsp sources in processing's `media` need an rtsp server, such as MediaMTX in a container, as
#   the integration tier's loopback sender, since ffmpeg 9.0.2's rtsp listener fails (streams r2
#   q1).
# - Capture devices in processing's `media`: v4l2loopback, a kernel module the architect loads as
#   root, is the camera test seam. On Wayland, as on the architect's Omarchy laptop, which has no
#   X11, ffmpeg has no screen input: a portal capture tool such as gpu-screen-recorder streams the
#   screen to a URL or the reader, and pw-record feeds audio; x11grab applies only to X11 hosts.
#   The container runner would need device passthrough, the device's group, and socket mounts
#   (streams r2 q2).
# - An authored OneNote notebook, committed to spike-ai-pipeline-onenote with hand truth from
#   onenote-cli's round 2 authoring spec, needs desktop OneNote on Windows or a Mac, since OneNote
#   for the web can neither download nor export a notebook (onenote r6 q1).
#
# By repository:
# - spike-ai-pipeline (the root):
#   - host-update could detect a running llama container with no published port (or no network)
#     and print the fix, instead of waiting out its 120 s health check.
#   - Once spike-model-engines' gb10 pin reaches the root's (its screen branch, at 4d5e114, sets
#     b12098), re-copy host/ from that merge commit so llama.env is a copy again.
#   - Its next task: STANDARDS.md applies cli-applications.md to docproc and domain-files.md to
#     docproc's command packages only; say whether docinfer's packages follow both too.
# - spike-ai-pipeline-client, its next task: its CI trails jdx/mise-action v5.2.4 -> v5.2.7 and
#   taiki-e/create-gh-release-action v1.11.0 -> v1.12.0.
# - spike-ai-pipeline-processing:
#   - ClamAV could become an `inspect` check; v0.6.0 excludes it (onenote r6 q4).
#   - The `tool` package could bound every run's memory. The OneNote CLI's memory is unbounded:
#     onenote_parser issue #48 (a 375 MB OneDrive-format section needs over 9 GB) didn't show on
#     the 161 MB Large OneDrive.one, which peaks at 135 MiB, but bounds what a large, long-edited
#     section can need (onenote-cli finding; processing's onenote finding, "Known limits").
#   - The email `Threader` holds about 60 bytes a message for the whole read, about 60 MB past a
#     million messages; spilling its keys to disk would bound it.
#   - A bare RFC 822 file with no extension is unrouted, since the nested route needs an .eml name
#     or a message type.
#   - `Encryption.one`, a password-protected section, is reported failed rather than encrypted,
#     since the OneNote CLI gives no encryption signal; a signal from onenote, or an inspect check
#     for OneNote encryption, would make it Encrypted.
#   - Backlog: inspect exports no options check, so dispatch's bombRule validates its options
#     through `inspect.CheckListing(route.Zstd, 0, nil, opts)`. An exported check would replace
#     the indirect call.
#   - Its next task: its README's adapter convention could name the root's docproc as the shipped
#     composition root, since every wiring in the repository is a test's.
#   - Its next task: a PDF whose form read fails (qpdf refuses a field whose value is an indirect
#     reference, as in ~/docs' cfr-2024-title32-vol1.pdf) fails the whole document part after its
#     pages render, so the index never records it and every docproc re-run renders its 1,823 pages
#     again (docproc finding). A failed form read could be a warning beside the pages.
#   - Its next task: the audio stage's windows each run an ffmpeg that decodes the source from its
#     start, so a 4.4 h audiobook took 1,614 s in docproc's ~/docs run while every other input
#     finished in 332 s (docproc finding). Seeking per window, or one decode streamed into
#     windows, would bound it.
# - spike-ai-pipeline-office:
#   - Its next task: fixtures/README.md calls slide-objects' pictures "beside another", but
#     generate.py places both of slide 3's at one default position, so the blue square covers the
#     red; say so, or place them apart. office's README should state the limit processing now
#     records: pictures are listed with no layout, so a covered, off-slide, or cropped-away
#     picture is still a media block.
#   - office could write a huge workbook sheet by sheet, since it reads a whole document into its
#     model before writing it.
# - spike-ai-pipeline-mail:
#   - Its next task: the static musl release binary takes 2.0 to 2.3 times a glibc build's time on
#     large stores (13.27 s against 6.51 s on the 2.1 GB scale store at v0.1.0, 14.82 s against
#     6.88 s at v0.2.0) and 1.7 times on the 2.7 GB scale mboxrd (6.86 s against 4.09 s). Its
#     system time (3.2 s against 0.7 s on the store at v0.1.0, 2.6 to 2.8 s against 1.0 s on the
#     mboxrd) points at musl's allocator (docs/findings/mail-cli.md, "The release binary against a
#     glibc build" and ".eml and mbox"); measure a replacement allocator if processing's email
#     runs find the time matters.
#   - Its next task: its .claude/marathon.toml still says "No CI runs yet" and merges without
#     waiting on checks, though its CI runs; office and onenote chain `gh pr checks --watch` before
#     the merge (onenote-cli).
#   - mail caps a .msg's nesting at 16 levels; raise or lift the cap if real stores nest deeper.
# - spike-ai-pipeline-onenote: OneNote section decryption waits for a specification or an open
#   implementation, since [MS-ONESTORE] 2.5.19 leaves the scheme undocumented (onenote-cli,
#   round 2 q7).
#
# For `marathon retro` (architecture candidates):
# - "Follow the spec wherever possible", the architect's standing rule for the client
#   (client-streaming), may belong in STANDARDS.md or the architecture layer as a standard.
# - processing's STANDARDS.md says a mature tool is never reimplemented in Go, and audio's
