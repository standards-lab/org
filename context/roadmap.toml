# ── Backlog ────────────────────────────────────────────────────────────────────────────────

[goals.graph-ergonomics]
name = "graph ergonomics"
summary = '''
go-core's `graph` works, but its API is early: nodes are string-keyed, and the define functions
make it hard to see how a node is constructed and which layer it lands in. This goal irons those
out as more applications use the graph. The composition-root principle (`composition-terms.md`)
keeps the breaks inside composition roots, their fixtures, and the SDKs that run a graph.
'''

[goals.second-providers]
name = "Second providers"
summary = '''
Entra for auth, a second SQL engine — each proven by a focused
reference or a real consumer, one session each. A second broker proves go-messaging's standard
tier, which stays provisional until it does. A second SQL engine includes blobfs's own engine
sub-module; the NATS object store is a candidate go-storage provider, judged against go-storage's
standard tier (`standards-lab/context/messaging.md`). Post-1.0 candidate.
'''

[goals.dotnet-mirror]
name = "The .NET mirror"
summary = "The reference architecture mirrored in .NET. Post-1.0 candidate."

[goals.sql-meta-language]
name = "The SQL meta language"
summary = '''
A provider-agnostic SQL meta language. Its first phase exists: the sqlate grammar —
declarations, parameters and expansion, includes, namespaced patterns, tiers, overlays — is
language independent, and sqlate is its first host. What remains is schema typing (types
from the migration set rather than declared) and portability by construction (compiled to
a dialect rather than declared by tier); the concept is reframed in the docs pass. Not a
v1 dependency.
'''

[goals.real-client-ip]
name = "Real client IP"
summary = '''
Already part of v1.middleware's recorded sourced set (chi/v5/middleware.RealIP's shape,
reimplemented against a configured trusted-proxy list — middleware-sourcing.md), parked here
rather than scheduled because nothing needs it yet: RemoteAddr already serves its only two live
consumers, RequestLogger/Recoverer's client.address field and rate limiting's key. Becomes a task
under goals.v1.middleware.tasks once a reverse proxy sits in front of the service (the deployment
goal) or a consumer other than logging needs a trustworthy client identity — geo-blocking,
per-client abuse detection, an IP-keyed audit trail.
'''
context = ["go-web-sdk/context/middleware-sourcing.md"]

[goals.compression]
name = "Compression"
summary = '''
Already part of v1.middleware's recorded sourced set (github.com/klauspost/compress/gzhttp —
middleware-sourcing.md), parked here because no response is large enough yet to pay for the
wrapping and content negotiation. Becomes a task under goals.v1.middleware.tasks once a
large-payload endpoint lands — the data layer's paginated lists once domains beyond organization
exist, or a bulk admin export.
'''
context = ["go-web-sdk/context/middleware-sourcing.md"]

[goals.response-caching]
name = "Response caching"
summary = '''
HTTP response caching, raised alongside rate limiting but not part of the recorded sourced
middleware set (middleware-sourcing.md) or the declared stack (go-web-service's README, Stack). Redis
was the candidate provider; adopting it would be a new stack decision and most likely its own
infrastructure library, the way storage, messaging, and AI are, rather than an SDK-level
middleware. Split out of v1.middleware (2026-09-18) so caching gets its own planning session —
including whether it belongs in v1 at all — before any adoption. NATS key-value is a candidate
provider once messaging lands (`standards-lab/context/messaging.md`).
'''

[goals.sqlate-past-last-total]
name = "A total on a page past the last"
summary = "A scalar-subquery count in sqlate, so a page past the last still reports a total instead of `query.NoTotal`."

[goals.organization-image-active]
name = "Drop organization_image.active"
summary = "The column is now always true; drop it in a schema cleanup."

[goals.elemental-runtime-layers]
name = "Elemental layers beyond the app class"
summary = '''
The architect's raw direction: an app's binary runs on bare metal or is wrapped in a container,
the runtime layer, and application-layer hierarchies sit beyond it, differentiated by the
external services they connect to. Revisit when v1.deployment makes the container layer
concrete.
'''

[goals.graduation]
name = "Graduating a standard to its own organization"
summary = '''
A standard meant for production graduates to an organization of its own; the blueprint's
repositories keep their names, and the module namespace arrives with the new organization. Open:
graduating at or before v1.0 so no production consumer pins the blueprint's paths, and whether
repositories move or the new organization re-roots. Revisit as v1.0 nears.
'''

[goals.staged-query-aggregation]
name = "Staged query aggregation"
summary = '''
An orchestration layer composing a request's staged cross-service hops into one response graph,
each hop still authorized, filtered, and sorted in its own service: a live alternative to the
materialized read model. Gated on the bounded, staged query strategy (`auth-strategy.md` §7)
being built and on production experience with it.
'''

[goals.s3-put-memory]
name = "s3 Put's memory held to its read-ahead"
summary = '''
A multipart `Put` in go-storage's `s3` provider reads ahead part_size × (concurrency + 2), 48 MiB
at the defaults, but holds part_size × (concurrency + 3) with a declared size and
part_size × (concurrency + 4) without one, 56 and 64 MiB, while it starts. transfermanager copies
the first part out of `Put`'s decision buffer unpooled, and for an unknown size that buffer grows
by doubling. The outcome holds when `Put` holds no more than it reads ahead.
'''

[goals.transfermanager-log]
name = "transfermanager's log output through the application's logger"
summary = '''
When a multipart upload's completion fails, transfermanager writes to the standard library's
`log`, which bypasses the application's logger. go-storage's `s3` provider routes or silences
that output.
'''

[goals.web-service-port-settings]
name = "go-web-service's settings follow its container ports"
summary = '''
go-web-service's application settings follow `POSTGRES_PORT` and `AZURITE_BLOB_PORT`, as
sqlate's `SQLATE_DSN` and blobfs's `BLOBFS_DSN` and `BLOBFS_STORAGE_ENDPOINT` do. Its README
documents that moving a port splits the two until `APP_DATABASE_PORT` or `APP_STORAGE_ENDPOINT`
follows.
'''

[goals.api-versioning]
name = "Versioned public API after v1"
summary = '''
After go-web-service's v1.0.0, its public API changes by version rather than in place: the HTTP
API, and each event's type and data, which before v1 change freely with no version suffix
(v1.messaging, service-events). The outcome holds when a breaking change to either ships beside
the version it replaces.
'''
