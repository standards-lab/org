  "spike-ai-pipeline-mail",
]
remote = "https://github.com/JaimeStill/spike-ai-pipeline.git"
path = "~/experiments/spike-ai-pipeline"
summary = '''
Can a Go model client and a message, document, and stream processing layer, built under
go-elemental, carry a transactional, evented pipeline (metadata capture, inference extraction,
and embeddings stored in PostgreSQL with pgvector for semantic search) that a browser follows
stage by stage in real time? Five repositories: the client (`spike-ai-pipeline-client`), owned
Go infrastructure over the engines' native APIs with a pluggable wire format (Chat Completions,
then Anthropic Messages); the processing layer (`spike-ai-pipeline-processing`), which runs
mature system tools through adapters it owns (`system-tools.md`); the Open XML CLI
(`spike-ai-pipeline-office`), a NativeAOT tool for office documents; the mail CLI
(`spike-ai-pipeline-mail`), a static Rust tool for Outlook .pst stores and .msg messages; and the
root, which holds
gb10-2's host scripts and, once its gates clear, the capstone. It runs on gb10-2, reserved for
it; the Framework stays with experiment.hosting. The host, client, and processing tasks run now;
the capstone tasks wait for those tasks and for the answers of spike-model-engines,
spike-model-layout, spike-model-gateway, and spike-html-apps, not for either experiment's intake,
and the spike returns to `planned` between. The capstone's UI builds on spike-html-apps'
foundation v0.3.0, components v0.10.2, and sdk v0.4.0, with the SDK's event-sequence interface at
`./events.js` and its adapter at `./events/nats.js`, and cites spike-html-apps'
NATS-over-WebSocket record, under "The answer" in its README. Reads tau, spike-harness-driver,
herald, spike-model-hosting, spike-model-engines, and the members. Decides go-ai's model-client
surface, the processing layer's home, v1.ai.local-models, and v1.ai's library and service
tasks (`ai-strategy.md`, "Experiment: spike-ai-pipeline"). Set A's embedding model is to change from
embeddinggemma-2 to granite-embedding-english-r2, since vLLM can't serve EmbeddingGemma 2 on GB10
(`ai-hosting.md`, "Open for v1.ai.hosting's SETTLE").
'''

