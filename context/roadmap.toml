name = "Design review of graph and lifecycle"
repos = ["go-core"]
summary = '''
A holistic review of `graph` and `lifecycle` as their consumers use them across the workspace:
how a node is declared, keyed, constructed, and placed in a layer, and how a lifecycle is wired
and read. Proposes the API the architect approves, with its migration across the nine
repositories; the goal's later tasks are written from it.
