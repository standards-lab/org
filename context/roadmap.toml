[goals.s3-put-memory]
name = "s3 Put's memory held to its read-ahead"
summary = '''
A multipart `Put` in go-storage's `s3` provider reads ahead part_size × (concurrency + 2), 48 MiB
at the defaults, but holds part_size × (concurrency + 3) with a declared size and
part_size × (concurrency + 4) without one, 56 and 64 MiB, while it starts. transfermanager copies
the first part out of `Put`'s decision buffer unpooled, and for an unknown size that buffer grows
by doubling. The outcome holds when `Put` holds no more than it reads ahead.
'''

[goals.transfermanager-log]
name = "transfermanager's log output through the application's logger"
summary = '''
When a multipart upload's completion fails, transfermanager writes to the standard library's
`log`, which bypasses the application's logger. go-storage's `s3` provider routes or silences
that output.
'''

[goals.web-service-port-settings]
name = "go-web-service's settings follow its container ports"
summary = '''
go-web-service's application settings follow `POSTGRES_PORT` and `AZURITE_BLOB_PORT`, as
sqlate's `SQLATE_DSN` and blobfs's `BLOBFS_DSN` and `BLOBFS_STORAGE_ENDPOINT` do. Its README
documents that moving a port splits the two until `APP_DATABASE_PORT` or `APP_STORAGE_ENDPOINT`
follows.
'''

[goals.api-versioning]
name = "Versioned public API after v1"
summary = '''
After go-web-service's v1.0.0, its public API changes by version rather than in place: the HTTP
API, and each event's type and data, which before v1 change freely with no version suffix
(messaging.md, "Which commands emit events"). The outcome holds when a breaking change to either ships beside
the version it replaces.
'''

[goals.model-evaluation]
name = "Model evaluation at scale"
summary = '''
The large-scale benchmarking suite, once requirements call for it: benchmarking built from small
elements (a model's fit on a host, a model as an agent, a set of role models at once, any of these
under concurrent sessions or across hosts behind the gateway) composed into a workload per
scenario; results kept by model, build, preset, and host; a run queue per host; and a management
interface. Builds on the upgrade-evaluation convention, which v1.ai.hosting's `upgrades` task
rebuilds on vLLM, and spike-host-admin's CLI, and stays the place for workloads only we can
measure: our agents, and our role sets under our own sessions, with tuning at scale.
'''
# From experiment.hosting's intake (spike-hosting-upgrades' and spike-model-engines' answers):
# - The candidate backlog, which one screen a session can't clear: the Framework's second survey
#   lists over twenty agent candidates as needing measurement.
# - Workload-based tuning: concurrency and context tuned per model, workload, and host.
# - A `max_tokens` cap per tier in the agent-tier harness (spike-model-hosting's
#   `evaluation/suites/agent_quality.py`), recorded with the tier's list, so a runaway reply is a
#   counted cap hit, not a lost sample. BFCL sends none: on gb10-1 one multi-turn sample generated
#   23,306 output tokens, and the tier hit its 45-minute cap at 19 of 20 samples.
# - An embedding scenario: spike-hosting-upgrades' `bench/` has none, so no embedding candidate can
#   be measured.

