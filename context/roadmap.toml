[goals.v1.ai.processing]
name = "docproc, the processing library and its system tools"
root = "docproc"
repos = ["docproc", "architecture"]
remote = "https://github.com/standards-lab/docproc.git"
path = "~/architecture/docproc"
summary = '''
docproc, from spike-ai-pipeline-processing and spike-ai-pipeline's docproc command: an enabling
library, adjacent to the standard, beside sqlate. Its library module requires `golang.org/x/text`
only, drops the client, and depends on no model concept; inference is docinfer's. Its stores are
interfaces with filesystem and memory implementations in the library module, and providers as
nested modules: `docproc/storage` (the content store over go-storage) and `docproc/postgres` (the
index in PostgreSQL over sqlate). The nested `cmd/docproc` requires go-cli-sdk, go-core, and
golang.org/x/sys, and the run directory's `rundir` and `rundir/schema` are public packages of the
library's module, which docinfer's `cmd/docinfer` reads. The system tools docproc runs live beside
it under `tools/<format>`, each on its own toolchain and tagged `tools/<format>/v<version>`, the
subtree kept out of the Go module zip, so a contract change lands with its decoder in one pull
request (plan, 2026-11-12): docproc-ooxml from spike-ai-pipeline-office, docproc-mail from
spike-ai-pipeline-mail, and docproc-onenote from spike-ai-pipeline-onenote. Each tool has one
JSON (JSON Lines) contract with Markdown inside it as the text layer, no separate Markdown mode,
proven by committed golden outputs; batch IDs, per-item digests, provenance, warnings, and typed
metadata stay in docproc, docinfer, and Cerebro. Staged beside wave B's spikes, absorbing
v1.ai.tools (plan, 2026-11-12). docproc joins `exclusive` after wave C.
'''
context = [
  "standards-lab/context/ai-strategy.md",
  "standards-lab/context/system-tools.md",
  "standards-lab/context/data-intelligence.md",
]

