# ── v1 ─────────────────────────────────────────────────────────────────────────────────────

[goals.v1]
name = "The reference architecture at v1.0"
summary = '''
go-web-service reaches v1.0.0 as a holistic enterprise reference: every capability layer a
production web service reasonably encounters, complete in the running composition, each layer
built holistically — proving the architecture end to end and feeding the SDK,
infrastructure-library, and template features that emerge from it.
'''
criteria = [
  "Every capability goal beneath this one is closed: code, tests, and docs/ page complete; the standard tier used throughout with native use contained and entered in the port list; the capability's provider-swap class declared; and the promotion evaluation recorded — what moved outward into the SDKs, the libraries, and the template, and what stayed the service's own.",
  "The import-boundary lint is in place, and a docs/ page names each capability the service consumes, its class, and the port list.",
  "The service is versionless until 1.0: minor releases cut as layers complete in whatever order they land, v1.0.0 when this goal's tree is empty; -dev.N prerelease tags serve only the cross-module-resolution case the release-and-ci principle states, never routine between-session practice. Each release is a coherent snapshot with its pins; a library change and the service change that proves it release together; a member release prompts the coordinator sweep.",
]
context = ["standards-lab/context/design/service-organization.md"]

[goals.v1.data]
name = "Data composition and CQRS"
summary = '''
A composed data model over plain SQL and a CQRS-oriented interface, spanning go-database,
go-web-sdk, and the service's domain packages. The domain design direction — the four domains,
their invariants, and the CQRS contract — lives in the linked note.
'''
context = ["go-web-service/context/concepts/data-layer.md"]

[goals.v1.data.sql]
name = "SQL as a DSL-driven service"
summary = '''
The native-SQL strategy executed as the prototype proved it: sqlate, the standalone SQL
templating library, owns everything from the file to the row; go-database v0.4 is reduced
to the infrastructure service with an admin package over sqlate; the reference service
follows with per-domain statements/, the data layer, the admin mount, and the management
listener; the docs and harness carry the principles. The strategy record holds the
reasoning, the retrospective's breaking-window adjustments, and the prototype's.
'''
criteria = [
  "sqlate v0.1.0 with its postgres sub-module and go-database v0.4.0 with its admin package released; the organization domain runs on authored SQL end to end.",
  "cmd/db and golang-migrate are gone; verify/apply/seed are library mechanisms triggered by the composition root.",
  "The DSL-driven-services principle, the sqlate pages, the rewritten go-database pages, the grammar's page, and the service's page land in the docs tier.",
]
context = ["standards-lab/context/design/dsl-driven-services.md", "standards-lab/experiments/sql-dsl/REVIEW.md"]

[goals.v1.data.sql.integration]
name = "The DSL service integration"
summary = '''
The prototype's shape adopted across the workspace in dependency order: sqlate created
from the spike's lib/ and sqlint, go-database reduced to the infrastructure service and
given the admin package, go-web-sdk's three items, the template laying the composition
root out as files with the admin layer as shape, and the reference service rewritten onto
sqlate with cmd/db and golang-migrate gone. Database infrastructure setup and management
are reference-architecture patterns the service proves and the docs pass documents; the
template stays engine-free. The review is the linked record.
'''
criteria = [
  "sqlate v0.1.0 with its postgres sub-module and go-database v0.4.0 with its admin package released; the service pins them and the organization domain runs on authored SQL end to end.",
  "Every service-side principle the experiment incubated is built in the reference service and documented in the domain architecture or the landing zone.",
]
context = ["standards-lab/experiments/sql-dsl/REVIEW.md", "sqlate/README.md"]

