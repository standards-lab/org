[goals.v1.harness.tasks.sitrep]
name = "The marathon-sitrep extension"
repos = ["claude-plugins", "standards-lab"]
summary = '''
Waits until the architect calls for it. The organization's situational-awareness tool:
enterprise-wide awareness of progress on engineering efforts, published to a GitHub Pages dev
blog. Two entry categories to start: the sitrep, an update at a set interval for a project or
workspace, drafted from marathon's own record (the reset file, the roadmap deltas, the commit
history, and the pull-request descriptions) and calibrated by a style profile; and the brief,
orientation for leadership framed per audience, into which the coordinator's briefs/ and
interview.md transition. Further categories wait for a need. The blog scaffold and publish
mechanics belong to a dev-blog skill (the capture, draft, publish pipeline the TAU dev blog
established) that the extension calls rather than re-encodes; the extension owns reading the
workspace and drafting. First member of the enhancement facet of the extension taxonomy; the
taxonomy amendment lands with it if it ships before extraction.
'''
context = [
  "claude-plugins/context/marathon-sitrep.md",
  "claude-plugins/context/tool-based-skills.md",
]

[goals.v1.harness.tasks.extraction]
name = "The marathon-extraction extension"
repos = ["claude-plugins"]
summary = '''
The architectural record extracted from a consumer as a hybrid marathon extension: a
consumer-side ledger and prose bundle, a blueprint-side intake producing roadmap work and
appending the bundle's sources to the references catalog; first member go-web-service's
data-layer record at v1.data.evaluation, crossing mechanics when a private consumer earns
them.
'''
context = [
  "claude-plugins/context/marathon-extraction.md",
  "claude-plugins/context/marathon-sitrep.md",
]

[goals.v1.harness.tasks.references]
name = "The references system as a marathon extension"
repos = ["claude-plugins"]
summary = '''
Evaluate promoting the workspace's references catalog (references.toml/local/md, whose
mechanics references.md states) to a marathon extension owning the three-file artifact; the
proposal and its open questions — facet, hooks, artifact location — are the linked note.
extraction's references append is its first concrete consumer.
'''
context = ["claude-plugins/context/marathon-references-extension.md"]

[goals.v1.harness.tasks.tooling]
name = "The tooling layer beneath the harness"
repos = ["claude-plugins"]
summary = '''
The deterministic half of the harness as tools the skills call rather than process the skills
describe (tool-based-skills.md, "What a tool carries and what a skill carries", "The three
layers a tooling domain is built in", and "How an extension uses the tooling"): schemas for the
roadmap manifest and the goal record, the validators over them, and the checks the extensions need (extraction's bundle
schema, evidence gate, origin de-duplication, and want-list generation). First consumers:
marathon's manifest and goal records, and extraction.
'''
context = ["claude-plugins/context/tool-based-skills.md"]

[goals.v1.harness.tasks.local-models]
name = "Local models as Claude Code subagents"
repos = ["claude-plugins"]
summary = '''
The convention for routing Claude Code subagent tasks to locally hosted models: the profile
format, the routing mechanism, and which kinds of task may run locally, from experiment.ai's
spike-local-models result. Waits on experiment.ai's intake.
'''
context = ["standards-lab/context/ai-strategy.md"]

# ── experiment ─────────────────────────────────────────────────────────────────────────────

[goals.experiment]
name = "Experiments"
summary = "The spikes that settle what a goal is built from, each topic a goal with an intake last."

[goals.experiment.ai]
name = "The AI experiments"
summary = '''
Three spikes that settle what v1.ai is built from, each a sub-goal run through its own path, then
one combined intake.
'''
context = [
  "standards-lab/context/ai-strategy.md",
  "standards-lab/context/ai-hosting.md",
]

[goals.experiment.ai.tasks.intake]
name = "The combined intake"
summary = '''
Run by `marathon intake experiment.ai` once spike-harness-driver, spike-model-hosting, and
spike-local-models have their answers in `ai-strategy.md`. Decides go-ai's shape and whether a
service's container carries a harness, what v1.ai.hosting builds, and both local-models
conventions from spike-local-models: v1.ai.local-models (local models for application workloads)
and v1.harness.local-models (routing Claude Code subagent tasks to local models). The
architecture-layer candidates (model tiers, context sizing, the memory-footprint method, and the
serving conventions) are decided here too, from spike-model-hosting's result. It also decides
whether personal-agents' contents and spike-model-hosting's findings move into a fresh workspace
repository. The tasks it writes run v1.ai's `hosting` task before its `local-models` task: the
hosting details are settled before the local models themselves. Its one coordinator pull request
writes those tasks and removes the experiment; it then archives spike-harness-driver,
spike-model-hosting, and spike-local-models. personal-agents was only a read-only reference and
is never archived by this intake.
'''

[goals.experiment.ai.spike-model-hosting]
name = "Hosting local models"
root = "spike-model-hosting"
repos = ["spike-model-hosting"]
remote = "https://github.com/JaimeStill/spike-model-hosting.git"
path = "~/experiments/spike-model-hosting"
summary = '''
Which serving configuration and specification shape hold across both host classes (Strix Halo
with Vulkan, Dell NVIDIA with CUDA) and all three consumers at once? Decides the `ai-hosting`
specification: the host-class profile's schema, whether a gateway (agentgateway the candidate)
sits in front of the router, and the admin tooling's form (`ai-hosting.md`, "Experiment:
spike-model-hosting").
`~/code/personal-agents` is a read-only reference, recorded when `plan` sets the spike up.
'''

[goals.experiment.ai.spike-local-models]
name = "Using local models"
root = "spike-local-models"
repos = ["spike-local-models"]
remote = "https://github.com/JaimeStill/spike-local-models.git"
path = "~/experiments/spike-local-models"
summary = '''
On the hosting spike-model-hosting settles, how are locally hosted models used (a) for
application workloads and (b) for Claude Code subagent tasks, and for which kinds of task is the
output acceptable? Decides v1.ai.local-models and v1.harness.local-models (`ai-strategy.md`,
"Experiment: spike-local-models").
'''

# ── Backlog ────────────────────────────────────────────────────────────────────────────────

[goals.second-providers]
name = "Second providers"
summary = '''
Entra for auth, the storage counterpart, a second SQL engine — each proven by a focused
reference or a real consumer, one session each. A second broker proves go-messaging's standard
tier, which stays provisional until it does. A second SQL engine includes blobfs's own engine
sub-module; the NATS object store is a candidate go-storage provider, judged against go-storage's
standard tier (`standards-lab/context/messaging.md`). Post-1.0 candidate.
'''

[goals.dotnet-mirror]
name = "The .NET mirror"
summary = "The reference architecture mirrored in .NET. Post-1.0 candidate."

[goals.external-client]
name = "External client"
summary = "An external web-platform-native client repository. Post-1.0 candidate."

[goals.docs-site]
name = "The organization docs site"
summary = '''
The documentation site serving the architecture repository's content. The sitrep blog's GitHub Pages
blueprint (Jekyll, Actions deployment, the publish pipeline) is the starting point. Planned
hosting: a thin `standards-lab.github.io` repository whose workflow builds `architecture` on a
`repository_dispatch` and deploys with `actions/deploy-pages`. Waits until the initial reference
architecture is in place; the diagram and voice standards are planned with it.
'''

[goals.sql-meta-language]
name = "The SQL meta language"
summary = '''
A provider-agnostic SQL meta language. Its first phase exists: the sqlate grammar —
declarations, parameters and expansion, includes, namespaced patterns, tiers, overlays — is
language independent, and sqlate is its first host. What remains is schema typing (types
from the migration set rather than declared) and portability by construction (compiled to
a dialect rather than declared by tier); the concept is reframed in the docs pass. Not a
v1 dependency.
'''

[goals.real-client-ip]
name = "Real client IP"
summary = '''
Already part of v1.middleware's recorded sourced set (chi/v5/middleware.RealIP's shape,
reimplemented against a configured trusted-proxy list — middleware-sourcing.md), parked here
rather than scheduled because nothing needs it yet: RemoteAddr already serves its only two live
consumers, RequestLogger/Recoverer's client.address field and rate limiting's key. Becomes a task
under goals.v1.middleware.tasks once a reverse proxy sits in front of the service (the deployment
goal) or a consumer other than logging needs a trustworthy client identity — geo-blocking,
per-client abuse detection, an IP-keyed audit trail.
'''
context = ["go-web-sdk/context/middleware-sourcing.md"]

[goals.compression]
name = "Compression"
summary = '''
Already part of v1.middleware's recorded sourced set (github.com/klauspost/compress/gzhttp —
middleware-sourcing.md), parked here because no response is large enough yet to pay for the
wrapping and content negotiation. Becomes a task under goals.v1.middleware.tasks once a
large-payload endpoint lands — the data layer's paginated lists once domains beyond organization
exist, or a bulk admin export.
'''
context = ["go-web-sdk/context/middleware-sourcing.md"]

[goals.response-caching]
name = "Response caching"
summary = '''
HTTP response caching, raised alongside rate limiting but not part of the recorded sourced
middleware set (middleware-sourcing.md) or the declared stack (go-web-service's README, Stack). Redis
was the candidate provider; adopting it would be a new stack decision and most likely its own
infrastructure library, the way storage, messaging, and AI are, rather than an SDK-level
middleware. Split out of v1.middleware (2026-09-18) so caching gets its own planning session —
including whether it belongs in v1 at all — before any adoption. NATS key-value is a candidate
provider once messaging lands (`standards-lab/context/messaging.md`).
'''

[goals.sqlate-past-last-total]
name = "A total on a page past the last"
summary = "A scalar-subquery count in sqlate, so a page past the last still reports a total instead of `query.NoTotal`."

[goals.organization-image-active]
name = "Drop organization_image.active"
summary = "The column is now always true; drop it in a schema cleanup."

[goals.elemental-runtime-layers]
name = "Elemental layers beyond the app class"
summary = '''
The architect's raw direction: an app's binary runs on bare metal or is wrapped in a container,
the runtime layer, and application-layer hierarchies sit beyond it, differentiated by the
external services they connect to. Revisit when v1.deployment makes the container layer
concrete.
'''

[goals.graduation]
name = "Graduating a standard to its own organization"
summary = '''
A standard meant for production graduates to an organization of its own; the blueprint's
repositories keep their names, and the module namespace arrives with the new organization. Open:
graduating at or before v1.0 so no production consumer pins the blueprint's paths, and whether
repositories move or the new organization re-roots. Revisit as v1.0 nears.
'''

[goals.staged-query-aggregation]
name = "Staged query aggregation"
summary = '''
An orchestration layer composing a request's staged cross-service hops into one response graph,
each hop still authorized, filtered, and sorted in its own service: a live alternative to the
materialized read model. Gated on the bounded, staged query strategy (`auth-strategy.md` §7)
being built and on production experience with it.
'''

