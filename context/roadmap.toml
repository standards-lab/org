name = "docproc-mail"
summary = '''
docproc-mail from spike-ai-pipeline-mail: the Rust CLI, published as static musl binaries, that
reads .pst stores, .msg and .eml messages, and mbox files into JSON Lines of its contract. Adds
`smtp_address` for Exchange (EX) addresses, so a sender has one identity across .pst and .eml.
Its fixture generator moves to MimeKit 5.0.0, its fixture truth unchanged. CI checks gate the
merge, as office's and onenote's did; the spike merged without waiting on checks.
'''
# Inputs from spike-ai-pipeline-mail:
# - The static musl release binary takes 2.0 to 2.3 times a glibc build's time on large stores
#   (13.27 s against 6.51 s on the 2.1 GB scale store at v0.1.0, 14.82 s against 6.88 s at
#   v0.2.0) and 1.7 times on the 2.7 GB scale mboxrd (6.86 s against 4.09 s). Its system time
#   (3.2 s against 0.7 s on the store at v0.1.0, 2.6 to 2.8 s against 1.0 s on the mboxrd) points
#   at musl's allocator (docs/findings/mail-cli.md, "The release binary against a glibc build"
#   and ".eml and mbox"); measure a replacement allocator if processing's email runs find the
#   time matters.
# - Backlog: mail caps a .msg's nesting at 16 levels; raise or lift the cap if real stores nest
#   deeper.

[goals.v1.ai.processing.tasks.onenote]
name = "docproc-onenote"
summary = '''
docproc-onenote from spike-ai-pipeline-onenote: the Rust CLI, published as static musl binaries,
that reads OneNote sections, .onepkg exports, and notebook directories through onenote_parser
into JSON Lines of its contract. typed-path moves only with onenote_parser.
'''
# Inputs from spike-ai-pipeline-onenote (backlog):
# - Section decryption waits for a specification or an open implementation, since [MS-ONESTORE]
#   2.5.19 leaves the scheme undocumented (onenote-cli, round 2 q7).
# - An authored OneNote notebook, committed with hand truth from onenote-cli's round 2 authoring
#   spec, needs desktop OneNote on Windows or a Mac, since OneNote for the web can neither
#   download nor export a notebook (onenote r6 q1).

[goals.v1.ai.processing.tasks.library]
name = "The processing library"
summary = '''
docproc's library module from spike-ai-pipeline-processing, without the client (`layers.md`,
"docproc's packages"): inspection and routing, the tool runners and readers, the stages, and
dispatch with its content store and index, each store an interface with filesystem and memory
implementations; the providers `docproc/storage` (over go-storage) and `docproc/postgres` (over
sqlate) as nested modules; and `rundir` and `rundir/schema` as public packages. It holds no
inference orchestration, which is docinfer's (v1.ai.inference). A PDF whose form
read fails (qpdf refuses a field whose value is an indirect reference, as in ~/docs'
cfr-2024-title32-vol1.pdf) fails the whole document part after its pages render, so the index
never records it and every docproc rerun renders its 1,823 pages again; a failed form read could
be a warning beside the pages. The audio stage's windows each run an ffmpeg that decodes the
source from its start, so a 4.4 h audiobook took 1,614 s in docproc's ~/docs run while every
other input finished in 332 s; seeking per window, or one decode streamed into windows, would
bound it (docproc finding).
'''
# Backlog from spike-ai-pipeline-processing:
# - ODF, WordPerfect, .xlsb, and ODG still report "no processor yet", and legacy OLE2 macros go
#   unflagged; the architect judged them unlikely on the deployment's share drives (formats r1).
#   Text encoding detection (uchardet named 10 of 11 sample encodings) is revisited if the
#   windows-1252 fallback misreads many files (formats r3).
# - rtsp sources in `media` need an rtsp server, such as MediaMTX in a container, as the
#   integration tier's loopback sender, since ffmpeg 9.0.2's rtsp listener fails (streams r2 q1).
# - Capture devices in `media`: v4l2loopback, a kernel module the architect loads as root, is the
#   camera test seam. On Wayland, as on the architect's Omarchy laptop, which has no X11, ffmpeg
#   has no screen input: a portal capture tool such as gpu-screen-recorder streams the screen to
#   a URL or the reader, and pw-record feeds audio; x11grab applies only to X11 hosts. The
#   container runner would need device passthrough, the device's group, and socket mounts
#   (streams r2 q2).
# - ClamAV could become an `inspect` check; processing v0.6.0 excludes it (onenote r6 q4).
# - The `tool` package could bound every run's memory. The OneNote CLI's memory is unbounded:
#   onenote_parser issue #48 (a 375 MB OneDrive-format section needs over 9 GB) didn't show on
#   the 161 MB Large OneDrive.one, which peaks at 135 MiB, but bounds what a large, long-edited
#   section can need (onenote-cli finding; processing's onenote finding, "Known limits").
# - The email `Threader` holds about 60 bytes a message for the whole read, about 60 MB past a
#   million messages; spilling its keys to disk would bound it.
# - A bare RFC 822 file with no extension is unrouted, since the nested route needs an .eml name
#   or a message type.
# - `Encryption.one`, a password-protected section, is reported failed rather than encrypted,
#   since the OneNote CLI gives no encryption signal; a signal from docproc-onenote, or an inspect
#   check for OneNote encryption, would make it Encrypted.
# - inspect exports no options check, so dispatch's bombRule validates its options through
#   `inspect.CheckListing(route.Zstd, 0, nil, opts)`. An exported check would replace the
#   indirect call.

