name = "The capability models on vLLM"
summary = '''
Vision (Gemma 4 26B-A4B), audio (E4B) and embedding (granite) on vLLM v0.33.0 in containers, each
in its own process, alone and together, on the capability GB10 (gb10-2) and on the Framework (vLLM
