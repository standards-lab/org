name = "The reference service on sqlate"
repos = ["go-web-service", "go-database", "go-web-sdk"]
summary = '''
The coordinated rewrite: the organization domain on authored SQL as the spike built it;
the root-level data package (the session-and-catalog grouping with the statements
registry, migrations, patterns, the seeds behind the seeder, and the directives lowering
from web.Query, placed per the layout in the linked data-layer note); admin/database over
