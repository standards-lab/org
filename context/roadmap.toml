# Roadmap: the workspace's path to its target end state, holding only what remains. The format is
# marathon's references/manifest.md, and each active goal's record is context/goals/<goal>.md in
# its root repository.
#
# The workspace's exclusive group (.claude/marathon.toml) lets one active goal at a time touch
# the reference-architecture code repositories. go-core-graph takes that slot first: it
# promotes spike-cli-architecture's graph and lifecycle into go-core and moves the web stack
# onto them. Once go-core-graph syncs, cli's plan stages it and sets up go-cli-sdk and
# go-cli-sdk-template, and experiment.ai.spike-model-hosting (outside the exclusive group)
# stages beside it, then
# spike-local-models. slab takes the slot once cli syncs, and v1.messaging follows it, the
# first work on the 0.16 conventions. The infrastructure libraries come before the data
# layer, and the data layer before auth by design: the architect wants to see how the domain
# layer scales before auth constrains it. Middleware is last: CORS waits for v1.client.

active = [
  "go-core-graph",
]

planned = [
  "cli",
  "experiment.ai.spike-model-hosting",
  "slab",
  "experiment.ai.spike-local-models",
  "v1.messaging",
  "v1.ai",
  "v1.data",
  "v1.auth",
  "v1.admin-listener",
  "v1.client",
  "v1.deployment",
  "v1.repository-docs",
  "v1.middleware",
]

backlog = [
  "v1.observability",
  "v1.harness",
  "sqlate-past-last-total",
  "organization-image-active",
  "second-providers",
  "dotnet-mirror",
  "external-client",
  "docs-site",
  "sql-meta-language",
  "real-client-ip",
  "compression",
  "response-caching",
  "elemental-runtime-layers",
  "graduation",
  "staged-query-aggregation",
  "slab-json-partial-color",
]

# ── go-core-graph ──────────────────────────────────────────────────────────────────────────

[goals.go-core-graph]
name = "The dependency graph in go-core and the web stack"
root = "go-core"
repos = ["go-core", "go-web-sdk", "go-storage", "go-web-sdk-template", "go-web-service"]
summary = '''
go-core gains `graph`, rebuilds `lifecycle` as the graph's executor, and gives
`process/processtest` a one-shot runner for CLIs. Then the web stack adopts that release:
go-web-sdk and go-storage adapt, and go-web-sdk-template's and go-web-service's composition
roots move from the stage table onto the graph. spike-cli-architecture's `graph` and
`lifecycle` packages are the prototype, promoted at the API its validate task left them
(`cli-applications.md`, "The plan"). Retired: `Add`, `Service`, the stages, `StageRoot`, and
Run's timeout parameter. Kept: `OnReady`, `Monitor`, `Ready`, and `Checks`, with readiness
inferred from `ReadinessChecker`. Shutdown also runs for a subsystem whose Start failed.
go-database and go-observability break on nothing and take the release at their own
currency. At sync, architecture's `lifecycle-and-context.md` drops its `lifecycle.Service`
and `Stage` text and "does not follow it yet", `topology-and-naming.md` drops `stages.go`,
and the five links to spike-cli-architecture repoint to go-core. Also at sync, v1.messaging's
core-reactor and template task summaries and `messaging.md`'s "Lifecycle registration" are
rewritten onto the graph: drain order from the graph's layers, and each value's Err found the
way the go-core task rules. Runs before `cli` builds.
'''
context = ["standards-lab/context/cli-applications.md"]

[goals.go-core-graph.tasks.go-core]
name = "go-core graph and lifecycle"
repos = ["go-core"]
summary = '''
Promotes spike-cli-architecture's `graph` at validate's API (Graph, Define, Replace, Observe,
Build, Node and its Name, Ref, Scope.Use and Scope.After, System.Get and System.Layers,
Dependency; standard library only). Rebuilds `lifecycle` as a Coordinator over a
`graph.System`: New(sys, cfg), Exec and Run, Starter, Stopper, Subsystem, and
Config.ShutdownTimeout, keeping OnReady, Monitor, Ready, and Checks, with readiness inferred
from ReadinessChecker. The spike's Coordinator doesn't implement those four, so this task
designs them: how a node inside the System reaches the Coordinator's readiness, and what
becomes of OnStartup and OnShutdown. `processtest` gains a one-shot runner beside Launch (args,
stdin, and env in; stdout, stderr, and exit code out; on Main's build), from the spike's
integration runner. go-core's existing black-box tests pass, adapted only for the break.
Releases go-core v0.6.0.
'''
context = ["standards-lab/context/cli-applications.md"]

[goals.go-core-graph.tasks.go-storage]
name = "go-storage on go-core v0.6.0"
repos = ["go-storage"]
