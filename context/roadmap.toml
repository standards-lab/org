[goals.experiment.ai.tasks.intake]
name = "The combined intake"
summary = '''
Decides go-ai's shape and whether a service's container carries a harness, the
v1.harness.local-models convention, and what v1.ai.hosting builds, as pending edits for the
coordinator. The architecture-layer candidates (model tiers, context sizing, the memory-footprint
method, and the serving conventions) are decided here too, from the personal-agents result. The
sync archives spike-harness-driver and spike-local-subagents; personal-agents stays unarchived
until v1.ai.hosting.
'''

