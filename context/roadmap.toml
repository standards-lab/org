# ── v1 ─────────────────────────────────────────────────────────────────────────────────────

[goals.v1]
name = "The reference architecture at v1.0"
summary = '''
go-web-service reaches v1.0.0 as a holistic enterprise reference: every capability layer a
production web service reasonably encounters, complete in the running composition, each layer
built holistically — proving the architecture end to end and feeding the SDK,
infrastructure-library, and template features that emerge from it.
'''
criteria = [
  "Every capability goal beneath this one is closed: code, tests, and the layer's documentation in its repository (README, package documentation, and the docs/ guide of v1.repository-docs) complete; the standard tier used throughout with native use contained and entered in the port list; the capability's provider-swap class declared; and the promotion evaluation recorded — what moved outward into the SDKs, the libraries, and the template, and what stayed the service's own.",
  "A layer goal closes once its extracted record has produced the library, the template element, and the repository documentation, wherever the layer was proven (ruled 2026-09-07, claude-plugins/context/marathon-extraction.md). v1.0 keeps the running composition: a layer proven outside go-web-service is adopted by the service in a sweep task of its own before this goal closes.",
  "Import boundaries are a reviewed discipline — dependencies point bottom-up, no provider enters a base, and each module stays light — held in planning and review, and the service's README names each capability the service consumes, its class, and the port list.",
  "The service is versionless until 1.0: minor releases cut as layers complete in whatever order they land, v1.0.0 when this goal's tree is empty; -dev.N prerelease tags serve only the cross-module-resolution case the release-and-ci principle states, never routine between-session practice. Each release is a coherent snapshot with its pins; a library change and the service change that proves it release together; a member release prompts the coordinator sweep.",
]
context = ["standards-lab/context/service-organization.md"]

[goals.v1.observability]
name = "Observability"
summary = '''
The go-observability infrastructure library: a base module over the stable OpenTelemetry API
and SDK, and an `otlp` sub-module pinning the exporters and the gRPC/protobuf weight they
carry — the shape and the standard-versus-native split are settled in the linked strategy
record. Logs stay on stdout as structured JSON with trace and span ids stamped in, ingested by
the collector's filelog receiver; the OTLP logs pipeline waits for that signal's SDK to reach a
stable release. The LGTM stack (Loki, Grafana, Tempo, Mimir) is reached entirely through the
OpenTelemetry standard — OTLP to the collector, standard exporters onward — with no native
deviation projected and never a Go dependency of its own. Sequenced before the layers that
follow so each instruments as it lands.
'''
context = ["go-observability/README.md"]

[goals.v1.middleware]
name = "The sourced middleware set"
summary = '''
CORS, real client IP, and compression remain; rate limiting has landed
(`go-web-sdk/middleware/rate-limit`). rate-limit's main carries untagged go-core v0.6.0, httprate
v0.16.1, and the go-web-sdk v0.14.0 requirement; its next release dates them and can move to
go-web-sdk v0.15.0. The convention is settled — each is imported as a declared
dependency, in its own capability sub-module when it carries a third-party dependency — but the
concrete adoption for the remaining three is not: versions, real-IP's trusted-proxy
configuration, and each library's own entry in go-web-sdk's dependency-line statement.
CORS's trigger is the first client served cross-origin, such as an external client or a
Pages-hosted page that calls a service; v1.client's embedded client is same-origin and sends no
cross-origin requests (standards-lab/context/web-client.md). That trigger has fired:
spike-html-apps' external client calls two services. It needed one allowed-origins list shared
by the CORS middleware and the NATS WebSocket listener, Authorization and Content-Type allowed, a
preflight on every upload sent with a progress listener, and the caller naming the methods.
rs/cors reads an empty list as admitting every origin, which the spike's wrapper turns into a
pass-through. rs/cors's latest tag is v1.11.1 (2024-08) while its main stays active, with #220
(credentialed wildcard) and #222 (malformed origins) open; jub0bs/cors is the alternative to
weigh, and herald's CORS middleware (`HERALD_CORS_*`) is prior art. Real client IP and
compression have none recorded and wait for one — neither has a live consumer yet: real-IP's
only other use, keying rate limiting, is covered by `RemoteAddr`; compression has no
large-response case until more of the data layer lands.
'''
context = [
  "go-web-sdk/context/middleware-sourcing.md",
  "architecture/standards/go-elemental/principles/dependencies.md",
]

[goals.v1.auth]
name = "Auth and authorization"
summary = '''
The go-auth infrastructure library with Keycloak as the declared provider (standard tier:
OAuth 2.0, OIDC, JWT); the subject anchor, the relationship-derived authorization model, and
the composition-root seams every domain builds against are settled in the linked strategy
record. The admin listener (v1.admin-listener) is a consumer of the authentication this goal
settles. What remains is the build: go-auth itself, the schema it introduces as a migration
source of its own, and the composition-root reshape in go-web-service. The storage domain's auth
sweep proves the composed authorized listing that the blobfs experiment cannot: the consumer's
join table driving a blobfs listing under the scope predicate. v1.client lands first, on the
open API, so this goal adds a client sweep task: the reference client behind authentication,
and whether an image is fetched as an `<img>` with a cookie or with a bearer token.
'''
context = ["standards-lab/context/auth-strategy.md", "standards-lab/context/web-client.md"]

[goals.v1.admin-listener]
name = "The management listener"
summary = '''
The admin mount on its own listener, unreachable from the public API's network path,
authenticated through the auth layer, with audit logging on anything that mutates and a
confirmation token gating the destructive down, force, and state verbs; config rendering
over a go-core redaction contract; the
composition-root reshape in go-web-service and the same reshape in go-web-sdk-template.
Posture decisions on record: whether the serving role ever holds DDL, and whether off by
default is mandated by the standard. It waits on auth and observability, because each choice it
would make (the token's mechanism, the listener's authentication, the audit record) is one those
layers make.
'''
context = [
  "architecture/standards/go-elemental/principles/dsl-driven-services.md",
  "standards-lab/context/auth-strategy.md",
  "go-web-sdk/context/error-handling.md",
]

