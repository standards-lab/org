[goals.experiment.ai.spike-ai-pipeline]
name = "The model client and processing layers, proven by a pipeline"
root = "spike-ai-pipeline"
repos = [
  "spike-ai-pipeline",
  "spike-ai-pipeline-client",
  "spike-ai-pipeline-processing",
  "spike-ai-pipeline-office",
]
remote = "https://github.com/JaimeStill/spike-ai-pipeline.git"
path = "~/experiments/spike-ai-pipeline"
summary = '''
Can a Go model client and a message, document, and stream processing layer, built under
go-elemental, carry a transactional, evented pipeline (metadata capture, inference extraction,
and embeddings stored in PostgreSQL with pgvector for semantic search) that a browser follows
stage by stage in real time? Four repositories: the client (`spike-ai-pipeline-client`), owned
Go infrastructure over the engines' native APIs with a pluggable wire format (Chat Completions,
then Anthropic Messages); the processing layer (`spike-ai-pipeline-processing`), which runs
mature system tools through adapters it owns (`system-tools.md`); the Open XML CLI
(`spike-ai-pipeline-office`), a NativeAOT tool for office documents; and the root, which holds
gb10-2's host scripts and, once its gates clear, the capstone. It runs on gb10-2, reserved for
it; the Framework stays with experiment.hosting. The host, client, and processing tasks run now;
the capstone tasks wait for those tasks, spike-model-gateway's answer, and experiment.html's
intake, and the spike returns to `planned` between. Reads tau, spike-harness-driver, herald,
spike-model-hosting, spike-model-engines, and the members. Decides go-ai's model-client surface,
the processing layer's home, v1.ai.local-models, and v1.ai's library and service tasks
(`ai-strategy.md`, "Experiment: spike-ai-pipeline").
'''

