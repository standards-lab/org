embedding, with requests directed to a host by capability; the Framework's role (overflow or
capability host) follows from that comparison. Measures the agent alone on vLLM, in a container:
on gb10-1, gpt-oss-120b on vLLM v0.32.0 gave 34.0 tok/s at 1 stream against llama.cpp's 50.0, and
168.2 against 129.0 at 16 (spike-hosting-upgrades, gb10-1 report 2026-10-31), and a llama.cpp
maintainer notes it "mostly optimizes upto 8 parallel sequences at the moment" (#31711). Measures
the capability models (vision, audio and embedding) on vLLM in containers, each in its own
process, on gb10-2 and the Framework, against llama.cpp. The layout is vLLM instances, one model
each, placed across gb10-1 and gb10-2, with the Framework as backup compute; loading on demand and
two-node serving over QSFP are not pursued (the architect, 2026-11-12). Routing stays on paper,
handed to spike-model-gateway as requirements. Lists spike-model-engines in repos to change its
`host/` presets by pull request. Decides the layout v1.ai.hosting specifies. Its evidence and path
are in the spike's `context/README.md`.
'''
# Inputs to sizing set A's slots, from spike-ai-pipeline-processing's findings:
# - Vision (documents finding, the architect): gemma-4-26B-A4B's image-token budget on gb10-2, the
#   model's default --image-max-tokens, is about 477 tokens a page; image tokens follow an image's
