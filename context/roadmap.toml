summary = '''
The go-messaging infrastructure library with NATS as the declared provider, and the layer that
makes the service's internal/reactors real: reactor services on the event-driven interface
messaging enables, fleshed out as first-class architecture alongside the domain layer. Built on
a CloudEvents envelope, outbox emission, and a source-agnostic reactor contract, with go-core
gaining the `reactor` and `event` primitives. experiment.messaging settles it, and its intake
writes this goal's library and service tasks.
'''
context = ["standards-lab/context/messaging.md"]

[goals.v1.data]
name = "Data composition and CQRS"
summary = '''
A composed data model over plain SQL and a CQRS-oriented interface, spanning go-database,
go-web-sdk, and the service's domain packages. The organization domain runs on authored SQL;
the remaining domains build once the integration standards they enhance exist: the web SDK's
handler contract, observability, and messaging's event and reactor infrastructure. Sequenced
ahead of auth by design, to prove out how the domain layer scales before auth constrains it;
each domain adopts the auth contract (`standards-lab/context/auth-strategy.md`) in a sweep task of its own once
go-auth lands. The domain design direction — the four domains, their invariants, and the CQRS
contract — lives in the linked note.
'''
context = ["go-web-service/context/data-layer.md"]

