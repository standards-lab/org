[goals.v1.auth]
name = "Auth and ABAC"
summary = '''
The go-auth infrastructure library with Keycloak as the declared provider (standard tier:
OAuth 2.0, OIDC, JWT); identity linking on the person anchor; verb-keyed attribute-based
access control over the composed model. Unit-scoped grants trigger the organization-lineage
materialization decision. On record from the retrospective: the seams the service lacks — an
infrastructure-backed middleware home, a request-identity carrier, an authorization predicate
on the single-row query path, and additive DI — detailed in the linked findings note.
'''
context = [
  "go-web-service/context/concepts/identity-linking.md",
  "go-web-service/context/concepts/organization-lineage.md",
  "go-web-service/context/concepts/retrospective-findings.md",
