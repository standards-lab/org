[goals.v1.messaging.tasks.event-coverage]
name = "Event coverage"
repos = ["go-database", "go-web-service"]
summary = '''
Every public command that changes state emits exactly one event, in the transaction that makes
it true: organization Create, Edit, Transfer, Delete, PutLogo, and DeleteLogo; document
CreateDirectory, DeleteDirectory, DeleteBranch, MoveDirectory, DeleteFile, and MoveFile, beside
the upload. Types follow `<service>.<domain>.<operation>` for an operation on the domain itself
and `<service>.<domain>.<element>.<operation>` for one on a sub-element. Data is the entity's
stored state after the command. Every seed write emits its command's event. The database admin's
state reset emits one `web-service.database.reset` through a reset hook that go-database's admin
service gains (go-database v0.9.0, released first), and schema verbs emit nothing. The file
delete and the seeds' ensure write are staged in the service with hooks, bound for blobfs.
'''
context = ["standards-lab/context/messaging.md"]

[goals.v1.messaging.tasks.blobfs-write-protocol]
name = "blobfs write and delete protocols with hooks"
repos = ["blobfs", "go-web-service"]
summary = '''
blobfs promotes the protocols go-web-service staged in its `sdk` package: the two-phase write
with a hook in its completion's transaction, its retry-safe ensure form, and the two-phase
delete with a hook in its first transaction, with no messaging dependency. The service moves
onto blobfs's protocols and deletes its staging. Released.
'''
context = ["standards-lab/context/messaging.md"]

[goals.v1.messaging.tasks.sweeper]
name = "The general sweeper"
repos = ["go-database", "blobfs", "go-web-service"]
summary = '''
Outbox and inbox retention builds the general sweeper, under its binding activation rule: the
first layer that needs sweeper-like reclamation builds it, never a second standalone reactor. A
data-oriented garbage collector, a level-triggered reconciler whose durable state lives with the
data owner, behind a `Reclaimer` contract, `Pass(ctx, budget) (more bool, err error)`, that is
idempotent, convergent, and bounded; registered by name with a policy; claimed across replicas
with `SKIP LOCKED` or an advisory lock; reporting backlog metrics, not readiness; run as a
reactor. Outbox and inbox retention are reclaimers, and blobfs's `Sweep` moves onto it. Its home
is settled at this task's plan, likely go-database. blobfs's orphan reconciler stays deferred:
this task re-points its trigger in blobfs `context/deferred.md` to an orphan observed, or a
consumer storing at volume, once the general sweeper exists.
'''
context = ["go-web-service/context/data-layer.md"]

