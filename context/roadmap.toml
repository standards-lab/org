[goals.v1.client]
name = "The web client"
summary = '''
The stack beyond the terminal, by the strategy in `standards-lab/context/web-client.md`: the
foundation, components, and apps layers (consumer order: foundation, components, app), the
repositories' Pages sites and the coordinator's persistent artifacts, and
a reference client embedded in go-web-service and served by its binary, in parity with the
service as slab is on the command line. The reference client first demonstrates the
organizations, the document hierarchy, and a live view of go-web-service's reactors over the
WebSocket bridge, against the open API; v1.auth's client sweep puts it behind authentication.
Starts once the experiment.html intake closes, as the next goal in the exclusive group; the
intake decides what it builds from the six spikes' answers, and its
own planning writes its tasks. Its sites work repoints `architecture/context/README.md`, which
names docs-site as the owner of site hosting. Recorded inputs: the organization logo's fallback
(v1.storage); NATS-native chat as a candidate transport (`standards-lab/context/messaging.md`);
and `NewClient`, proven in spike-html-apps' `sdk` package. `NewClient(dist fs.FS,
ClientOptions{Base, Title, Entry, RenderBlocking, Config})` reads Vite's manifest once;
RenderBlocking lists the manifest keys whose modules the shell loads with `blocking="render"`
ahead of the entry. At the root it is the router's not-found handler, so it answers only what no
module or native route claims; under a prefix it is a handler module, and the bare prefix
redirects (301) to prefix/. A path under the manifest's directories, a dotfile path, or a last
segment with an extension, with no file behind it, is a 404 problem, never the shell. It moves
to go-web-service's `sdk/`, then go-web-sdk.
'''
context = ["standards-lab/context/web-client.md", "standards-lab/context/html-artifacts.md"]

