# Roadmap — the workspace's path to its target end state, holding only what remains.
# Maintained by the marathon-roadmap extension; the format is the plugin's
# references/manifest.md.

# The v1 order. context-migration aligns the workspace with marathon first, alone. Then one wave:
# the storage lane (blobfs build and admin, then v1.storage's service and suite, in order) runs
# beside the planning and experiment setup for v1.messaging and v1.ai, whose experiments then run
# in their own repositories. blobfs is its own repository rather than a v1 layer, the standing
# slab and sqlate have, so its tasks sit in `next` directly; v1.storage's demonstration layer
# needs it (`standards-lab/context/blobfs.md`). The infrastructure libraries come before the
# data layer, and the data layer before auth by design: the architect wants to see how the domain
# layer scales before auth constrains it, and each domain adopts the auth contract in a sweep
# task of its own once go-auth lands (`standards-lab/context/auth-strategy.md`). Auth and its
# consumer, the admin listener, close the integration standards; the client and deployment layers
# finish v1. Middleware is last: CORS waits for v1.client, and real client IP and compression stay
# in the backlog until their triggers fire. A goal cited late reads as what remains of it.
next = [
  "v1.harness.context-migration",
  [
    ["blobfs.build", "blobfs.admin", "v1.storage.service", "v1.storage.suite"],
    "v1.messaging.experiment",
    "v1.ai.experiment",
  ],
  "v1.messaging",
  "v1.ai",
  "v1.data",
  "v1.auth",
  "v1.admin-listener",
  "v1.client",
  "v1.deployment",
  "v1.repository-docs",
  "v1.middleware",
]

