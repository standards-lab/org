# ── The capstone ───────────────────────────────────────────────────────────────────────────

[goals.capstone]
name = "Capstones"
summary = '''
Applications that bring the workspace's libraries together end to end, each a `capstone.<slug>`
in its own JaimeStill repository at ~/capstones/<slug> (`naming.md`, "Capstones").
'''

[goals.capstone.data-intelligence]
name = "data-intelligence"
root = "data-intelligence"
repos = ["data-intelligence"]
remote = "https://github.com/JaimeStill/data-intelligence.git"
path = "~/capstones/data-intelligence"
summary = '''
Liberates data held in binary files on a file share: a backend on go-ai's model client and
processing layer and a web UI on the promoted web client stack that take in messages, uploads,
and streams; capture metadata, extract by inference, and store embeddings in PostgreSQL with
pgvector for semantic search, each stage transactional; and show each stage as it runs. Carries
spike-ai-pipeline's evidence 7, 8, 10, and 15 (`data-intelligence.md`). Runs in wave D as the sole
active goal apart from status-reports and training, after experiment.ai's, experiment.hosting's,
and experiment.html's intakes and the libraries they promote; its repos gain those libraries at
staging, so a capstone task can update a library and use the change. Its repository is created
at staging. experiment.graph's spike-graph is a prerequisite: its composition root is written
against the graph and lifecycle API that experiment.graph's intake settles and graph-ergonomics
ships. Design tasks come first; build tasks are written once they close.
'''
context = ["standards-lab/context/data-intelligence.md"]

