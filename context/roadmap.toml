[goals.v1.ai.hosting.tasks.design]
name = "Design review of the hosting stack"
summary = '''
Opens with Fable 5.2 evaluations of the three promoted artifacts, against the full architecture
standards, the workspace, and `ai-hosting.md`: spike-model-engines' `host/` at 6ce3210 (the
engines suite and each host class's vLLM rows), spike-model-gateway at 2f2e8c1 (the gateway's
compose stack and `docs/gateway.md`'s requirements), and spike-model-hosting's `profile` package
at aac0764 (the host-class profile schema, its validator and renderer). Settles each finding with
the architect, one review round per evaluation, and writes ai-hosting's design note: the
repository's layout, which parts each task takes from which spike, and the gateway's open points
(the `gateway` task's comments). Settles the repository's name (`ai-hosting.md`, "Open for
v1.ai.hosting's design"). No code.
'''

[goals.v1.ai.hosting.tasks.hosts]
name = "The hosts on ai-hosting"
summary = '''
Each host class's vLLM rows with their install, update, and uninstall, the Tailscale bind and CDI
fixes, a check for a stranded container, and a runbook per host class, which documents the
Framework's LUKS unlock; then moves every host off its spike clone onto ai-hosting.
'''
# From spike-ai-pipeline's host/ and experiment.hosting: a container that publishes a port on the
# host's Tailscale address races Tailscale at boot and is stranded with no published port. Every
# host sets `net.ipv4.ip_nonlocal_bind = 1` (`ai-hosting.md`, "The hosts"); the update script can
# also detect a running container with no published port (or no network) and print the fix,
# `docker network connect bridge <container>`, instead of waiting out its health check.
#
# From experiment.hosting's intake notes:
# - The Framework's LUKS unlock: its root is LUKS-encrypted, so it returns from a reboot only after
#   a person enters the passphrase at its console, and it can't be rebooted remotely or unattended
#   as the GB10s can. How it unlocks is the architect's security decision: TPM2 enrollment or a
#   keyfile (no person), or SSH in the initramfs (remote) (spike-model-layout
#   `docs/findings/vllm-layout.md`, I.4 and N.3).
# - The Framework's GTT and memory floors: the GTT ceiling is 112 GiB (`ttm.pages_limit`
#   29,360,128, set by spike-model-engines' setup); vllm-layout removed the deprecated amdgpu
#   `gttsize` option and kept `ttm.pages_limit` alone. The BIOS VRAM carve-out is 512 MiB. The
#   system's 12.5 GiB floor binds before GTT's (capability-vllm, at 0.81 of GTT). The Framework
#   stays on Omarchy with Hyprland by the architect's choice, after weighing headless Ubuntu Server.
# - Each host's model store holds only the models its rows serve: gb10-1 `openai/gpt-oss-120b`,
#   gb10-2 `nvidia/Gemma-4-26B-A4B-NVFP4`, and the Framework `google/gemma-4-E4B-it` and
#   `ibm-granite/granite-embedding-english-r2` (spike-model-layout `docs/findings/framework.md`, A;
#   `docs/findings/vllm-layout.md`, G.4 and H).
# - spike-model-engines' vLLM guides (`docs/engines/vllm/`) still describe v0.32.0 and one `vllm`
#   container on port 8000. They don't cover a row's own container, port, and image (4ad76e6),
#   `VLLM_ROCM_BUILD` and the `-rocm72` fallback, building the Framework's audio image, or the
#   Framework's ufw route rules for ports 8001 and 8002, and they list none of the standing rows
#   or their caps: `gpt-oss-120b-agent-fp8` (12) and `gpt-oss-120b-agent` (8) on gb10-1,
#   `gemma-4-26B-A4B-NVFP4-vision-gb10` (16), `gemma-4-E4B-it-audio-framework` (4), and
#   `granite-embedding-english-r2-framework` (128, 65,536 batched tokens). `api.md`'s examples send
#   the Hugging Face repository as `"model"`, while each standing row serves only its alias;
#   `models.md`, "The rows", lists the four rows with their queue limits and scheduling policy
#   (#19, 683b78e).
# - The Framework's audio image lacks torchcodec, so every audio request logs `torchcodec
#   unavailable ... falling back to soundfile/PyAV`; the image keeps that fallback
#   (spike-model-layout `docs/findings/vllm-layout.md`, L).
# - `engines vllm update` removes every official image no container was created from, so the
#   Framework's update for granite removed the staged `vllm/vllm-openai-rocm:v0.33.0-rocm72`
#   fallback's tag; its layers stay under the `-rocm72` audio image, and `docker pull` restores it
#   (spike-model-layout `docs/findings/vllm-layout.md`, B).
# - Per-row tracing: `VLLM_TRACE=on VLLM_MODEL=<row id> host/engines vllm update` adds
#   `--otlp-traces-endpoint grpc://gb10-2:4317` (`VLLM_TRACE_COLLECTOR`), `--add-host
#   gb10-2:<tailnet address>` resolved at run time, and `OTEL_SERVICE_NAME=vllm-<alias>`; the same
#   update without `VLLM_TRACE` turns it off (spike-model-engines #20). The update guide doesn't
#   document it yet. `vllm update` compares only the image and the command, so a changed collector
#   address or alias in `--add-host` or `OTEL_SERVICE_NAME` doesn't restart a traced row.
# - spike-ai-pipeline's laptop-side `mise run host-update` fails at its clone pull once the clone
#   is gone; it touches nothing first.

[goals.v1.ai.hosting.tasks.embedding]
name = "A multilingual embedding model"
summary = '''
Replaces set A's embedding model, granite-embedding-english-r2 (English-only), with a
multilingual model that both the Framework's vLLM and Azure's managed compute serve,
multilingual-e5-large first. Checks retrieval across ~/docs' languages, that docinfer's chunks
fit in 512 tokens, and that the model doesn't degrade the Framework's audio row, by running audio
alone and then beside embedding at load. A Chinese-origin candidate runs only if e5 fails, with
the reason recorded. Re-measures the embedding row, its 34 req/s limit, and the layout table.
'''
# Why granite and why it goes: granite was chosen only because vLLM couldn't serve EmbeddingGemma
# 2 on GB10 (spike-ai-pipeline `host.md`). ~/docs holds the EU act in English, Bulgarian, Greek,
# and Polish, a generated document in Arabic, Hebrew, Japanese, and Russian, mail in Cyrillic,
# Japanese, and Chinese, and audio in nine languages; its report lists "embeddings and search
# across languages" as a purpose. Azure's Hugging Face registry (Foundry managed compute) offers
# multilingual-e5-large (MIT, XLM-R base, GPU SKU), and the Chinese-origin Qwen3-Embedding-0.6B,
# bge-m3, and gte-multilingual-base; it lacks granite-embedding-278m/107m-multilingual,
# embeddinggemma-300m, and multilingual-e5-large-instruct (intake, 2026-11-19).
#
# No benchmark scenario covers embedding in spike-hosting-upgrades' `bench/`, and spike-model-
# layout's `bench/levels.jq` `client` mode stops with a jq error on an embedding result, whose
# requests carry no first-chunk time.

[goals.v1.ai.hosting.tasks.gateway]
name = "The model gateway"
summary = '''
agentgateway's compose stack on gb10-2: gateway keys, priority, budgets, embedding's rate bucket,
LGTM telemetry, and path hardening. Overflow goes to Azure for all four aliases: agent to
gpt-oss-120b, vision to gpt-5-mini, audio to gpt-audio-mini on Chat Completions (refusing a
text-only chat and audio inside a Responses request), and embedding to the `embedding` task's
model on Foundry managed compute, whose scope and price the design confirms first. Decided in its
design: the `/models` root, route `ai` or `llm`, admission on `/metrics`, a cap on bulk
concurrency, a sliding budget window, and authenticated OTLP.
