# ── Before the capstone ────────────────────────────────────────────────────────────────────

[goals.graph-ergonomics]
name = "graph and lifecycle ergonomics"
root = "go-core"
repos = [
  "go-core",
  "go-database",
  "go-observability",
  "go-storage",
  "go-web-sdk",
  "go-cli-sdk",
  "go-web-sdk-template",
  "go-cli-sdk-template",
  "go-web-service",
]
summary = '''
go-core's `graph` and `lifecycle` work, and nothing found so far says otherwise, but their API is
verbose and hard to reason about: nodes are string-keyed, and the define functions make it hard
to see how a node is constructed and which layer it lands in. This goal improves their ergonomics
and developer experience, not their behavior, starting with a design review. It runs in wave A,
while the exclusive group is free, and closes before v1.ai and v1.client build go-ai and the
client SDK on that API (plan, 2026-11-09). The composition-root principle
(`composition-terms.md`) keeps the breaks inside composition roots, their fixtures, and the SDKs
that run a graph; its repos are the nine that import either package. The spike-ai-pipeline
repositories import them too, and are read, never changed.
'''

