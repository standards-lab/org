`slab`, a cobra-based CLI in its own `go-web-service/tools/slab` module: narrated scenarios that
drive the real running composition for briefing and exploration (sqlate's compile pipeline
in-process, the organization domain's full CRUD, the service's RFC 9457 problem-response
contract), and direct subcommands mapping the service's own domains (`admin`, `org`) for
scripting against the running service without curl. Not a v1 layer; the architect's own
