summary = '''
The go-messaging infrastructure library with NATS as the declared provider, and the layer that
makes the service's internal/reactors real: reactor services on the event-driven interface
messaging enables, fleshed out as first-class architecture alongside the domain layer. Built on
a CloudEvents envelope, outbox emission, inbox idempotency, and a source-agnostic reactor
contract, with go-core gaining the `reactor` and `event` primitives, as spike-messaging proved
(archived). go-messaging was created by this goal's first `plan`, which added it to the
workspace order, the exclusive group, and the catalog.
'''
context = ["standards-lab/context/messaging.md"]

[goals.v1.messaging.tasks.core-reactor]
name = "go-core reactor"
repos = ["go-core", "go-messaging"]
summary = '''
go-core gains a `reactor` package on the standard library alone, and releases v0.9.0. It ports
go-web-service's `sdk.Reactor` and `sdk.Gate` unchanged in behavior: the source contract,
`Draining(ctx)`, `Grace`, the `Every` (schedule) and `Wake`/`Waker` (demand, interval as
backstop) sources, and `Gate`, the context-aware readers-writer quiesce gate that prefers its
exclusive side, as `reactor.Gate` (`sync.RWMutex` can't honor a context, and `x/sync/semaphore`
breaks go-core's standard-library-only line). It adds spike-messaging's `GraceWithin(drain)`, half
the drain timeout; the spike's reactor had neither `Draining` nor `Wake`. `reactor` imports
neither `lifecycle` nor `graph`, and `lifecycle` gains nothing: under go-core v0.8.0 a Reactor is
a `Subsystem`, a `ReadyStarter`, and `Monitored`, so the Coordinator starts it, drains it, checks
it, and watches it with no registration. go-core's context capability map is brought current: seven
packages, and a lifecycle that runs the graph's layers rather than stages. go-messaging is in
`repos` only for the goal record.
'''
proof = '''
A Reactor as a graph node's value is started, drained, checked, and monitored by
lifecycle.Coordinator with no registration; Gate's waiting Exclusive bars new Shared holders;
reactor imports only the standard library; go-core v0.9.0 is tagged.
'''
context = ["standards-lab/context/messaging.md"]

