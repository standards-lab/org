# Roadmap — the workspace's path to its target end state, holding only what remains.
# Maintained by the marathon-roadmap extension; the format is the plugin's
# references/manifest.md.

# The v1 execution sequence, settled 2026-09-07: the workspace context brought into
# alignment first, then the harness, then the integration standards in dependency order
# (the auth strategy before any layer that builds to it), and the domains once the layers
# they enhance exist. A goal cited late reads as what remains of it.
next = [
  "v1.harness.marathon-updates",
  "v1.web",
  "v1.observability",
  "v1.storage",
  "v1.auth",
  "v1.admin-listener",
  "v1.messaging",
  "v1.data",
  "v1.ai",
  "v1.client",
  "v1.deployment",
  "v1.repository-docs",
]

# ── v1 ─────────────────────────────────────────────────────────────────────────────────────

[goals.v1]
name = "The reference architecture at v1.0"
summary = '''
go-web-service reaches v1.0.0 as a holistic enterprise reference: every capability layer a
production web service reasonably encounters, complete in the running composition, each layer
built holistically — proving the architecture end to end and feeding the SDK,
infrastructure-library, and template features that emerge from it.
'''
criteria = [
  "Every capability goal beneath this one is closed: code, tests, and the layer's documentation in its repository (README, package documentation, and the docs/ guide of v1.repository-docs) complete; the standard tier used throughout with native use contained and entered in the port list; the capability's provider-swap class declared; and the promotion evaluation recorded — what moved outward into the SDKs, the libraries, and the template, and what stayed the service's own.",
  "A layer goal closes once its extracted record has produced the library, the template element, and the repository documentation, wherever the layer was proven (ruled 2026-09-07, standards-lab/context/concepts/marathon-extraction.md). v1.0 keeps the running composition: a layer proven outside go-web-service is adopted by the service in a sweep task of its own before this goal closes.",
  "The import-boundary lint is in place, and the service's README names each capability the service consumes, its class, and the port list.",
  "The service is versionless until 1.0: minor releases cut as layers complete in whatever order they land, v1.0.0 when this goal's tree is empty; -dev.N prerelease tags serve only the cross-module-resolution case the release-and-ci principle states, never routine between-session practice. Each release is a coherent snapshot with its pins; a library change and the service change that proves it release together; a member release prompts the coordinator sweep.",
]
context = ["standards-lab/context/design/service-organization.md"]

[goals.v1.tasks.repository-docs]
name = "Repository documentation"
repos = ["go-core", "sqlate", "go-database", "go-web-sdk", "go-web-sdk-template", "go-web-service"]
summary = '''
Each Go repository's docs/ guide, indexed by its README, written once the layers stop
churning: the accessibility layer over the README, the package documentation, and the source,
in the shape sqlate's guide established (concepts by example, a quick start, the features by
package, a glossary). Sequenced last so no layer's guide is revised while the roadmap still
changes it; sqlate's guide exists and is verified rather than written.
'''
context = ["standards-lab/context/design/architecture-layer.md"]

[goals.v1.harness]
name = "The harness at v1"
summary = '''
The claude-plugins harness, kept current as the v1 build proves out what it needs. The
hardening pass closed: marathon v0.11.0 carries the plan-stage sufficiency question,
delegation to an agent a project declares, and a stage's check running the repository's own
tooling — the mechanism sqlint's guarded-statement check (sqlint/v0.1.1) now runs through
rather than the harness restating it (tooling principles 1 and 8). What remains is the
situational-awareness, extraction, references, and deterministic-tooling work the backlog
held, adopted here as this goal's own tasks; none is yet in `next`.
'''
context = ["standards-lab/context/concepts/tooling-principles.md"]

[goals.v1.harness.tasks.sitrep]
name = "The marathon-sitrep extension"
repos = ["claude-plugins", "standards-lab"]
summary = '''
Waits until the architect calls for it. The organization's situational-awareness tool:
enterprise-wide awareness of progress on engineering efforts, published to a GitHub Pages dev
blog. Two entry categories to start: the sitrep, an update at a set interval for a project or
workspace, drafted from marathon's own record (the reset file, the roadmap deltas, the commit
history, and the pull-request descriptions) and calibrated by a style profile; and the brief,
orientation for leadership framed per audience, into which the coordinator's briefs/ and
interview.md transition. Further categories wait for a need. The blog scaffold and publish
mechanics belong to a dev-blog skill (the capture, draft, publish pipeline the TAU dev blog
established) that the extension calls rather than re-encodes; the extension owns reading the
workspace and drafting. First member of the enhancement facet of the extension taxonomy; the
taxonomy amendment lands with it if it ships before extraction.
'''
context = [
  "claude-plugins/context/concepts/marathon-sitrep.md",
  "standards-lab/context/concepts/tooling-principles.md",
]

