# Roadmap: the workspace's path to its target end state, holding only what remains. The format is
# marathon's references/manifest.md, and each active goal's record is context/goals/<goal>.md in
# its root repository.
#
# The workspace's exclusive group (.claude/marathon.toml) lets one active goal at a time touch
# the reference-architecture code repositories. No active goal holds it: v1.client, the next goal
# in the group, is proposed, not staged, and waits on the experiment.html intake closing
# (standards-lab/context/web-client.md). Outside the exclusive group,
# experiment.hosting's spike-model-hosting, spike-model-engines, and spike-hosting-upgrades have
# answered (ai-hosting.md, "Answers · experiment.hosting"), and spike-model-layout is active;
# gateway and host-admin follow one at a time. experiment.ai.spike-ai-pipeline is active beside them for its
# host, client, and processing tasks (ai-strategy.md, "Experiment: spike-ai-pipeline"); it returns to
# `planned` until its capstone's gates clear. gb10-2 is reserved for it, so experiment.hosting
# runs on gb10-1 and the Framework (ai-hosting.md, "Hosts and access"). experiment.ai's harness
# spikes wait for
# experiment.hosting's intake. The infrastructure libraries come before the data layer, and the data layer before auth by
# design: the architect wants to see how the domain layer scales before auth constrains it.
# experiment.html runs beside the active goals, outside the exclusive group: its spikes lock only
# their own repositories and run one at a time, in the order `planned` lists them.
# spike-html-design, spike-html-conventions, spike-html-packages, and spike-html-apps have
# answered (html-artifacts.md, "Answers · experiment.html"), and spike-html-hosting is active.
# Middleware is last; CORS's trigger, a client served cross-origin, fired in spike-html-apps.

active = [
  "experiment.hosting.spike-model-layout",
  "experiment.html.spike-html-hosting",
  "experiment.ai.spike-ai-pipeline",
]

planned = [
