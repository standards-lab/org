spike-model-engines' host/ first gives each row its own container name, port and memory fraction
under the floor. Measures the Framework's vLLM load time. Evidence 3 and 5, beside 6.
'''
# Why (spike-model-layout docs/findings): agent-vllm found vLLM the stronger agent engine on gb10-1,
# meeting the ITL floor through 8 sessions (BF16 KV) and 12 (FP8 KV) against llama.cpp's 4, with
# TTFT 0.57 s against 2.26 s at the load target (agent-vllm.md, F). role-split found llama.cpp
# encodes images one slot at a time, and vision and audio missing their floors together on one GPU
# (role-split.md, L.1, N; framework.md, F, J, L.1).
# Notes it carries:
# - The suite runs one `vllm` container on port 8000, at --gpu-memory-utilization 0.80, and
#   refuses beside llama. Three processes per host need per-row container names, ports and memory
#   fractions under the floor: a host/ change by pull request.
# - The weights differ by host class. NVFP4 is CUDA-only, and Google publishes no 26B-A4B w4a16.
#   The 26B-A4B options are nvidia/Gemma-4-26B-A4B-NVFP4, RedHatAI FP8-dynamic and BF16; E4B is
#   BF16 or google qat-w4a16-ct; granite is BF16. The quantization floor and model-origin rules
#   apply.
# - At v0.32.0 the official ROCm image shipped no audio decoder, and the audio-extra probe image
#   (host/vllm-rocm-audio, pinned to v0.32.0's digest) covered it (spike-model-engines
#   context/README.md:287-288). v0.33.0's default ROCm image is ROCm 10.0, with `-rocm72` beside
#   it, so audio needs a fresh check.
# - On ROCm v0.32.0, vLLM trailed llama.cpp on every generative cell (22-88%) and led embeddings
#   (215.3 against 40.5 req/s) (spike-model-engines vllm-strix.md).
# - Loading: #58868, the GB10 weight-loading fix, is in v0.34.0rc0 and not v0.33.0, and doesn't
#   reach ROCm, since only vLLM's CUDA platform implements is_integrated_gpu (agent-vllm.md, C, N).
#   #49991, its ROCm counterpart (VLLM_ROCM_CLONE_MMAP_WEIGHTS), is open and stalled. No upstream
#   issue targets vLLM startup on gfx1151. This spike hasn't measured the Framework's vLLM load
#   time.
# - The agent row's cold start is remeasured on v0.34.0 once it is final, in vllm-layout.
# The architect's preferences, from agent-vllm: for the agent, a longer cold start is accepted for
# better concurrency and overall performance, and vLLM is the more attractive engine, chiefly for
# its concurrency. FP8 KV runs uncalibrated at scale 1.0; an accuracy check against BF16 would
# settle the agent row. It is a new tool, and vllm-layout takes it as its one new tool.

