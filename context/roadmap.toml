[goals.v1.auth]
name = "Auth and authorization"
summary = '''
The go-auth infrastructure library with Keycloak as the declared provider (standard tier:
OAuth 2.0, OIDC, JWT); the subject anchor, the relationship-derived authorization model, and
the composition-root seams every domain builds against are settled in the linked strategy
record. The admin listener (v1.admin-listener) is a consumer of the authentication this goal
settles. What remains is the build: go-auth itself, the schema it introduces, and the
composition-root reshape in go-web-service.
'''
context = [
  "standards-lab/context/design/auth-strategy.md",
  "go-web-service/context/concepts/identity-linking.md",
  "go-web-service/context/concepts/organization-lineage.md",
]

[goals.v1.web]
name = "The web SDK's handler contract"
summary = '''
The SDK completes what the adapter decision opened: error-returning handlers, a whole-response
problem story, and the middleware set — the stdlib handler signature staying the primary
contract throughout.
'''

[goals.v1.web.tasks.adapter]
name = "The adapter's remaining work"
repos = ["go-web-sdk"]
summary = '''
The adapter core landed in go-web-sdk v0.6.0 (HandleErr, the error-returning HandlerFunc
over a group-scoped ErrorWriter, IfMatch and DecodeJSON). What remains is the whole-response
problem story: the recorder exported as the shared wrapped writer and the request logger
rewritten onto it, the ErrorWriter problem vocabulary, router 404/405 hooks, the ErrorLog
bridge with MaxHeaderBytes and the swallowed encoder error, writer inheritance if a consumer
asks. The item list is the linked note; the reference service's handlers convert at
integration.service.
'''
context = ["go-web-sdk/context/concepts/error-handling.md"]

[goals.v1.web.tasks.middleware]
name = "The middleware set"
repos = ["go-web-sdk"]
summary = '''
The hand-rolled set on the shared writer and the sourced spec-surface set, per the
middleware catalog in the linked note; the recoverer/logger ordering resolved and the request
ID surfaced in the log record, shaped to OpenTelemetry's conventions so the observability
layer builds on it. Required before goals.v1.auth.
'''
context = [
  "go-web-sdk/context/concepts/middleware-sourcing.md",
  "standards-lab/context/design/dependency-sourcing.md",
]

[goals.v1.observability]
name = "Observability"
summary = '''
The go-observability infrastructure library: logs, metrics, and traces through OpenTelemetry,
the collector in the compose stack; the request logger's open questions in web answered
against OpenTelemetry's conventions. The development-side stack is the LGTM stack (Loki,
Grafana, Tempo, Mimir), run natively as a container stack in the compose project; where it
falls in the standard-versus-native split is this goal's decision. Sequenced before the
layers that follow so each instruments as it lands.
'''

[goals.v1.storage]
name = "Object storage"
summary = '''
The go-storage infrastructure library. No formal standard exists, so the organization
establishes the standard tier as the minimal operation set common to the Azure Blob and S3
APIs; the declared stack picks one provider (azurite locally); the service demonstrates it in
a documented layer.
'''

[goals.v1.admin-listener]
name = "The management listener"
summary = '''
The admin mount on its own listener, unreachable from the public API's network path,
authenticated through the auth layer, with audit logging on anything that mutates and a
confirmation token gating the destructive down, force, and state verbs; config rendering
over a go-core redaction contract; go-web-sdk's config env segment made per-block; the
composition-root reshape in go-web-service and the same reshape in go-web-sdk-template.
Posture decisions on record: whether the serving role ever holds DDL, and whether off by
default is mandated by the standard. The 2026-09-07 exploration and the touch points by
repository are the linked concept.
'''
context = [
  "standards-lab/context/concepts/admin-listener.md",
  "standards-lab/context/design/dsl-driven-services.md",
  "standards-lab/context/design/auth-strategy.md",
  "go-web-sdk/context/concepts/error-handling.md",
]

[goals.v1.messaging]
name = "Messaging and reactor services"
summary = '''
The go-messaging infrastructure library with NATS as the declared provider, and the layer that
makes the service's internal/reactors real: reactor services on the event-driven interface
messaging enables, fleshed out as first-class architecture alongside the domain layer.
'''

[goals.v1.data]
name = "Data composition and CQRS"
summary = '''
A composed data model over plain SQL and a CQRS-oriented interface, spanning go-database,
go-web-sdk, and the service's domain packages. The organization domain runs on authored SQL;
the remaining domains build once the integration standards they enhance exist: the auth
strategy's contract, the web SDK's handler contract, observability, and messaging's event and
reactor infrastructure. The domain design direction — the four domains, their invariants, and
the CQRS contract — lives in the linked note.
'''
context = ["go-web-service/context/concepts/data-layer.md"]

