takes `sdk.Gate`, the context-aware readers-writer quiesce gate that prefers its exclusive side,
as `reactor.Gate`: `sync.RWMutex` can't honor a context, and `x/sync/semaphore` breaks go-core's
standard-library-only line. `lifecycle` gains `Component` (`Start`, `Shutdown`, `Ready`),
`Monitored` (adds `Err`), and `lc.Register(name, stage, c)` on the coordinator, which adds the
component with its readiness check and monitors `Err` when the component is `Monitored`, found by
type assertion. The stage stays at the root's call site, with no `Stage` type, and the
coordinator's two error-drop windows stay as they are, since the reactor covers both
(`messaging.md`, "Lifecycle registration").
'''
