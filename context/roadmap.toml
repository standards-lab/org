# Roadmap: the workspace's path to its target end state, holding only what remains. The format is
# marathon's references/manifest.md, and each active goal's record is context/goals/<goal>.md in
# its root repository.
#
# The workspace's exclusive group (.claude/marathon.toml) lets one active goal at a time touch
# the reference-architecture code repositories. cli takes the slot next: its plan stages it and
# sets up go-cli-sdk and go-cli-sdk-template. Outside the exclusive group,
# experiment.ai.spike-model-hosting is active beside whichever goal holds the slot: its
# Framework tasks run now, its workstation tasks from 2026-10-14, and its admin task waits on
# go-cli-sdk v0.1.0. Its sync stages spike-local-models. slab takes the slot once cli
# syncs, and v1.messaging follows it, the first work on the 0.16 conventions. The
# infrastructure libraries come before the data layer, and the data layer before auth by
# design: the architect wants to see how the domain layer scales before auth constrains it.
# Middleware is last: CORS waits for v1.client.

active = ["experiment.ai.spike-model-hosting"]

planned = [
  "cli",
  "slab",
  "experiment.ai.spike-local-models",
  "v1.messaging",
  "v1.ai",
  "v1.data",
  "v1.auth",
  "v1.admin-listener",
  "v1.client",
  "v1.deployment",
  "v1.repository-docs",
  "v1.middleware",
]

backlog = [
