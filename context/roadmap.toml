[goals.experiment.ai.tasks.intake]
name = "The combined intake"
summary = '''
Run by `marathon intake experiment.ai` once spike-harness-driver, spike-model-hosting, and
spike-local-models have their answers in `ai-strategy.md`. Decides go-ai's shape and whether a
service's container carries a harness, what v1.ai.hosting builds, and both local-models
conventions from spike-local-models: v1.ai.local-models (local models for application workloads)
and v1.harness.local-models (routing Claude Code subagent tasks to local models). The
architecture-layer candidates (model tiers, context sizing, the memory-footprint method, and the
serving conventions) are decided here too, from spike-model-hosting's result. It also decides
whether personal-agents' contents and spike-model-hosting's findings move into a fresh workspace
repository. The tasks it writes run v1.ai's `hosting` task before its `local-models` task: the
hosting details are settled before the local models themselves. Its one coordinator pull request
writes those tasks and removes the experiment; it then archives spike-harness-driver,
spike-model-hosting, and spike-local-models. personal-agents is a reference, written only by
spike-model-hosting's align task, and is never archived by this intake.
'''

[goals.experiment.ai.spike-model-hosting]
name = "Hosting local models"
root = "spike-model-hosting"
# personal-agents and spike-harness-driver are here for the align task only; a plan run drops
# them once align merges.
repos = ["spike-model-hosting", "personal-agents", "spike-harness-driver"]
remote = "https://github.com/JaimeStill/spike-model-hosting.git"
path = "~/experiments/spike-model-hosting"
summary = '''
Which serving platform, configuration, and specification shape hold across both host classes
(Strix Halo with Vulkan or ROCm, Dell NVIDIA with CUDA) and all three consumers at once? It
compares llama.cpp, vLLM, and SGLang, records how each is set up and managed and what it makes
possible, and compares agentgateway and LiteLLM with no gateway. Decides the `ai-hosting`
specification: the serving platform, the host-class profile's schema, whether a gateway sits in
front of the serving, and the admin tooling's form (`ai-hosting.md`, "Experiment:
spike-model-hosting"). Reads personal-agents, spike-harness-driver, tau-examples, and
tau-protocol, and writes personal-agents and spike-harness-driver only in its align task. It
never touches the architect's laptop beyond the repository, its check,
read-only probes, and HTTP.
'''

[goals.experiment.ai.spike-model-hosting.tasks.align]
name = "The starting model pool, aligned"
summary = '''
Brings the Framework, personal-agents, spike-harness-driver, and the "clutch driving Pi" artifact
in line with the starting model pool, with no restore point. The Framework's router moves to
llama.cpp's upstream Vulkan x64 release at the newest b-number build, replacing Arch's llama-cpp
and ggml-vulkan packages and the pacman restart hook. personal-agents' tracked profile serves set
A (gpt-oss-120b MXFP4, Gemma 4 26B-A4B, gemma-4-E4B, EmbeddingGemma 2), installed with outpost,
and the measured footprint with all four loaded leaves at least 3 GiB of the 96 GiB pool free.
Qwen leaves personal-agents' tier recipes and Pi docs and spike-harness-driver's defaults, and
personal-agents no longer names the Framework's tailnet address. Both repositories document the
memory budget, and the artifact's ten Framework runs are re-captured on the aligned router.
Evidence 1.
'''

[goals.experiment.ai.spike-model-hosting.tasks.profile]
name = "The host-class profile and the Strix Halo llama.cpp profile"
summary = '''
Defines the host-class profile schema in TOML with a validator and a renderer, and the Strix
Halo profile: llama.cpp's Vulkan router at the b-number build align installed or a newer one,
pinned exactly in the profile, serving set A (gpt-oss-120b MXFP4, Gemma 4 26B-A4B, gemma-4-E4B,
EmbeddingGemma 2). The rendered presets and unit run the Framework's router, with no restore
point. Currency compares the profile's pins against the newest `b<N>` tag. Evidence 1.
'''

[goals.experiment.ai.spike-model-hosting.tasks.consumers]
name = "Pi, Claude Code, and the go-ai model client at once on the Vulkan router"
summary = '''
Installs Pi, Claude Code, and Go on the Framework and runs the three consumers there at once:
Pi over OpenAI-compatible chat, Claude Code over /v1/messages with tool use, streaming, and
thinking intact, and spike-harness-driver's `model` package (go-ai's stand-in, at a
pseudo-version) for chat and embeddings. Checks that no response crosses between concurrent
requests, and measures footprint, prompt and generation speed at one and four requests,
prefix-cache reuse, and cold load: the baseline every platform is measured against. Probes
Mistral Small 4 against gpt-oss-120b on /v1/messages and Pi tool calls, with its vision on
Vulkan, to decide whether it is promoted to the main model. Evidence 4 and 5.
'''

[goals.experiment.ai.spike-model-hosting.tasks.rocm]
name = "llama.cpp's ROCm backend against Vulkan"
summary = '''
ROCm and llama.cpp's HIP build on the Framework, rendered from the same profile with only the
backend changed, on the shared model set. Runs the consumer suite and the measurements, including
the cross-talk llama.cpp #25992 reports for `-np 4 --kv-unified` on gfx1151, and records install,
update, and management. Evidence 2 to 7.
'''

[goals.experiment.ai.spike-model-hosting.tasks.engines-strix]
name = "vLLM and SGLang on Strix Halo"
summary = '''
vLLM on gfx1151, through Lemonade's vllm:rocm bundle where that is the simpler install, and
SGLang time-boxed from its nightly gfx1151 image, each serving the shared model set in its native
format behind llama-swap, rendered from the profile. Runs the consumer suite and the
measurements, records setup and management, and fills the capability matrix. Ollama, LM Studio,
and TGI are recorded on paper. Evidence 2 to 7.
'''

[goals.experiment.ai.spike-model-hosting.tasks.gateway]
name = "Gateway approaches in front of the Framework's serving"
summary = '''
agentgateway and LiteLLM, each in front of the llama.cpp router and llama-swap, against no
gateway: fidelity for the three consumers (with the cost of
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=1), per-consumer identity, token budgets and rate limits,
OpenTelemetry traces, memory and latency, and whether the gateway's configuration lives in the
profile. Envoy AI Gateway (Agent Router) and vLLM production-stack on paper; IL6 on paper for
every platform and gateway. Evidence 8 and 10.
'''

[goals.experiment.ai.spike-model-hosting.tasks.admin]
name = "The admin tool on go-cli-sdk"
summary = '''
Needs: go-cli-sdk v0.1.0, from cli's sdk task. A CLI on go-cli-sdk that reads the host-class
profile and runs outpost's verbs (preset install, service restart and status, models, metrics,
GPU usage, hooks) for every platform kept. outpost is read as the baseline, not rebuilt.
Evidence 9.
'''

[goals.experiment.ai.spike-model-hosting.tasks.cuda]
name = "The CUDA host class"
summary = '''
Needs: the Dell NVIDIA workstation (from 2026-10-14). Gathers its specifications, writes its
CUDA profile, and runs llama.cpp's CUDA router from it on the shared model set; measures
footprint with nvidia-smi, applies context sizing to discrete VRAM, and runs the consumer suite
against it. Its candidate list adds the dense models Mistral Medium 3.5, Gemma 4 31B, and Muse
Glimmer 30B. Evidence 2, 5, and 7.
'''

[goals.experiment.ai.spike-model-hosting.tasks.engines-cuda]
name = "vLLM and SGLang on CUDA"
summary = '''
Needs: the Dell NVIDIA workstation (from 2026-10-14). vLLM and SGLang on CUDA behind llama-swap,
rendered from the profile, with the consumer suite and the measurements; the gateway
configurations and the admin tool rerun unchanged against the workstation. Evidence 2 to 9.
'''

[goals.experiment.ai.spike-model-hosting.tasks.validate]
name = "Validate and answer"
summary = '''
Runs evidence 1 to 10 on both hosts end to end, writes the platform comparison and "The answer"
