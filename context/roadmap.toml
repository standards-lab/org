# Roadmap: the workspace's path to its target end state, holding only what remains. The format is
# marathon's references/manifest.md, and each active goal's record is context/goals/<goal>.md in
# its root repository.
#
# The workspace's exclusive group (.claude/marathon.toml) lets one active goal at a time touch
# the reference-architecture code repositories; it is free since api-maintenance synced
# (2026-11-12). v1.client.stack holds it only for its `newclient` task, the one that locks
# go-web-sdk. Outside the group, experiment.hosting's intake (2026-11-19) settled the self-hosted
# stack on vLLM and agentgateway (ai-hosting.md) and made v1.ai.hosting active; its next session
# is `marathon plan v1.ai.hosting`, which creates ai-hosting.
# experiment.html's intake (2026-11-18) split v1.client into v1.client.stack, before the
# capstone, and v1.client.reference, after it (web-client.md), and moved status-reports and
# training under sites (sites.md). graph-ergonomics shipped its API in go-core v0.11.0
# (graph-ergonomics.md, "The settled API") and moved every consumer onto it: the libraries,
# go-cli-sdk, both templates, and go-web-service with slab. api-maintenance then converted every
# exported library API to construction-and-execution (go-core v0.12.0 and every tier above it)
# and moved the templates, go-web-service, and slab onto the converted releases.
# The infrastructure libraries come before the data layer, and the data layer before auth by
# design: the architect wants to see how the domain layer scales before auth constrains it.
# Middleware is the last v1 goal; CORS's trigger, a client served cross-origin, fired in
# spike-html-apps. sites is planned last of all.
#
# The path to the capstone, capstone.data-intelligence (plan, 2026-11-09): (a) finish the
# pre-capstone experiments; (b) take them in and build out the libraries and infrastructure the
# capstone needs, each library promoted into ~/architecture opened by a design review (against
# the full architecture standards and the workspace) and closed by an acceptance task that reruns
# the real workloads; (c) design the capstone's protocols and practices, its first tasks; (d)
# build the capstone; (e) continue the roadmap. The waves, each running its goals side by side:
# - A (done): spike-model-layout and spike-html-hosting answered; spike-ai-pipeline's `answer`,
#   graph-ergonomics with spike-graph, experiment.ai's and experiment.graph's intakes,
#   graph-ergonomics' release and per-tier migrations, and api-maintenance shipped.
# - B: spike-model-gateway and experiment.hosting's intake are done; v1.ai.hosting is active,
#   building ai-hosting before the capstone. v1.ai.processing (docproc and its system tools,
#   absorbing v1.ai.tools) runs beside it, ahead of wave C; v1.ai.hosting shares the architecture
#   lock with it and harness.optimization, and the architect frees the lock before v1.ai.hosting's
#   `architecture` task merges. v1.ai.client (go-ai) has finished, releasing go-ai v0.3.0.
#   v1.ai.inference (docinfer) is active after it (plan, 2026-11-18). v1.client.stack is active
#   (plan, 2026-11-18, rooted in web-foundation); its `foundation` task has shipped, so
#   sites.status-reports and sites.training.foundation can start.
# - C: v1.ai's remaining sub-goals beside the rest of v1.client.stack. go-ai and docproc stay
#   outside the exclusive group until C ends; then they join it. Then v1.data.extensions, the
#   Postgres-extension strategy.
# - D: capstone.data-intelligence, the sole active goal apart from sites.status-reports and
#   sites.training; it holds the libraries it may change, so a capstone task can fix a library and
#   use the fix.
# - E: v1.client.reference first; experiment.ocr, experiment.admin, and experiment.harness; then
#   v1.data, v1.auth, v1.admin-listener, v1.deployment, v1.repository-docs, and v1.middleware; and
#   sites last. sites.training units that lock libraries run where the exclusive group is free.
#
# The line at the capstone:
# - Before it: all of v1.client.stack, the web standard included; sites.status-reports' layout
#   and first report, a backfill of ~/architecture as it stands at the capstone's start; and
#   sites.training.foundation's setup and syllabus.
# - During it (wave D): sites.status-reports' second report, an orientation to the capstone, and
#   sites.training.foundation's writing tasks.
# - After it: v1.client.reference, v1.repository-docs, foundation-extension, client-create, and
#   the rest of sites, last.

