remote = "https://github.com/standards-lab/org.git"

[repos.github-private]
remote = "https://github.com/standards-lab/.github-private.git"

[repos.github-public]
remote = "https://github.com/standards-lab/.github.git"

[repos.go-core]
remote = "https://github.com/standards-lab/go-core.git"
standard = "go-elemental"

[repos.go-database]
remote = "https://github.com/standards-lab/go-database.git"
standard = "go-elemental"

[repos.go-web-sdk]
remote = "https://github.com/standards-lab/go-web-sdk.git"
