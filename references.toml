[repos.go-web-sdk-template]
remote = "https://github.com/standards-lab/go-web-sdk-template.git"
standard = "go-elemental"

[repos.go-web-service]
remote = "https://github.com/standards-lab/go-web-service.git"
standard = "go-elemental"

# sqlate is adjacent to the standard, not a member: a standalone library the
# standard's libraries consume, so its entry declares no standard.
[repos.sqlate]
remote = "https://github.com/standards-lab/sqlate.git"

