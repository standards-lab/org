# Repository references — authoritative remote identity.
#
# Each key maps to the canonical remote for one repository. references.local.toml
# (not committed) maps the same key to its directory on this machine. The key is
# the join: to clone a missing repo, look up its remote here and its target
# directory in references.local.toml. references.md describes what each key is.
#
# A private annex in the private repository (checked out at private/) extends this
# catalog with the prior R&D that cannot be catalogued publicly; the layering rule
# is context/design/repo-references.md.

# Standards — named standards that sets of repositories align to. Each
# [standards.<key>] entry declares one; a member repository's [repos.<key>] entry
# declares standard = "<key>". A standard derived from another declares
# derives = "<key>", and architecture names the architecture the standard
# implements. The definition itself lives in the docs landing zone at the
# definition URL; the declaration mechanics are context/design/standards.md.
[standards.go-elemental]
description = "The Go implementation of the Elemental Architecture: a complete reference architecture on the standard library"
architecture = "elemental-architecture"
definition = "https://github.com/standards-lab/docs/blob/main/standards/go-elemental/index.md"

# Effort repositories — the standards-lab organization.
[repos.claude-plugins]
