# Project kind: this repository is context (profiles, references, working context),
# not production source code.
[project]
kind = "context"

# Workspace coordinator: standards-lab is the org-context project for the
# reference-architecture workspace (~/architecture/). It declares the dependency
# order a cross-repo step flows through, lowest first. The order is the
# machine-readable dependency graph of the repositories the references
# catalog (references.md) lists.
[workspace]
role = "coordinator"
# Marathon extensions enabled for every project in the workspace. marathon-roadmap
# maintains context/roadmap.toml here at the coordinator as the workspace's roadmap.
extensions = ["marathon-roadmap"]
order = [
  "claude-plugins", # harness
  [
    "go-core", # core SDK
    "sqlate",  # SQL templating library, adjacent to the standard
  ],
  [
    "go-database", # infrastructure service SDK
    "go-web-sdk",  # web service application SDK
  ],
  "go-web-sdk-template", # web service application template
  "go-web-service", # reference web service
  "architecture", # the architecture repository
]
architecture = "architecture" # the workspace's architecture repository

# The agents every project in the workspace may delegate a unit of work to
# (behavior/delegation.md), resolved key by key against a project's own [agents] table. fable
# and opus are the architect's personal agents (~/.claude/agents/), engaged per the standing
# model-routing convention; a session names one and why before engaging it.
[workspace.agents.fable]
delegation = '''
Technical delegate for one stage's implementation or one design decision: a unit of work
technically complex enough that working it out directly would cost more than briefing this
agent to do it, handed over with full context. Not for documentation, commit messages, or
context notes — the session drafts and finishes those itself.
'''

[workspace.agents.opus]
delegation = '''
Escalation delegate for a high-stakes, hard-to-reverse decision: wide blast radius across the
project or workspace, or more context than the step itself needs held at once to reason
through. Not for implementation or routine technical work — fable is for that. Reach for this
only when getting the call right matters more than speed or cost.
'''

# Remote platform and the command that publishes a finished branch.
# All three repositories rooted in this directory (org here, .github under public/,
# .github-private under private/) are on GitHub and publish the same way; git routes
# each commit to its remote by working tree.
[remote]
platform = "github"
publish = "gh pr create"
