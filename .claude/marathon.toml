# Project kind: this repository is context (profiles, references, working context),
# not production source code.
[project]
kind = "context"
check = "lint-context"

# Workspace coordinator: standards-lab is the org-context project for the
# reference-architecture workspace (~/architecture/). It declares the dependency
# order, lowest first, in which a cross-repo task changes repositories. The order is the
# machine-readable dependency graph of the repositories the references
# catalog (references.md) lists.
[workspace]
role = "coordinator"
# Marathon extensions enabled for every project in the workspace. marathon-architecture
# finds the architecture layer each STANDARDS.md points to, named in its own
# .claude/marathon-architecture.toml beside this file.
extensions = ["marathon-architecture"]
# Workspace policy: at most one active goal touches the reference-architecture code
# repositories at a time. Spikes and the harness run beside it, and so do the web client
# repositories (web-tooling through webappgen), which stay outside the group.
exclusive = [
  [
    "go-core",
    "sqlate",
    "go-database",
    "go-web-sdk",
    "go-observability",
    "go-storage",
    "go-messaging",
    "blobfs",
    "go-cli-sdk",
    "go-web-sdk-template",
    "go-cli-sdk-template",
    "go-web-service",
  ],
]
order = [
  [
    "claude-plugins", # harness
    "ai-hosting",     # model hosting: hosts, vLLM rows, and the gateway; low-level infrastructure
  ],
  [
    "go-core", # core SDK
    "sqlate",  # SQL templating library, adjacent to the standard
    "docproc",  # processing library and its system tools, adjacent to the standard
  ],
  [
    "go-database",      # infrastructure service SDK
    "go-web-sdk",       # web service application SDK
    "go-observability", # observability infrastructure library
    "go-storage",       # object storage infrastructure library
    "go-ai",            # model client infrastructure library; joins `exclusive` after wave C
    "go-messaging",     # messaging infrastructure library
    "blobfs",           # virtual-directory metadata library, adjacent to the standard
    "go-cli-sdk",       # CLI application SDK
  ],
  [
    "go-web-sdk-template", # web service application template
    "go-cli-sdk-template", # CLI application template
    "docinfer",            # inference library above go-ai's tier, adjacent to the standard; joins `exclusive` after wave C
  ],
  "web-tooling",    # browser-test and screenshot tooling
  "web-foundation", # native CSS and ES module foundation
  "web-icons",      # icons layer: Octicons as per-icon string modules and the marker fill
  [
    "web-components", # Lit components on the foundation
    "web-app-sdk",    # web application SDK on the foundation
  ],
  "webappgen",            # web client CLI: writes a project for each kind of app on the stack
  "go-web-service", # reference web service
  "architecture", # the architecture repository
]
# The locations of repositories a goal names that aren't order keys: a spike's layer
# repositories, beside the spike.
[workspace.paths]
spike-model-engines = "~/experiments/spike-model-engines"
# The capstones (naming.md, "Capstones").
capstone-data-intelligence = "~/capstones/capstone-data-intelligence"
capstone-cerebro = "~/capstones/capstone-cerebro"
capstone-athena = "~/capstones/capstone-athena"

# The hosting convention `marathon experiment` proposes for a new spike. Each spike repository
# also carries go-core's LICENSE and a `main` ruleset (context/README.md, "Experiments").
[workspace.experiments]
path = "~/experiments/spike-<slug>"
remote = "https://github.com/JaimeStill/spike-<slug>.git"

# Remote platform, the command that publishes a finished branch, and the command that
# merges it. None of the three repositories runs CI, so the merge waits on no checks
# (`gh pr checks` exits 1 when a pull request has none).
# All three repositories rooted in this directory (org here, .github under public/,
# .github-private under private/) are on GitHub and publish the same way; git routes
# each commit to its remote by working tree.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
