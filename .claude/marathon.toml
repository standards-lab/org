# marathon configuration for standards-lab, the workspace coordinator.
# See CLAUDE.md
# See context/README.md
# See context/waves.md

[project]
kind = "context"
check = "lint-context && lint-references"

[workspace]
role = "coordinator"
extensions = ["marathon-architecture"]
order = [
  [
    "claude-plugins",
    "ai-hosting",
    "docs-corpus",
  ],
  [
    "go-core",
    "sqlate",
    "docproc",
  ],
  [
    "go-database",
    "go-web-sdk",
    "go-observability",
    "go-storage",
    "go-ai",
    "go-messaging",
    "blobfs",
    "go-cli-sdk",
  ],
  [
    "go-web-sdk-template",
    "go-cli-sdk-template",
    "docinfer",
  ],
  "web-tooling",
  "web-foundation",
  "web-icons",
  [
    "web-components",
    "web-app-sdk",
  ],
  "webappgen",
  "go-web-service",
  "architecture",
]

[workspace.paths]
spike-harness-driver = "~/experiments/spike-harness-driver"
capstone-data-intelligence = "~/capstones/capstone-data-intelligence"
capstone-bunrei = "~/capstones/capstone-bunrei"
capstone-mikoshi = "~/capstones/capstone-mikoshi"

[workspace.experiments]
path = "~/experiments/spike-<slug>"
remote = "https://github.com/JaimeStill/spike-<slug>.git"

[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr merge --merge --delete-branch"
