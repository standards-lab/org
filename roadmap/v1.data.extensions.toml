name = "Postgres extensions at the native tier"
summary = '''
How a Postgres extension is declared at the native tier, as reusable infrastructure: a declarative
extensions layer in sqlate's migrator, extension-aware sqlint, one baseline image that builds each
extension from source, and per-extension sub-modules in sqlate (the SQL layer) and go-database (the
Go layer). pgvector, for capstone.data-intelligence, is the first case.
'''
repos = ["sqlate", "go-database", "architecture"]
root = "sqlate"
order = ["extension-stage", "sqlint-extensions", "pgvector-sql", "pgvector-go", "principles"]
context = ["standards-lab/context/postgres-extensions.md"]

[tasks.extension-stage]
name = "The extensions layer"
summary = '''
sqlate/migrate's extension stage ahead of every set, under the migrator's lock: declarations in
Options, reconciled to the image's default version, removal after the sets, Verify and Extensions
reporting; sqlate/postgres's standard check and activation pair; pgtest.MigratedWith.
'''
repos = ["sqlate"]

[tasks.sqlint-extensions]
name = "Extension-aware sqlint"
summary = '''
sqlint's `extensions` key: each listed module's native forms join the engine's deny list, and a
listed module exporting neither forms nor a reasoned empty list is refused.
'''
repos = ["sqlate"]

[tasks.pgvector-sql]
name = "pgvector's SQL layer"
summary = '''
The `postgres/pgvector` module (native forms, extension name, metric table), sqlate's canonical
Dockerfile building pgvector from source with its currency check, and live proof of the stage and
the per-space partial-index recipe.
'''
repos = ["sqlate"]

[tasks.pgvector-go]
name = "pgvector's Go layer"
summary = '''
go-database's `postgres/pgvector` helpers over pgvector-go, admin's extension status, and
go-database's compose stack and integration tier.
'''
repos = ["go-database"]

[tasks.principles]
name = "The extension principles"
summary = '''
Promotes the strategy in `postgres-extensions.md` into Go Elemental's principles, retiring the
note.
'''
repos = ["architecture"]
