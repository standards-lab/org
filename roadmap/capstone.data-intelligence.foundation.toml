name = "The capstone's contracts and stack"
summary = '''
The contracts Bunrei and Mikoshi build against side by side, designed in the integration root:
the chunk record and embedding spaces, Bunrei's protocol, and the event protocol with its
lineage ids. Then the compose stack, the mapping of ~/s2va/athena onto Bunrei, and the demo
dataset arranged as a context tree.
'''
repos = ["capstone-data-intelligence"]
root = "capstone-data-intelligence"
remote = "https://github.com/JaimeStill/capstone-data-intelligence.git"
path = "~/capstones/capstone-data-intelligence"
order = [
  "chunks",
  "protocol",
  "events",
  "stack",
  "athena-mapping",
  "demo-dataset",
]
context = ["standards-lab/context/data-intelligence.md", "standards-lab/docs/data-intelligence.md"]

[tasks.chunks]
name = "The chunk record and embedding spaces"
summary = '''
The chunk record and the registered embedding spaces the pgvector load reads, from the schema "2"
run directories of docproc's `cmd/docproc` and docinfer's `cmd/docinfer`, with a tsvector column
and the text-search configuration (`simple` or per language) for multilingual content. Chunks
carry no context: membership is Mikoshi's.
'''

[tasks.protocol]
name = "Bunrei's protocol"
summary = '''
Bunrei's Queries and Commands, the small-document Command, which also takes a structured record,
the chunked upload protocol (session, chunks with offsets and digests, complete, resume) shaped to
graduate to go-web-sdk, the processing profiles, the caller's extraction spec, and the nested
`client` module's types.
'''

[tasks.events]
name = "The stage and result event protocol"
summary = '''
Waits on: `.bunrei` `metadata`, for the metadata shapes the events carry. Bunrei's stage,
inference, and result-batch events and the final manifest, with causation and correlation ids and
a layer on every event, Mikoshi's context-activity event, and the browser's transport on Mikoshi's
stream: NATS over WebSocket against Mikoshi's SSE relay, compared on latency, ordering, auth,
ports, and native-tier use (evidence 15). The NATS side as built is spike-html-apps' record
(https://github.com/JaimeStill/spike-html-apps/blob/main/context/README.md#nats-over-websocket-for-spike-ai-pipeline).
'''

[tasks.stack]
name = "The compose stack"
summary = '''
The root's compose stack: NATS with JetStream on file storage, PostgreSQL with pgvector, object
storage, and Torii's endpoints with Bunrei's and Mikoshi's consumer keys, with the services joining
as their images exist.
'''

[tasks.athena-mapping]
name = "Athena onto Bunrei"
summary = '''
Maps ~/s2va/athena's ingest onto Bunrei: its chunks-table contract, the re-embed through
registered embedding spaces (snowflake-arctic-embed-l-v2.0 to multilingual-e5-large, both 1,024
dimensions), Tesseract and Whisper onto vision and transcription, and what stays Athena's (summary
through the extraction stage; regex entities, sparse rows, rerank). Read only; Athena's migration
is later work outside the workspace.
'''

[tasks.demo-dataset]
name = "The demo dataset"
summary = '''
A curated slice of docs-corpus v0.2.0 plus authored records, arranged as a context tree with
references shared across branches and at least one query context, scripted so the presentation
loads it the same way every time.
'''
