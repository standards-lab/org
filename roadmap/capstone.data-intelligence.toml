name = "data-intelligence"
summary = '''
Liberates data held in binary files on a file share, in three repositories: capstone-cerebro, a
document-processing service on go-ai, docproc, and docinfer that never knows its caller and emits
results as ordered batches closed by a manifest; capstone-athena, a prototype client-facing
service with pgvector that commits those batches, chats through the model gateway, and shows each
stage live; and capstone-data-intelligence, the integration root with the compose stack and the
~/docs acceptance run. Carries spike-ai-pipeline's evidence 7, 8, 10, and 15. Builds Cerebro's
stream-backed root and work queue in go-messaging. Design tasks come first
(`data-intelligence.md`).
'''
repos = [
  "capstone-data-intelligence",
  "capstone-cerebro",
  "capstone-athena",
  "go-messaging",
  "docproc",
]
root = "capstone-data-intelligence"
remote = "https://github.com/JaimeStill/capstone-data-intelligence.git"
path = "~/capstones/capstone-data-intelligence"
order = [
  "metadata",
  "chunks",
  "text-layer",
  "vision",
  "protocol",
  "messaging-append",
  "messaging-work-queue",
  "state",
  "events",
  "athena-mapping",
  "tool-packaging",
]
context = ["standards-lab/context/data-intelligence.md"]

[tasks.metadata]
name = "Metadata"
summary = '''
Compositional metadata structures that extend docproc's base file metadata per format (PDF,
office, mail, OneNote, media), and where authoritative metadata capture lives. Its input is the
schema "2" metadata of docproc's `cmd/docproc`.
'''

[tasks.chunks]
name = "The chunk record and embedding spaces"
summary = '''
The chunk record and the registered embedding spaces the pgvector load reads, from the schema "2"
run directories of docproc's `cmd/docproc` and docinfer's `cmd/docinfer`.
'''

[tasks.text-layer]
name = "Text layer or vision"
summary = '''
When a page's text layer stands in for its vision text: a skip rule that tells a thin layer from a
whole one, from spike-ai-pipeline's docs/findings/docinfer.md.
'''

[tasks.vision]
name = "The vision prompt and sampling"
summary = '''
The vision prompt and sampling that keep a page with text transcribed rather than described, from
the same finding.
'''

[tasks.protocol]
name = "Cerebro's protocol"
summary = '''
Cerebro's Queries and Commands, the small-document Command, the chunked upload protocol (session,
chunks with offsets and digests, complete, resume) shaped to graduate to go-web-sdk, the
processing profiles, the caller's extraction spec, and the nested `client` module.
'''

[tasks.messaging-append]
name = "The expected-sequence append"
summary = '''
go-messaging appends an Event to a root's subject with an expected last sequence, beside the
outbox, for a job stream whose appends are its Commands' transactions (`messaging.md`, "A
stream-backed root").
'''
repos = ["go-messaging"]

[tasks.messaging-work-queue]
name = "The work-queue package"
summary = '''
go-messaging's durable jobs on JetStream work-queue retention: heartbeat, bounded redelivery,
backoff, and a dead-letter subject, a contract a Postgres SKIP LOCKED provider could also meet.
'''
repos = ["go-messaging"]

[tasks.state]
name = "Cerebro's state"
summary = '''
Cerebro's stores as docproc's `context/cerebro.md` designs them ("State and subjects"): the job as
a stream-backed root folded from its events and the work queue on JetStream (file storage);
content, staged inputs, and uploads in blob storage through `docproc/storage`, retained by age;
and the index (`docproc/postgres`) and the result cache (`docinfer/postgres`) in PostgreSQL. On
the messaging tasks' release.
'''

[tasks.events]
name = "The stage and result event protocol"
summary = '''
Cerebro's stage, inference, and result-batch events and the final manifest, and the browser's
transport on Athena's stream, NATS over WebSocket against a backend relay, compared on latency,
ordering, auth, ports, and native-tier use (evidence 15). The NATS side as built is
spike-html-apps' record, "NATS over WebSocket, for spike-ai-pipeline"
(https://github.com/JaimeStill/spike-html-apps/blob/main/context/README.md#nats-over-websocket-for-spike-ai-pipeline).
'''

[tasks.athena-mapping]
name = "Athena onto Cerebro"
summary = '''
Maps ~/s2va/athena's ingest onto Cerebro: its chunks-table contract, the 1024-dimension to
768-dimension re-embed through its embedding spaces, Tesseract and Whisper onto vision and
transcription, and what stays Athena's (summary through the extraction stage; regex entities,
sparse rows, rerank). Read only; Athena's migration is later work outside the workspace.
'''

[tasks.tool-packaging]
name = "Tools in Cerebro's image"
summary = '''
Cerebro's container image with docproc's external tools and docproc-ooxml, docproc-mail, and
docproc-onenote, run through the
exec runner, since the docker runner needs the host's socket.
'''
