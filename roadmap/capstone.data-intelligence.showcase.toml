name = "The capstone's acceptance and presentation"
summary = '''
The acceptance run over docs-corpus v0.2.0 measured against its baseline, and the live
presentation that walks the signal flow layer by layer and argues for elemental architecture.
'''
repos = ["capstone-data-intelligence"]
root = "capstone-data-intelligence"
remote = "https://github.com/JaimeStill/capstone-data-intelligence.git"
path = "~/capstones/capstone-data-intelligence"
order = ["services", "demo-load", "acceptance", "presentation"]
context = ["standards-lab/context/data-intelligence.md", "standards-lab/docs/data-intelligence.md"]

[tasks.services]
name = "Bunrei and Mikoshi in the compose stack"
summary = '''
Waits on: `.bunrei` `tool-packaging` and `.mikoshi` `image`, for the services' images. Bunrei and
Mikoshi join the root's compose stack (context/stack.md) against its NATS, their PostgreSQL
servers, and SeaweedFS, each with its Torii key, so `acceptance` runs the whole stack in compose.
'''

[tasks.demo-load]
name = "The demo dataset in Mikoshi"
summary = '''
Waits on: `.mikoshi` `items` and `ingest`. Loads the demo dataset's items, authored records, and
references into the context tree that `.foundation` `demo-dataset` builds (the root's `dataset`
note), and reviews the share, tour, and authored lists.
'''

[tasks.acceptance]
name = "The acceptance run"
summary = '''
Waits on: `.bunrei` and `.mikoshi` having synced. The whole stack over docs-corpus
v0.2.0, measured against its baseline, with chat responsive during the run and evidence 7, 8,
10, and 15 shown.
'''

[tasks.presentation]
name = "The presentation"
summary = '''
A presenterm deck in `presentation/` directing a live run through Mikoshi: the signal flow layer
by layer, the merits of an elemental architecture, and each layer's expansion points, live sources
(srt, rtmp, http, udp read as they arrive) among the future capabilities. Diagrams
from ~/tau/diagrams/ingredients, laid out as ~/presentations/open-inference-stack. Accepted by a
rehearsed run that includes the recovery scenario.
'''
