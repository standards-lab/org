name = "Repository access"
summary = '''
marathon learns from a declared command whether a repository's pull requests run CI, and a goal
locks only its root repository for its life. The goal also carries the claude-plugins findings of
the architecture review, and releases once, at its last task.
'''
repos = ["claude-plugins"]
root = "claude-plugins"
order = ["ci-awareness", "read-first-split", "review-findings", "shared-repos"]
context = ["claude-plugins/context/repo-access.md"]

[tasks.ci-awareness]
name = "CI awareness"
summary = '''
An optional `[remote] checks` command declares a repository's pull-request CI: SHIP runs it before
merging when set and merges directly when not, and the session brief says which. Sessions run
each command that changes git or remote state in its own tool call. Opens with the currency fix.
'''
proof = "`marathon checks` runs the configured wait, and `marathon currency` exits 0 in claude-plugins."

[tasks.read-first-split]
name = "Read-first split"
summary = '''
`references/briefs.md` splits into one file per format, and each command's Read first list names
only the formats it writes, so the read-first sets regain room without dropping a rule. The check
holds each command to listing every format it writes; the budgets are re-baselined, the gate's
eval runs, and the sentences ci-awareness cut for budget return where the room allows.
'''

[tasks.review-findings]
name = "Review findings"
summary = '''
The claude-plugins and marathon-architecture fixes CLP-2 through CLP-15, as the goal's note lists
them. Tags nothing; the marathon-architecture changes release with the goal.
'''

[tasks.shared-repos]
name = "Shared repositories"
summary = '''
A goal owns its root repository. A non-root repository locks only while it is off its default
branch, so several goals queue on it. Moves claude-plugins to `[remote] checks` and releases
`marathon/v0.23.0` and `marathon-architecture/v0.4.1`.
'''
