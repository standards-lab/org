name = "Mikoshi"
summary = '''
Mikoshi, the knowledge service people work in: a hierarchy of data contexts over files, records,
and analyses, with hybrid search, a chat whose tools see only the selected context, standing
analyses, lineage, and a live view of every signal crossing the architecture. Its web pieces sit
behind a `web/` boundary shaped to graduate. Builds the resumable upload, the SSE codec and
writer, and go-ai's reading through the codec in the libraries.
'''
repos = ["capstone-mikoshi", "web-app-sdk", "go-core", "go-web-sdk", "go-ai", "sqlate"]
root = "capstone-mikoshi"
remote = "https://github.com/JaimeStill/capstone-mikoshi.git"
path = "~/capstones/capstone-mikoshi"
order = [
  "web-shell",
  "store",
  "contexts",
  "upload",
  "browser-upload",
  "items",
  "sse-codec",
  "event-extensions",
  "sse-writer",
  "go-ai-sse",
  "hybrid-search",
  "context-tools",
  "ingest",
  "pgvector-types",
  "space-switch",
  "standing-analyses",
  "lineage",
  "sse-event-sequence",
  "event-relay",
  "signal-flow",
  "image",
  "foundation-notes",
]
context = ["standards-lab/context/data-intelligence.md", "standards-lab/docs/data-intelligence.md"]

[tasks.web-shell]
name = "The web shell"
summary = '''
The client through `webappgen inject` under `web/`, the boundary mirroring web-components and
web-app-sdk, its `src/` layers held to one import direction by its lint. spike-html-apps* are
references, not sources.
'''

[tasks.store]
name = "The database"
summary = '''
Waits on: `.foundation` `chunks`. Mikoshi's database: PostgreSQL with pgvector declared as a
native-tier extension, the migrator's readiness, and the migration of the chunks contract's
records (embedding spaces, source occurrences, chunks with their `simple` tsvector, and embeddings
with a partial ANN index per space), proven in the integration tier against an image carrying
pgvector.
'''
proof = "On an empty database, Mikoshi migrates, reports ready, and a nearest-neighbour query over fixture chunks in one registered space uses that space's index."

[tasks.contexts]
name = "The context tree"
summary = '''
Waits on: `.foundation` `chunks`. The design of the context tree: explicit and query nodes,
membership by reference, coverage of descendants, the filter format, moves, and how retrieval
filters chunks by a context's items, shaped to graduate (`context-tree-graduation`).
'''

[tasks.upload]
name = "The resumable upload in go-web-sdk"
summary = '''
Waits on: `.foundation` `protocol`'s `upload` note. go-web-sdk's base module implements
draft-ietf-httpbis-resumable-upload-16 on net/http: a handler behind a chunk-store interface and a
Go append client, with RFC 9530 digests and sequential appends across replicas, tusd as an interop
peer only. go-web-sdk v0.18.0's `ReadUpload` refuses a body with no Content-Length, which a
creating POST of unknown length lacks. go-web-sdk's currency pins the draft revision and reads
datatracker's latest. Released as go-web-sdk's next minor.
'''
repos = ["go-web-sdk"]

[tasks.browser-upload]
name = "The browser's resumable upload"
summary = '''
web-app-sdk's browser client for draft-ietf-httpbis-resumable-upload-16 on `upload`'s release,
against the root's `upload` note: appends with digests, resume after a dropped connection, progress.
web-app-sdk's currency pins the draft revision with go-web-sdk's. Released as web-app-sdk's next
minor.
'''
repos = ["web-app-sdk"]

[tasks.items]
name = "Items"
summary = '''
Files, API-authored records, and analyses as items: upload into blob storage through go-web-sdk's
resumable upload handler and `browser-upload`'s client, records through the API, references into
contexts, and the context-activity events. The item projection declares `route`, `kind`
(docproc's sniffed content type), and `duration` as filter fields, which the contexts domain
checks a query context's field names against (the root's `dataset` note).
'''

[tasks.sse-codec]
name = "The SSE codec"
summary = '''
go-core's `text/event-stream` codec beside `event`: events read and written to the WHATWG rules
(type, data, and id; comments and retry parsed), with no HTTP or model concerns, so go-web-sdk
writes through it and go-ai reads through it. Released as go-core's next minor, which carries its
unreleased main.
'''
repos = ["go-core"]

[tasks.event-extensions]
name = "Event extension attributes"
summary = '''
go-core's `Raise` sets an event's extension attributes, which `ingest` and `.bunrei`
`event-stream` need for lineage and `layer`. Released in go-core's next minor with `sse-codec`.
'''
repos = ["go-core"]

[tasks.sse-writer]
name = "The SSE writer"
summary = '''
go-web-sdk's writer of a request-scoped stream on go-core's codec: the media type and
`Cache-Control: no-store`, a flush per event, the write deadline reset past the server's
`WriteTimeout`, and the stream ended on the run context so a drain exits 0. A token stream answers
the one request that asked for it; committed outcomes are events (the design page,
"Events"). Released as go-web-sdk's next minor.
'''
repos = ["go-web-sdk"]

[tasks.go-ai-sse]
name = "go-ai on go-core's codec"
summary = '''
go-ai takes go-core as its first standards-lab requirement: `format.SSE` reads through go-core's
codec in place of `internal/sse`, its `EventStream` seam unchanged. Released as go-ai's next minor.
'''
repos = ["go-ai"]

[tasks.ingest]
name = "Committing Bunrei's batches"
summary = '''
Waits on: `.foundation` `events` and `.bunrei` `api`'s `client/v0.1.0`. Submitting items to Bunrei
and committing each result batch in one transaction with its outbox events, de-duplicated through
the inbox and checked against the manifest, into the registered embedding space.
'''

[tasks.hybrid-search]
name = "Hybrid search"
summary = '''
tsvector and pgvector rankings fused by reciprocal rank fusion inside a context, narrowed by facet
filters (item kind, content type, metadata, dates), with no reranker, reading the active
embedding space; shaped to graduate into `retrieval`. Adds Mikoshi's `fnox.toml` and issues its
interactive Torii key with `hosting key issue`.
'''

[tasks.context-tools]
name = "Context tools and chat"
summary = '''
A tool-calling chat on go-ai's agent alias, on `sse-writer` and `go-ai-sse`, whose tools (search,
list, read, run an extraction, read the event history) refuse anything outside the selected context,
its answer streamed as SSE through go-web-sdk's writer inside the request, one event per committed
turn or analysis, analyses saved as items with provenance, and citations in the thread. The
agent's system prompt is a default that an active override stored in Mikoshi replaces, as Bunrei's
profile prompts are.
'''

[tasks.pgvector-types]
name = "Every pgvector type in sqlate"
summary = '''
sqlate's pgvector package covers every pgvector type and metric, with live tests per type, for
the per-space type migration. Released as `postgres/pgvector/v0.2.0`.
'''
repos = ["sqlate"]

[tasks.space-switch]
name = "Switching embedding spaces"
summary = '''
Waits on: `pgvector-types`. A space's status and the active marker, a re-embed by resubmitting
the items through Bunrei while the active space serves, rollback, and the per-space type
migration (the root's `chunks` and `athena` notes).
'''

[tasks.standing-analyses]
name = "Standing analyses"
summary = '''
Analyses that rerun when a context's events say it changed, query contexts checked against each
new item, and the result saved as a new version of the analysis item.
'''

[tasks.lineage]
name = "Lineage"
summary = '''
A citation walked back through chunk, embedding, model identity, inference, docproc stage, and
upload to the source bytes, from the events' causation ids.
'''

[tasks.sse-event-sequence]
name = "The browser's SSE event sequence"
summary = '''
web-app-sdk's SSE `EventSequence` adapter, for `event-relay`'s client. Released as web-app-sdk's
next minor.
'''
repos = ["web-app-sdk"]

[tasks.event-relay]
name = "The event relay"
summary = '''
Mikoshi's SSE relay of its JetStream stream to the browser through `sse-writer`, stateless per
replica, its cursor the stream sequence.
'''

[tasks.signal-flow]
name = "The signal-flow view"
summary = '''
Each event shown crossing its layer live (upload, blob, Bunrei job, docproc, docinfer, go-ai,
Torii, result batches, pgvector commit, browser), with the per-layer latency waterfall and queue
and retry pressure from the same stream.
'''

[tasks.image]
name = "Mikoshi's service image"
summary = '''
Mikoshi's service image with its web client embedded, built from its own Dockerfile under its
own currency, so the root's compose stack can run Mikoshi in `.showcase` `services`.
'''

[tasks.foundation-notes]
name = "Notes from .foundation"
summary = '''
The goal record takes `.foundation`'s edits: the evidence-15 Decision points at the root's
`events` note (Mikoshi's SSE relay), and a Decision for `items`: Mikoshi's blob storage is
go-storage's `s3` provider against the root stack's SeaweedFS, its bucket created on start.
'''
