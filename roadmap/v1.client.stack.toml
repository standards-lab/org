name = "The client stack"
summary = '''
Six standards-lab repositories: web-tooling, web-foundation, web-icons, web-components, and
web-app-sdk, each a package under the @standards-lab scope released by a plain vX.Y.Z tag on a
pack commit, cut by hand; and webappgen, a Go CLI released as binaries from a plain vX.Y.Z tag.
Each starts fresh at v0.1.0, seeded by copy from its spike with provenance. go-web-sdk gains
`NewClient`, and the architecture layer gains the draft web-elemental standard. The goal runs
before the capstone, starting in wave B. It holds go-web-sdk and the exclusive group only for its
`newclient` task, and architecture only for its `standard` task.
'''
repos = [
  "web-tooling",
  "web-foundation",
  "web-icons",
  "web-components",
  "web-app-sdk",
  "webappgen",
]
root = "web-foundation"
order = [
  "tooling",
  "foundation",
  "palettes",
  "components",
  "sdk",
  "newclient",
  "foundation-settings",
  "icons",
  "components-settings",
  "template",
  "standard",
]
context = ["standards-lab/context/web-client.md"]

[tasks.tooling]
name = "web-tooling"
summary = '''
The browser-test and screenshot tooling the other repositories take by tag, from
spike-html-apps-tooling at d77877b: the browser driver, the test server, the process helper, and
the `web-screenshots` bin, with a helper, from spike-html-go-wasm, that runs a browser suite in a
pinned DejaVu font set. Released as v0.1.0; kept lean, since web-foundation's browser tier needs it
first.
'''
repos = ["web-tooling"]

[tasks.foundation]
name = "web-foundation"
summary = '''
The native foundation from spike-html-apps-foundation v0.3.1: the baseline sheets, profiles, tool
sheets, keys, theme preferences, conformance check, and Intl formatters. spike-html-design v0.7.0
stays a frozen reference. sites.status-reports and sites.training.foundation start once it
releases.
'''
repos = ["web-foundation"]

[tasks.palettes]
name = "The built-in color profiles"
summary = '''
Refines web-foundation's built-in color profiles from the palettes at
https://terminalcolors.com/. The site states no license, so each palette's upstream license is
checked before it is used. A profile ships when it passes the conformance check, a new rule of 4.5:1
WCAG contrast, and the architect's review of its specimen pages.
'''
repos = ["web-foundation"]

[tasks.components]
name = "web-components"
summary = "The Lit shadow components on web-foundation, from spike-html-apps-components."
repos = ["web-components"]

[tasks.sdk]
name = "web-app-sdk"
summary = '''
The application SDK from spike-html-apps-sdk: the router, the API client, the token provider, the
domain-service pattern, and the resumable event sequence with its NATS-over-WebSocket adapter.
'''
repos = ["web-app-sdk"]

[tasks.newclient]
name = "NewClient in go-web-sdk"
summary = '''
go-web-sdk's handler that serves an app's embedded Vite build, from spike-html-apps' `sdk`
package (`web-client.md`, "NewClient"). It is the goal's only task that locks go-web-sdk and the
exclusive group: the goal's repos gain go-web-sdk for it and drop it at its SHIP.
'''
repos = ["go-web-sdk"]

[tasks.foundation-settings]
name = "The foundation's shared patterns in web-foundation"
summary = '''
A breaking web-foundation minor, v0.4.0 (`web-client.md`, "Conventions"). It removes sl-theme-menu,
setOpen and isOpen, keys-help.ts, and keys.js' [data-keys-list] fill (Listed drops run); the theme
menu's sheet moves into web-components' sl-settings. It adds the glyph button and hint sheet; the
dialog sheet, with its header row and the wide and fit-content (capped at 56rem) widths; an opt-in
page-layout sheet with the application and prose page types; the tokens, field and progress rules,
utility classes, and motion sheet the components keep locally; formatJson, from web-components'
json.js, with a text-parsing companion; and five --color-* role hooks over role-free hues.
'''
repos = ["web-foundation"]

[tasks.icons]
name = "web-icons"
summary = '''
The icons layer, seeded from spike-html-hosting-icons at 8b8d955 with provenance: Octicons 19.42.0
(its MIT LICENSE kept) as one string ES module per icon, and the Vite plugin, from
spike-html-hosting-sdk's src/icons.ts, that fills <svg data-icon="set/name"> markers in dev and
build. Its browse page runs on web-foundation v0.4.0 without a theme menu. Released as v0.1.0.
'''
repos = ["web-icons"]

[tasks.components-settings]
name = "Settings and Help in web-components"
summary = '''
A web-components minor, v0.2.0, on web-foundation ^0.4.0 and web-icons ^0.1.0: sl-settings, the
theme and keys settings applied and stored at once, on S, and sl-shortcuts, Help's plain-text
keyboard shortcuts, on ?, from spike-html-hosting-components v0.5.1. sl-drawer's Close renders
web-icons' x-16 and gains a modal-only mode. The local copies of the patterns web-foundation v0.4.0
takes go, and json.js goes with no re-export.
'''
repos = ["web-components"]

[tasks.template]
name = "webappgen with the standalone kind"
summary = '''
webappgen, a Go CLI on go-cli-sdk, with its first kind: `webappgen new standalone <dir>` writes a
static app on the stack that reads a `config.json` placed beside its build, with `--install` to
install it. A written project's check reports the whole build's size and enforces no budget. The
CLI's check writes a project and runs that project's own check. Its page takes web-foundation
v0.4.0's application page, web-icons v0.1.0's glyphs, and web-components v0.2.0's Settings on S
and Help on ?. Released as v0.1.0, binaries for Linux and macOS. It adopts marathon 0.21.0 as
standards-lab/context/harness-adoption.md sets out.
'''
repos = ["webappgen"]

[tasks.standard]
name = "The Web Elemental standard"
summary = '''
Founds web-elemental ("Web Elemental"), a draft web standard beside Go Elemental in the
architecture layer, with Lit as its one runtime dependency (`web-client.md`, "Toward Web
Elemental"). The goal's repos gain architecture for it.
'''
repos = ["architecture"]
