for what every web STANDARDS.md repeats (layer direction, `.ts` specifiers, type-stripping tests,
one script per mise task); a pin for web-foundation's frozen `flexoki.css` fixture; and
web-foundation exporting sl-shortcuts' screen-reader `NOTE`.
'''
