name = "Status reports"
summary = '''
The repository of status reports on the effort, a standalone project site under
`/status-reports/`. marathon sets it up and steps back: the repository defines its own report
layout, components, conventions, and documented report workflow, which every report follows
instead of marathon tasks. The prose is the architect's; agents suggest revisions through the
editor and make the supplements and components. Each report ends with "Explore it yourself", a
report-scoped guide prompt built from a shared base guide. Starts after v1.client.stack's
`foundation` task; the first reports backfill the end of wave C and the start of wave D.
'''
repos = ["status-reports", "standards-lab"]
root = "status-reports"
remote = "https://github.com/standards-lab/status-reports.git"
path = "~/architecture/status-reports"
order = ["layout"]

[tasks.layout]
name = "The report layout"
summary = '''
`init`, the standard report layout, its components on web-foundation, its conventions, the base
exploration guide and per-report template, and the report workflow, with agent help planning
reports. Takes in the coordinator's briefs/ and interview.md, which the org repository then
drops; joins `order` and the catalog.
'''
