through soffice; the MPEG-2 program stream; TNEF; and docproc-ooxml's arm64 memory floor. Its
first tools/ooxml change corrects generate.py's `slide_objects` docstring, which says the
pictures sit "beside another": the two overlap exactly, as tools/ooxml/fixtures/README.md says,
with no fixture change. A later `plan` writes its tasks.
'''
