name = "docproc's format coverage"
summary = '''
Widens what docproc and its tools read, ahead of the capstone, through the tools docproc already
requires (acceptance, 2026-11-19; plan, 2026-11-25; curated 2026-11-25): the text encoding's two
keys; RAR and xz through 7zz, bzip2 through Go's standard library, and MPEG program streams and Ogg
video as video; text as the last resort, HTML, EPUB chapters, and `#!` scripts among it; PDF page
text without column padding; ODF, WordPerfect, and .xlsb through soffice; docproc-ooxml's text
boxes, comments, cell notes, and arm64 memory floor; and TNEF.
'''
repos = ["docproc"]
root = "docproc"
order = [
  "text-encoding-keys",
  "archives-and-mpeg",
  "text-last-resort",
  "pdf-text-padding",
  "office-soffice",
  "ooxml-unread",
  "ooxml-arm64-floor",
  "tnef",
]
criteria = [
  "docproc's docs/limits.md names none of the summary's formats as unrouted or without a processor.",
  "docproc-ooxml warns of no text box, pptx comment, or xlsx cell note, and docs/limits.md states its arm64 floor.",
  "A docproc run over ~/docs prepares its ODF, WordPerfect, .xlsb, MPEG-2, and Ogg video inputs, and its HTML and EPUB as raw text.",
]
context = [
  "docproc/context/tool-gaps.md",
  "docproc/docs/limits.md",
]

[tasks.text-encoding-keys]
name = "The text encoding's two keys"
summary = '''
The text stage's combined encoding value splits into `encoding`, the charset alone, and
`encoding_by`, "bom" or "fallback", absent for plain UTF-8, under wire "1" and schema "2" as a
recorded exception; the upgrade slices bring docproc current.
'''
proof = "A run's text outputs carry the two keys, and docproc's currency reports only held items."

[tasks.archives-and-mpeg]
name = "RAR, xz, bzip2, MPEG program streams, and Ogg video"
summary = '''
route identifies RAR4 and RAR5, xz, bzip2, the MPEG program stream, and Ogg holding video; the
archive stage reads RAR and xz through 7zz and bzip2 through compress/bzip2, and the video stage
reads the program stream and Ogg video. Split RAR volumes stay unread.
'''
proof = '''
Committed RAR, xz, and bzip2 fixtures are prepared with their entries as parts, and ~/docs's
duck-and-cover-mpeg2.mpeg and duck-and-cover-theora.ogv are prepared as video.
'''

[tasks.text-last-resort]
name = "Text as the last resort"
summary = '''
Content route places nowhere else whose head reads as text routes to the text stage, raw: HTML
(the web-content rule goes), EPUB chapters, CSS, JavaScript, notes, and `#!` scripts. Its first
question is whether the text-extension list goes (a windows-1252 sniff; precedence over mbox and
header-sniffed messages). inspect's polyglot scan reaches `#!` scripts and text kinds, exempt
today (docs-corpus's exec-4 gap).
'''
proof = '''
~/docs's HTML, EPUB chapters, and extensionless or unlisted text files are prepared as text, and
a `#!` script with an appended ZIP is flagged polyglot.
'''

[tasks.pdf-text-padding]
name = "PDF page text without column padding"
summary = '''
A PDF page's text layer no longer pads its columns with long runs of spaces (docinfer's
acceptance: multi-column scanned pages up to 97% spaces); the design is the task's own.
'''
proof = "~/docs's multi-column PDF page texts hold no column-padding space runs, their words kept."

[tasks.office-soffice]
name = "ODF, WordPerfect, and .xlsb through soffice"
summary = '''
The office stage converts ODF packages, WordPerfect documents, and Excel binary workbooks through
soffice and reads the result through docproc-ooxml, as it does legacy documents.
'''
proof = "~/docs's ODF, WordPerfect, and .xlsb inputs are prepared, none left without a processor."

[tasks.ooxml-unread]
name = "docproc-ooxml's text boxes, comments, and cell notes"
summary = '''
docproc-ooxml reads docx and xlsx text boxes, a pptx's comments, and an xlsx's cell notes into
its Markdown; its first change corrects generate.py's `slide_objects` docstring.
'''
proof = "Goldens hold the new text, and a ~/docs run has no warning for those kinds."

[tasks.ooxml-arm64-floor]
name = "docproc-ooxml's arm64 memory floor"
summary = '''
Measures the released docproc-ooxml's memory floor on arm64, as acceptance measured x64's, and
states it in docs/limits.md and docs/acceptance.md.
'''
proof = "docs/limits.md states the arm64 floor, with its measurement's recipe in docs/acceptance.md."

[tasks.tnef]
name = "docproc-mail reads TNEF"
summary = "docproc-mail reads a TNEF part's body and attachments into its message, in place of its note."
proof = "A TNEF fixture's body and attachments are in its message's Markdown and media, with no TNEF note."
