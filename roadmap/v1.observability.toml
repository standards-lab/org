name = "Observability"
summary = '''
The go-observability infrastructure library: a base module over the stable OpenTelemetry API
and SDK, and an `otlp` sub-module pinning the exporters and their gRPC/protobuf weight, as the
linked strategy record settles. Logs stay on stdout as structured JSON stamped with trace and span
ids, ingested by the collector's filelog receiver, until the OTLP logs SDK is stable. The LGTM
stack (Loki, Grafana, Tempo, Mimir) is reached only through OpenTelemetry, OTLP to the collector,
and is never a Go dependency. Sequenced before the layers that follow, so each instruments as it
lands.
'''
