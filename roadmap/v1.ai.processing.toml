name = "docproc, the processing library and its system tools"
summary = '''
docproc, from spike-ai-pipeline-processing and spike-ai-pipeline's docproc command: an enabling
library adjacent to the standard, beside sqlate, depending on no model concept; inference is
docinfer's. Its stores are interfaces, its providers nested modules (`docproc/storage`,
`docproc/postgres`), and the nested `cmd/docproc` writes the run directory `cmd/docinfer` reads.
Its system tools, docproc-ooxml, docproc-mail, and docproc-onenote, live under `tools/<format>`,
each with one JSON Lines contract carrying Markdown as its text layer, proven by committed golden
outputs (`ai-strategy.md`, "Repositories and placement"; `system-tools.md`).
'''
repos = ["docproc", "architecture"]
root = "docproc"
remote = "https://github.com/standards-lab/docproc.git"
path = "~/architecture/docproc"
order = [
  "layers",
  "design",
  "architecture",
  "ooxml",
  "mail",
  "onenote",
  "library",
  "providers",
  "docproc",
  "reports",
  "acceptance",
  "hardening",
  "mail-hardening",
  "final",
]
context = [
  "standards-lab/context/ai-strategy.md",
  "standards-lab/context/system-tools.md",
  "standards-lab/context/data-intelligence.md",
]

[tasks.layers]
name = "The layers of Cerebro's stack"
summary = '''
Writes docproc's `docs/layers.md`: each boundary of Cerebro's stack as signatures or schemas, traced
to a capstone task or spike evidence: the tool contracts; docproc's API (inspection and routing,
inference interfaces free of go-ai, batches as made, index and cache interfaces, event shapes,
per-job cancellation); go-ai's surface as Cerebro uses it; and Cerebro's Queries, Commands, result
batches, manifest, and events. Settles the tool contracts' schema version and lists what changes per
tool and per package from the spikes. The client, processing, and capstone design tasks build from
it; the gateway stays transparent to go-ai.
'''

[tasks.design]
name = "Design review of docproc and its tools"
summary = '''
Opens with a Fable 5.2 evaluation of each promoted artifact (spike-ai-pipeline-processing, the spike
root's docproc, and the office, mail, and OneNote CLIs) for issues and simplifications, against the
full architecture standards, `docs/layers.md`, and Cerebro's requirements; then reviews them against
the workspace and writes the review into docproc's notes. Settles each tool's contract additions
field by field, each traced to a capstone design task and marked as the tool's, docproc's, or
Cerebro's, and each tool's first tag and release targets. The root's STANDARDS.md applies
cli-applications.md to docproc and domain-files.md to docproc's command packages only. docinfer's
packages are v1.ai.inference's design review.
'''

[tasks.architecture]
name = "A library and its system tools in the architecture"
summary = '''
Writes the go-elemental system-tools page from `system-tools.md`, and the placement rule in
`dependencies.md`, `repository-topology.md`, and `tool-beside-library.md`: a repository's place
follows its base module; nested command and provider modules don't move it (as blobfs's example
module doesn't), nor do the system tools nested in the library that runs them, in another
language (docproc's `tools/`); a cross-repository task orders its own exceptions in its brief.
The adjacent-library rule and where a package's events live are already on the pages.
'''
repos = ["architecture"]

[tasks.ooxml]
name = "docproc-ooxml"
summary = '''
docproc-ooxml from spike-ai-pipeline-office: the Open XML CLI on Microsoft's Open XML SDK,
published as NativeAOT binaries, turning docx, xlsx, and pptx into its JSON contract with Markdown
inside it, in one run. Moves to .NET 11 with the Open XML SDK its only package; adds document
`properties`, two-pass xlsx streaming, embedded packages and OLE payloads as `ole` media,
hyperlinks, and a warning for each kind it doesn't read; output is byte-identical for the same
input. Takes the envelope additions and refuses an `EncryptedPackage` as `encrypted`. Builds
docproc's CI, its `ci` gate and ruleset, and the `tools/*/v*` release workflow.
'''

[tasks.mail]
name = "docproc-mail"
summary = '''
docproc-mail from spike-ai-pipeline-mail: the Rust CLI, published as static musl binaries, that
reads .pst stores, .msg and .eml messages, and mbox files into JSON Lines of its contract. Adds
`smtp_address` for Exchange (EX) addresses, so a sender has one identity across .pst and .eml.
Writes the shared Rust envelope crate under `tools/` and takes the envelope additions: `schema
<n>` on `--version`, the warning escape, error reasons free of paths, and the message line's
optional `media`. CI checks gate the merge.
'''

[tasks.onenote]
name = "docproc-onenote"
summary = '''
docproc-onenote from spike-ai-pipeline-onenote: the Rust CLI, published as static musl binaries,
that reads OneNote sections, .onepkg exports, and notebook directories through onenote_parser
into JSON Lines of its contract. Adds the file-only option, under which it refuses a table of
contents, an encryption signal, and each drawing's ink alt text. Pins onenote_parser exactly,
with workarounds it owns. Adopts the shared Rust envelope crate, with overflow checks in release,
third-party notices, and MPL-2.0 allowed by name, and takes the envelope additions.
'''

[tasks.library]
name = "The processing library"
summary = '''
docproc's library module from spike-ai-pipeline-processing, without the client (`docs/layers.md`):
inspection and routing, the tool runners and readers, the stages, and dispatch with its content
store and index, each store an interface with filesystem and memory implementations. It holds no
inference orchestration, which is docinfer's (v1.ai.inference). The Go CI job and module releases
join docproc's CI. `internal/cli` holds the one refusal-reason mapping; failures are recorded by the
classification table; `tool`'s `Spec.MemoryLimit` bounds every run's memory. A field's value never
fails a PDF's form read, and the audio stage windows from one decode.
'''

[tasks.providers]
name = "The providers"
summary = '''
The providers as nested modules of docproc, each passing `dispatchtest`'s suites:
`docproc/storage`, `dispatch.Content` in object storage over go-storage, its live tier against a
compose SeaweedFS; and `docproc/postgres`, `dispatch.Index` in PostgreSQL over sqlate and
sqlate/postgres, with its migrations, which the host applies. The scratch-database helper moves
to `sqlate/postgres/pgtest`, with go-messaging's and blobfs's `postgres` suites moved onto it
first. A root go.work, compose services, and a CI integration job. Tags `storage/v0.1.0` and
`postgres/v0.1.0`; sqlate, go-messaging, and blobfs leave the goal's repos at its SHIP.
'''
repos = ["docproc", "sqlate", "go-messaging", "blobfs"]

[tasks.docproc]
name = "docproc"
summary = '''
`cmd/docproc`, from the spike root's docproc: runs the library's whole suite over an input set into
a versioned run directory, schema "2", with no inference, its record flushed per line. `rundir` is
one handle, from `Open` or `Create`, with `rundir.json` at the run's root; main.go sits at the
nested module's root, and a committed `go.work` spans the base module and `cmd/docproc` between
tags. docproc's README names `stages` as the shipped wiring and `cmd/docproc` its first caller. Tags
docproc v0.2.0 when `rundir` lands.
'''

[tasks.reports]
name = "Holistic reports"
summary = '''
Makes `cmd/docproc`'s report holistic: an index page plus one page per input content, keyed by its
SHA-256, not per input, holding the source link, the file and record metadata, and the whole part
tree with every output inline, with no 1,000-character cut. Tags `cmd/docproc/v0.1.0`, re-tagging
the base module first only if `rundir` changed. docinfer's report moves to v1.ai.inference.
'''

[tasks.acceptance]
name = "Acceptance of docproc and its tools"
summary = '''
Reruns each tool's bench from its spike against its release, and `cmd/docproc` over ~/docs
(corpus.docs), and fixes what it finds, never redesigning. Measures each tool's peak memory over
~/docs, dispatches the inspection evaluation's bombs through `cmd/docproc`'s starting bounds, and
measures the word error rate on ~/docs' audio before the tag. Settles whether audio that fits in one
request goes unsplit (`ai-strategy.md`, evidence 5). docinfer's reruns move to v1.ai.inference.
'''

[tasks.hardening]
name = "Library hardening"
summary = '''
Fixes what acceptance found in the library, each a defect or a gap in a test, never a redesign
(docproc's docs/acceptance.md): `tool` sets `TMPDIR` to the run's scratch for every tool; a
portfolio's per-page path writes one PNG per page and reads only that page's text; an XPS package
named `.docx` is sniffed as no processor; soffice's full-disk exit is the run's failure, not the
content's; `sevenzip.Reader.Extract` returns the failing writer's error; `GOARCH=386 go vet`
passes; `TestEmailStageReleases` asserts the release property; and ooxml's fixtures README
describes slide-objects' slide 3 truly.
'''

[tasks.mail-hardening]
name = "docproc-mail hardening"
summary = '''
docproc-mail's follow-ups from acceptance: profiles the schema "2" reads that slowed v0.1.2 and
measures a replacement allocator against musl's; the RTF text reader breaks at `\cell` and
`\row`; an `IPM.Note.SMIME` message gets the S/MIME warning a MIME part gets; and a fixture
message and its golden pin the output differences tools/mail's CHANGELOG v0.1.2 lists
(`standards-lab/docs/ai-strategy.md`, "v1.ai.processing · mail-hardening").
'''

[tasks.final]
name = "Final acceptance and sync"
summary = '''
Reruns `cmd/docproc` over ~/docs, the mail bench, and the shared-gs identity check against the
hardened releases, and records them in docproc's docs/acceptance.md; no word error rate or bomb
reruns. In architecture's `standards/go-elemental/README.md`, adds a go-ai row to the infrastructure
table, naming no version, and docproc to the adjacent-library list, which then reads "Three
libraries". Then syncs the goal.
'''
