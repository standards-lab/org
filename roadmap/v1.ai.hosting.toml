name = "The ai-hosting specification repository"
summary = '''
Builds `ai-hosting` from experiment.hosting's five spikes: vLLM on every host, one model to each
container, laid out as agent on gb10-1, vision on gb10-2, audio on the Framework, and embedding
on framework-2; agentgateway's compose stack on gb10-2 in front of them, with gateway keys,
priority, and overflow to Azure AI Foundry for agent, vision, and audio, never
embedding; a multilingual model in place of set A's English-only embedding model; and the
upgrade-evaluation convention rebuilt on vLLM. ai-hosting becomes the one hosting repository on
each workstation. Runs before the capstone, which runs on the hosts and gateway it specifies.
'''
repos = ["ai-hosting", "architecture", "go-ai", "docinfer"]
root = "ai-hosting"
remote = "https://github.com/standards-lab/ai-hosting.git"
path = "~/architecture/ai-hosting"
order = [
  "design",
  "secrets",
  "hosts",
  "migrate",
  "embedding",
  "framework-2",
  "gateway",
  "upgrades",
  "acceptance",
  "architecture",
]
context = ["standards-lab/context/ai-hosting.md"]

[tasks.design]
name = "Design review of the hosting stack"
summary = '''
Opens with Fable 5.2 evaluations of the three promoted artifacts against the full architecture
standards, the workspace, and `ai-hosting.md`: spike-model-engines' `host/`, spike-model-gateway,
and spike-model-hosting's `profile` package. Settles each finding with the architect, one review
round per evaluation, and writes ai-hosting's design note: the repository's layout, which parts
each task takes from which spike, the gateway's open points (`docs/ai-hosting.md`, "The `gateway`
task", settled at its plan), the `hosting` suite with the read-only operator commands taken from
personal-agents' `outpost`, and the `cleanup` task's inventory. Confirms multilingual-e5-large's
scope and price on Foundry managed compute. No code.
'''

[tasks.secrets]
name = "Development-time secrets"
summary = '''
Each repository that needs a secret commits its own age-encrypted `fnox.toml`, every secret
described, read through mise's per-task grants and checked by a keyless `lint-secrets`; ai-hosting,
go-ai, and docinfer adopt it, the laptop and gb10-2 are enrolled with an offline backup, and
architecture's `principles/development-secrets.md` holds the convention and its procedures.
'''

[tasks.hosts]
name = "The hosts on ai-hosting"
summary = '''
Each host class's vLLM rows with their install, update, and uninstall, the Tailscale bind and CDI
fixes, a check for a stranded container, and a runbook per host class, which documents the
Framework's LUKS unlock, all as `hosting <group> <verb>` commands symlinked into `~/.local/bin`: a
command that differs by host class detects the class once and calls its private per-class
function.
'''
repos = ["ai-hosting"]

[tasks.migrate]
name = "The hosts moved onto ai-hosting"
summary = '''
Moves gb10-1, gb10-2, and the Framework off their spike-model-engines clones onto ai-hosting: clones
it, links the `hosting` suite, runs each class runbook's root steps with the architect, replaces
each spike row container with `hosting engine install`, and retires the spike gateway. Checks every
row healthy, `engine status` clean, and `engine update` a no-op. Then leaves ai-hosting as each
workstation's only hosting repository and script infrastructure: removes every spike clone, gb10-2's
`~/gateway`, spike-ai-pipeline's host clone and router, personal-agents' `outpost` links, and the
images, units, and sudoers rules no `hosting` command created.
'''
repos = ["ai-hosting", "go-ai"]

[tasks.embedding]
name = "A multilingual embedding model"
summary = '''
Replaces set A's embedding model, granite-embedding-english-r2 (English-only), with a
multilingual model the Framework's vLLM serves, multilingual-e5-large first. Checks retrieval
across ~/docs' languages, that docinfer's chunks fit in 512 tokens, and that the model doesn't
degrade the Framework's audio row, by running audio alone and then beside embedding at load.
Re-measures the embedding row, its limit beside audio, and the layout table.
'''
repos = ["ai-hosting"]

[tasks.framework-2]
name = "Embedding on its own host"
summary = '''
Opens with the claude-plugins pin's upgrade slice. Brings framework-2, a second Strix Halo with LUKS
unlocked at the console or remotely, onto ai-hosting by the strix-halo runbook; moves each Strix
Halo host's model store onto its second NVMe; moves the embedding row to framework-2 and leaves the
Framework serving audio alone at cap 8, fraction 0.18. Re-measures embedding alone on framework-2,
the stream sweeps at caps 32 and 16 and a rate sweep to its ceiling, dropping the 14 req/s limit
that protected audio. Checks every row healthy on both hosts. framework-2 stays out of `fnox.toml`
until the later enrollment.
'''
repos = ["ai-hosting", "go-ai", "docinfer"]

[tasks.gateway]
name = "The model gateway"
summary = '''
agentgateway's compose stack on gb10-2, started with no spike gateway there: gateway keys, priority,
budgets, embedding's rate bucket, LGTM telemetry, and path hardening. Overflow goes to Azure for
agent, vision, and audio only; embedding is self-hosted only. Settled at its plan: the `/models` root, route `ai` or `llm`, admission on `/metrics`, a cap on bulk concurrency, a
sliding budget window, authenticated OTLP, and where `key issue` writes keys
(`ai-hosting/context/gateway.md`, "Open at the gateway plan").
'''

[tasks.upgrades]
name = "The upgrade-evaluation convention on vLLM"
summary = '''
Rebuilds spike-hosting-upgrades' convention, policy, and `hosting-upgrades` skill (setup, survey,
measure) on vLLM in ai-hosting alone, with a descriptor for each of the four hosts, its purposes and
load targets taken from the current layout: agent 4, vision cap 4, audio cap 32, embedding 16.
Measure runs engine moves and settings checks as bench cells, each level on its own over distinct
inputs from a restarted row, reading the cache counters. Screening a model's agent tiers stays with
`model-evaluation`. The skill stays in `.claude/` until v1.harness makes it a plugin.
'''
repos = ["ai-hosting"]

[tasks.acceptance]
name = "Acceptance of the hosting stack"
summary = '''
Closes the gaps left after the rows' tuning (`docs/findings/`), not re-tuning them. Re-measures
vision at 1120 on docinfer's dense pages and audio on its real windows, each level on its own over
distinct inputs, sets cap and queue limit to the throughput peak, and moves `measured_vllm` to
v0.34.0. Proves bulk priority and the chat buckets with a bulk key. Removes the gateway's key
budgets and the unrouted Azure embedding deployment. Raises the overflow capacities, adds an Azure
budget alert, and records both. Reruns the layout cell, go-ai's and docinfer's tiers, and an
overflow cell per alias, fixing what it finds.
'''
repos = ["ai-hosting", "go-ai", "docinfer"]

[tasks.architecture]
name = "The hosting method pages in the architecture"
summary = '''
Closes the goal. Writes four method pages on its own branch in architecture: reading a model card
(from spike-model-hosting's `docs/model-cards.md`), tool-call reliability (from its
`docs/findings/tool-reliability.md`), sizing a vLLM row, and the placement rule. Closes
ai-hosting's remaining open notes, and readies the goal record's pending edits for the sync, which
archives the spike repositories. The architect frees the architecture lock before it merges.
'''
repos = ["architecture", "ai-hosting"]
