name = "marathon 0.21.0's tools, and the pattern every repository adopts"
summary = '''
Releases marathon's tools as Go binaries and a reference check, sets the adoption pattern in
ai-hosting, fixes the shims, and brings architecture into line. The other repositories adopt
through the sibling harness.adoption-<slug> goals (standards-lab/context/harness-adoption.md).
'''
repos = ["claude-plugins", "ai-hosting", "architecture"]
root = "claude-plugins"
order = ["references", "go-tools", "ai-hosting", "shim", "architecture"]
context = [
  "claude-plugins/context/harness-optimization.md",
  "architecture/principles/comments.md",
  "standards-lab/context/harness-adoption.md",
]

[tasks.references]
name = "Reference check and roadmap layout"
summary = '''
A marathon release that ships one reference check beside lint-context, resolving reference
comments as architecture's scripts/check.sh does and fetched pinned in CI, and moves the roadmap
to a root roadmap/ directory with index.toml, with a migration step for each. A plan session
moves the coordinator's roadmap once the release is installed.
'''
repos = ["claude-plugins"]

[tasks.go-tools]
name = "marathon's tools as Go release binaries"
summary = '''
lint-context, lint-references, marathon, and wrap-formats become Go commands released as
binaries on each marathon/vX.Y.Z tag, pinned through mise's github: backend. A session runs them
through the plugin's bin/ shims, and no Python remains in claude-plugins. Releases
marathon/v0.21.0.
'''
repos = ["claude-plugins"]

[tasks.ai-hosting]
name = "ai-hosting adopts 0.21.0"
summary = '''
mise pins marathon's tools, and the check calls lint-context and lint-references; context/ comes
under budget with a capability map; comments come to the five kinds, restated reasoning moving
behind a reference comment; each link to the coordinator's roadmap points at
standards-lab/roadmap/index.toml.
'''
repos = ["ai-hosting"]

[tasks.shim]
name = "marathon's shims keep their mise overrides to themselves"
summary = '''
The bin/ shims stop passing MISE_OVERRIDE_CONFIG_FILENAMES and MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES
to the commands marathon runs, so `marathon check` and `marathon currency` read the project's mise
config. Releases marathon/v0.21.1.
'''
repos = ["claude-plugins"]

[tasks.architecture]
name = "architecture adopts 0.21.0"
summary = '''
architecture's check calls lint-context and switches its own reference resolution to marathon's
reference check; its context/README.md gains a capability map. principles/comments.md drops its
closing "No code repository follows it yet".
'''
repos = ["architecture"]
