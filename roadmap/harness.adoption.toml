name = "Every repository aligned with marathon 0.21.0"
summary = '''
Brings every repository in ~/architecture, and the four unarchived spikes, into line with
marathon 0.21.0: each check calls lint-context and lint-references, context comes under budget
with a built-and-planned capability map, and code and configuration comments come to
architecture's five kinds, restated reasoning moving to its source of truth behind a reference
comment. Archived spikes stay as they are.
'''
repos = [
  "claude-plugins",
  "ai-hosting",
  "go-core",
  "sqlate",
  "docproc",
  "go-database",
  "go-web-sdk",
  "go-observability",
  "go-storage",
  "go-ai",
  "go-messaging",
  "blobfs",
  "go-cli-sdk",
  "go-web-sdk-template",
  "go-cli-sdk-template",
  "docinfer",
  "web-tooling",
  "web-foundation",
  "web-icons",
  "web-components",
  "web-app-sdk",
  "webappgen",
  "go-web-service",
  "architecture",
  "spike-model-gateway",
  "spike-model-engines",
  "spike-hosting-upgrades",
  "spike-harness-driver",
]
root = "claude-plugins"
order = [
  "references",
  "go-tools",
  "ai-hosting",
  "core",
  "docproc",
  "go-ai",
  "go-libraries",
  "templates",
  "web",
  "go-web-service",
  "architecture",
  "spikes",
]
context = [
  "claude-plugins/context/harness-optimization.md",
  "architecture/principles/comments.md",
]

[tasks.references]
name = "Reference check and roadmap layout"
summary = '''
A marathon release that ships one reference check beside lint-context, resolving reference
comments as architecture's scripts/check.sh does and fetched pinned in CI, and moves the roadmap
to a root roadmap/ directory with index.toml, with a migration step for each. A plan session
moves the coordinator's roadmap once the release is installed.
'''
repos = ["claude-plugins"]

[tasks.go-tools]
name = "marathon's tools as Go release binaries"
summary = '''
lint-context, lint-references, marathon, and wrap-formats become Go commands released as
binaries on each marathon/vX.Y.Z tag, pinned through mise's github: backend. A session runs them
through the plugin's bin/ shims, and no Python remains in claude-plugins. Releases
marathon/v0.21.0.
'''
repos = ["claude-plugins"]

[tasks.ai-hosting]
name = "ai-hosting adopts 0.21.0"
summary = '''
mise pins marathon's tools, and the check calls lint-context and lint-references; context/ comes
under budget with a capability map; comments come to the five kinds, restated reasoning moving
behind a reference comment; each link to the coordinator's roadmap points at
standards-lab/roadmap/index.toml.
'''
repos = ["ai-hosting"]

[tasks.core]
name = "go-core and sqlate adopt 0.21.0"
summary = "The ai-hosting task's adoption, in go-core and sqlate."
repos = ["go-core", "sqlate"]

[tasks.docproc]
name = "docproc adopts 0.21.0"
summary = '''
The ai-hosting task's adoption, in docproc, including its goal record's sections over budget.
'''
repos = ["docproc"]

[tasks.go-ai]
