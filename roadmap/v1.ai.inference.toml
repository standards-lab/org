name = "docinfer, the inference library"
summary = '''
docinfer, from spike-ai-pipeline's docinfer (`internal/docinfer` and `cmd/docinfer`): an adjacent
library above go-ai's tier. Its base module requires docproc and go-ai v0.4.0 and holds the
pipeline over go-ai's client with extraction, the cache and `docinfertest`'s suite, `chunk`,
`join`, and `job`; the nested `docinfer/postgres` holds the cache in PostgreSQL over sqlate, and
the nested `cmd/docinfer` is its command. Each module starts at v0.1.0 on its own tags, the base
tagged first. docinfer's package docs are its built API's one home, and its `context/command.md`,
`command-api.md`, and `command-report.md` notes hold cmd/docinfer's planned design.
'''
repos = ["go-ai", "docinfer"]
root = "docinfer"
remote = "https://github.com/standards-lab/docinfer.git"
path = "~/architecture/docinfer"
order = ["design", "go-ai", "library", "job", "postgres", "docinfer", "acceptance"]
context = [
  "standards-lab/context/ai-strategy.md",
  "standards-lab/context/data-intelligence.md",
]

[tasks.design]
name = "Design review of docinfer"
summary = '''
Opens with Fable 5.2 evaluations of spike-ai-pipeline's docinfer at 6a631f1, its library sources and
`cmd/docinfer`, against the full architecture standards, docproc's `context/layers.md` at commit
f3633c3, go-ai v0.3.0 as released, and Cerebro's requirements, and settles each finding with the
architect, one review round per evaluation. Writes docinfer's design note, which takes over
`layers.md`'s docinfer sections, restated in go-ai v0.3.0's names. Settles the join of work in
flight (golang.org/x/sync/singleflight or docinfer's own), `cmd/docinfer`'s report shape, docinfer's
STANDARDS.md, and the task that releases each tag. No code.
'''

[tasks.go-ai]
name = "go-ai fixes at their root"
summary = '''
What docinfer's design found missing in go-ai, fixed there rather than worked around: exports
v0.3.0's `internal/aitest` as `aitest`, the fake OpenAI-compatible endpoint docinfer's library,
`cmd/docinfer`, `tools/infer`, and Cerebro's tests share, scriptable per request and holding
requests until released; adds `(*protocol.Response).OutputText`, replacing go-ai's three private
copies (`transcribe.go`, `tools/infer`'s `domain.go`, `docs/quick-start.md`); and adds
`(*Client).TranscriptionMode()`, so a cache key reads the mode from the client. Tags v0.4.0, before
docinfer's v0.1.0.
'''
repos = ["go-ai"]

[tasks.library]
name = "The inference library"
summary = '''
docinfer's base module, from the spike at 6a631f1, built to the design note on go-ai v0.4.0: the root package's pipeline with
extraction, `Bounds`, the cache with its filesystem and memory implementations and
`docinfertest`'s suite, golden keys and a golden chunk corpus, batches as made, and docinfer's
shapes; its own claim table for work in flight; no defaults, a value below 1 refused with
`ErrRequest`; extraction tested against `aitest`; `chunk`; and `join`, from
spike-ai-pipeline-processing v0.9.0's audio join. Builds docinfer's CI with its Go module
releases. Tags v0.1.0, after go-ai v0.4.0.
'''

[tasks.job]
name = "One job"
summary = '''
docinfer's `job` package: one job's dispatch, then inference, under the job's own context, over
docproc's dispatcher and the pipeline. `job.New` takes a `Config` and refuses a `CheckpointEvery`
below 1. It checkpoints at the low watermark, `Done` counts outputs by part ID, a content the store
misses drops its part's index entry and stops the attempt as transient, and it holds no output back
until its part's event, the root's doc stating the consumer's contract. Tags v0.2.0.
'''

[tasks.postgres]
name = "The cache in PostgreSQL"
summary = '''
The nested `docinfer/postgres` module: `docinfer.Cache` in PostgreSQL over sqlate and
sqlate/postgres, one row per key, a batch's `Get` in one query, and its migrations, which the host
applies. It passes `docinfertest`'s suite, the one the base module's caches pass, on scratch
databases from sqlate/postgres/pgtest, with a compose PostgreSQL, the root go.work, and a CI
integration job. Its first CHANGELOG entry says "new". Tags postgres/v0.1.0.
'''

[tasks.docinfer]
name = "docinfer"
summary = '''
The nested `cmd/docinfer` module, from the spike's `cmd/docinfer`, started from
go-cli-sdk-template `template/v0.3.0` on go-cli-sdk v0.4.0 and go-core v0.12.0, building the
design note's C1–C24 and L4: it reads a `cmd/docproc` run directory at schema "2" through
docproc's `rundir`, feeds `Pipeline.Run`, and writes its own directory at schema "2". Its clients
are graph nodes over go-ai's `Client.Models`, with the transport and stream timeouts and the
transcription mode the design note sets. Its report is per run, one page per input content, every
text whole. Tags cmd/docinfer/v0.1.0.
'''

[tasks.acceptance]
name = "Acceptance of docinfer"
summary = '''
Reruns `cmd/docinfer` over v1.ai.processing's accepted ~/docs run, and docinfer's model tiers, and
fixes what it finds, never redesigning (moved from v1.ai.processing's `acceptance`); it also
exercises extraction against the live gateway. The accepted run is the one v1.ai.processing's
`final` task kept, at `~/runs/docproc/final`, run id `01a208e5-e581-7b95-b43a-0f91f8d3b40e`
(docproc's docs/acceptance.md, "The ~/docs run"). The spike's run is the baseline: 3,470 images,
1,254 windows, and 28,937 chunk lines in 6.0 h, with 0 failures. Whether it runs through the
gateway or straight against the workstations' rows is its own plan's.
'''
