name = "The ~/docs corpus"
summary = '''
~/docs inspires docs-corpus: a curated public corpus whose every sample exercises a scenario in
the underlying libraries that no other sample covers, or is an input a listed measurement reads,
with its files published as release assets on each version's tag, shared to the model hosts, and
run as capstone.data-intelligence's baseline. Once v0.2.0's reruns repoint the acceptance
citations, ~/docs is removed.
'''
repos = ["docs-corpus", "docproc", "docinfer", "ai-hosting"]
root = "docs-corpus"
order = [
  "review",
  "curate",
  "docproc-final",
  "snapshot",
  "measurement-set",
  "truth",
  "sourcing",
  "snapshot-2",
  "baseline",
]
criteria = [
  "docs-corpus v0.1.0 and v0.2.0 are tagged with their release assets, and the check passes over each.",
  "Every sample in v0.2.0 exercises a library scenario no other sample covers, or is an input a listed measurement reads, which names the acceptance section it reruns.",
  "gb10-2 holds a verified fetch of v0.2.0.",
  "docproc's and docinfer's runs over v0.2.0 are the capstone's baseline, their acceptance cites v0.2.0, and ~/docs is removed.",
]

[tasks.review]
name = "Coverage review"
summary = '''
A coverage data file and page in docs-corpus mapping the scenarios docproc and docinfer exercise
to the ~/docs samples that exercise them, on three axes: library IDs, traits, and features. Each
sample is adopted, trimmed, or replaced; only redistributable samples are adopted; and every gap
names a verified candidate, sourced or generated, never hand-built. Cerebro and Athena add no
scenarios until their design tasks close.
'''
proof = "The page places or trims every ~/docs sample, and names a candidate for every gap."

[tasks.curate]
name = "The curated set"
summary = '''
Builds the set in docs-corpus from the review's adopt list and gap candidates, sourced or
generated, with their truth, their manifest entries, `covers` in the review's vocabulary, and
`version = 1` in MANIFEST.json, and adds the fetch step that verifies release assets against the
manifest's sha256.
'''
proof = "docs-corpus' check passes over the curated set, with no duplicate scenarios."

[tasks.docproc-final]
name = "The corpus on docproc's final release"
summary = '''
First removes onenote.rs's generated timing sections (`onenote/large/Large Desktop.one`, adopted;
`Large OneDrive.one`, ~/docs only), whose pseudo-word pages were noise in docinfer's acceptance
(escalation 7): corpus files, MANIFEST.json, placement, coverage, docproc's final run and
acceptance citations, and the onenote spike's sources. STANDARDS.md gains a realistic-content
standard, checked by docs/coverage.md's `fit`: "A sample's content is realistic: real-language text
and images at the density and count a real document of its kind holds." Then re-curates at
docproc-coverage's final release once that goal syncs: both placements rerun, dispositions and
covers follow, gap covers the release changes by design are matched, and exec-4's polyglot
gap reopens.
'''
proof = "Neither OneNote timing section remains in the corpus or docproc's acceptance citations, docs-corpus' check passes with both placements from docproc-coverage's final release, and dispose, manifest, and place-traits reproduce their files."
context = [
  "docinfer/docs/acceptance.md",
  "docproc/CHANGELOG.md",
  "docproc/docs/acceptance.md",
]

[tasks.snapshot]
name = "Snapshot v0.1.0"
summary = '''
Tags v0.1.0, publishes one release asset per format area (each under 2 GiB), makes docs-corpus
public, and verifies a fetch on gb10-2. A pending edit writes the coordinator's
`context/docs-corpus.md`.
'''
proof = "A fresh fetch at v0.1.0 on gb10-2 passes the check."

[tasks.measurement-set]
name = "The measurement set"
summary = '''
Lets the corpus hold measurement inputs: redistributable files that repeat an adopted sample's
scenarios but that a targeted acceptance measurement reruns over, with their truth. STANDARDS.md
gains the measurement-input standard; `docs/measurements.json` lists each measurement, the
acceptance section it serves, and the inputs it reads; dispose gains the `measure` disposition;
MANIFEST.json, still schema version 1, names in an optional `measures` each measurement that reads
a file; and the check exempts measurement inputs from the covers rules while still requiring a
license reading and redistributability. No samples are added.
'''
repos = ["docs-corpus"]
proof = "docs-corpus' check passes with the empty measurement list, dispose and manifest reproduce their files, and fixture tests show a listed duplicate disposed `measure` and an unlisted one trimmed."

[tasks.truth]
name = "Measurement inputs and their truth"
summary = '''
Writes the seven measurements into `docs/measurements.json` (word error rate, transcription, PDF
page text, vision re-probe, shared gs, peak memory, office-and-mail) over about 80 ~/docs inputs
and their truth, records the license readings they lack, copies them in with
`mise run manifest --copy`, reruns docproc over the corpus and `place-traits --corpus`, and
regenerates coverage and the manifest through dispose and manifest. Needs ~/docs and
~/runs/docs-corpus/docproc-final.
'''
repos = ["docs-corpus"]
proof = "docs-corpus' check passes with every listed input in MANIFEST.json, and place-traits, dispose, and manifest reproduce their files."

[tasks.sourcing]
name = "Sourcing guidance"
summary = '''
From truth's retro (findings 1, 3, 4). STANDARDS.md gains two judgement calls: a sourced candidate
is sought first in government publications (US federal works, govinfo.gov first; EU documents),
redistributable only when cleared for public release, with contractor works and embedded
third-party material read like any other; and a license reading is the publisher's own statement
at the source's own URL, never a statute, mirror, or aggregator. `mise run place-traits` runs
against mise's pinned tools rather than the older system ffprobe, magick, and bsdtar, retiring
baseline's `go run` workaround.
'''
repos = ["docs-corpus"]
proof = "STANDARDS.md states both judgement calls, and `mise run place-traits --corpus` reproduces docs/corpus-placement.json on the laptop with no PATH set by hand."

[tasks.snapshot-2]
name = "Snapshot v0.2.0"
summary = '''
Tags v0.2.0 and publishes one release asset per format area (each under 2 GiB), then gb10-2
refetches `~/docs-corpus` at v0.2.0 and verifies it.
'''
repos = ["docs-corpus"]
proof = "A fresh fetch at v0.2.0 on gb10-2 passes the check."

[tasks.baseline]
name = "The capstone's baseline"
summary = '''
Runs `docproc` and `docinfer` over v0.2.0 on the laptop through v1.ai.hosting's hosts, records the
timings and counts in docs-corpus as the reference capstone.data-intelligence measures against,
reruns PDF page text, the vision re-probe, and its confirmation over the corpus, and repoints
docproc's and docinfer's acceptance citations to v0.2.0. The other targeted reruns go to a backlog
goal, their inputs already in the corpus. Rebuilds ai-hosting's bench inputs from the corpus run,
commits docinfer's acceptance recipes, then removes ~/docs and every run built from it. A pending
edit replaces data-intelligence.md's 6.0 h and 3.1 s baseline. The check then fails placeholder
URLs.
'''
repos = ["docs-corpus", "docproc", "docinfer", "ai-hosting"]
