name = "The ~/docs corpus"
summary = '''
~/docs inspires docs-corpus: a curated public corpus whose every sample exercises a scenario in
the underlying libraries that no other sample covers, with its files published as release assets
on each version's tag, shared to the model hosts, and run as capstone.data-intelligence's
baseline. Once v1's reruns repoint the acceptance citations, ~/docs is removed.
'''
repos = ["docs-corpus"]
root = "docs-corpus"
order = ["review", "curate", "docproc-final", "snapshot", "baseline"]
criteria = [
  "docs-corpus v1 is tagged with its release assets, and its check passes over it.",
  "Every sample in v1 exercises a library scenario no other sample covers.",
  "gb10-2 holds a verified fetch of v1.",
  "docproc's and docinfer's runs over v1 are the capstone's baseline, their acceptance cites v1, and ~/docs is removed.",
]

[tasks.review]
name = "Coverage review"
summary = '''
A coverage data file and page in docs-corpus mapping the scenarios docproc and docinfer exercise
to the ~/docs samples that exercise them, on three axes: library IDs, traits, and features. Each
sample is adopted, trimmed, or replaced; only redistributable samples are adopted; and every gap
names a verified candidate, sourced or generated, never hand-built. Cerebro and Athena add no
scenarios until their design tasks close.
'''
proof = "The page places or trims every ~/docs sample, and names a candidate for every gap."

[tasks.curate]
name = "The curated set"
summary = '''
Builds the set in docs-corpus from the review's adopt list and gap candidates, sourced or
generated, with their truth, their manifest entries, `covers` in the review's vocabulary, and
`version = 1` in MANIFEST.json, and adds the fetch step that verifies release assets against the
manifest's sha256.
'''
proof = "docs-corpus' check passes over the curated set, with no duplicate scenarios."

[tasks.docproc-final]
name = "The corpus on docproc's final release"
summary = '''
First removes onenote.rs's generated timing sections (`onenote/large/Large Desktop.one`, adopted;
`Large OneDrive.one`, ~/docs only), whose pseudo-word pages were noise in docinfer's acceptance
(escalation 7): corpus files, MANIFEST.json, placement, coverage, docproc's final run and
acceptance citations, and the onenote spike's sources. STANDARDS.md gains a realistic-content
standard, checked by docs/coverage.md's `fit`: "A sample's content is realistic: real-language text
and images at the density and count a real document of its kind holds." Then re-curates at
docproc-coverage's final release once that goal syncs: both placements rerun, dispositions and
covers follow, gap covers the release changes by design are matched, and exec-4's polyglot
gap reopens.
'''
proof = "Neither OneNote timing section remains in the corpus or docproc's acceptance citations, docs-corpus' check passes with both placements from docproc-coverage's final release, and dispose, manifest, and place-traits reproduce their files."
context = [
  "docinfer/docs/acceptance.md",
  "docproc/CHANGELOG.md",
  "docproc/docs/acceptance.md",
]

[tasks.snapshot]
name = "Snapshot v1"
summary = '''
Tags v1, publishes one release asset per format area (each under 2 GiB), makes docs-corpus
public, and verifies a fetch on gb10-2. A pending edit writes the coordinator's
`context/docs-corpus.md`.
'''
proof = "A fresh fetch at v1 on gb10-2 passes the check."

[tasks.baseline]
name = "The capstone's baseline"
summary = '''
Runs `docproc` and `docinfer` over v1 through v1.ai.hosting's hosts, records the timings and
counts in docs-corpus as the reference capstone.data-intelligence measures against, repoints
docproc's and docinfer's acceptance citations to v1, and removes ~/docs. A pending edit replaces
data-intelligence.md's 6.0 h and 3.1 s baseline.
'''
